      <div class="m-body">
        <div class="faint" style="font-size:11px; margin-bottom:10px;">
          ${escapeHtml(o.order_no||"")} · ${escapeHtml(when)} · ${escapeHtml(t("edit_order_hint"))}
        </div>
        <div class="two-col">
          <div class="form-row"><label>${escapeHtml(t("name"))}</label>
            <input id="oe-name" value="${escapeHtml(o.customer_name||"")}"></div>
          <div class="form-row"><label>${escapeHtml(t("phone"))}</label>
            <input id="oe-phone" value="${escapeHtml(o.customer_phone||"")}"></div>
        </div>
        <div class="form-row"><label>${escapeHtml(t("payment_method"))}</label>
          <select id="oe-pay">
            <option value="Cash" ${pay==="Cash"?"selected":""}>Cash</option>
            <option value="Card" ${pay==="Card"?"selected":""}>Card</option>
            <option value="Other" ${pay==="Other"?"selected":""}>Other</option>
          </select></div>
        <hr class="sep">
        <div style="display:flex; align-items:center; gap:8px;">
          <h3 style="flex:1;">${escapeHtml(t("line_items_edit"))}</h3>
          <button class="btn" id="oe-add">${escapeHtml(t("add_line"))}</button>
        </div>
        <div id="oe-items" style="margin-top:8px;"></div>
        <hr class="sep">
        <div class="totals">
          <div class="row"><span class="muted">${escapeHtml(t("subtotal"))}</span><span id="oe-sub">0</span></div>
          <div class="row disc"><span class="muted">${escapeHtml(t("discount"))}</span>
            <input type="number" id="oe-disc" min="0" step="1000" value="${Number(o.discount)||0}"></div>
          <div class="row"><span class="muted">${escapeHtml(t("delivery"))}</span>
            <input type="number" id="oe-deliv" min="0" step="1000" value="${Number(o.delivery)||0}"
                   style="width:110px; text-align:right; padding:5px 6px; font-size:11px;"></div>
          <hr class="sep">
          <div class="row grand"><span>${escapeHtml(t("total"))}</span><span id="oe-total">0</span></div>
        </div>
      </div>
      <div class="m-foot">
        <button class="btn danger" id="oe-del">🗑 ${escapeHtml(t("delete"))}</button>
        <button class="btn" id="oe-cancel">${escapeHtml(t("cancel"))}</button>
        <button class="btn primary" id="oe-save">${escapeHtml(t("save"))}</button>
      </div>`;
  },

  _bind(){
    const $ = id => document.getElementById(id);
    $("oe-x").addEventListener("click", ()=>Modal.close());
    $("oe-cancel").addEventListener("click", ()=>Modal.close());
    $("oe-disc").addEventListener("input", ()=>this._recalc());
    $("oe-deliv").addEventListener("input", ()=>this._recalc());
    $("oe-add").addEventListener("click", ()=>{
      this._items.push({
        id:null, order_id:this._id, product_id:null, name:"", qty:1,
        unit_price:0, options:"", note:"", line_total:0,
      });
      this._renderItems();
      this._recalc();
    });
    $("oe-del").addEventListener("click", ()=>this._delete());
    $("oe-save").addEventListener("click", ()=>this._save());
    this._renderItems();
  },

  _renderItems(){
    const host = document.getElementById("oe-items");
    if (!host) return;
    if (!this._items.length){
      host.innerHTML = `<div class="faint" style="padding:6px 0;">${escapeHtml(t("no_items"))}</div>`;
      return;
    }
    const sym = DB.settings.currency_symbol;
    host.innerHTML = this._items.map((it, idx)=>`
      <div class="oe-line" data-idx="${idx}"
           style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
        <input data-k="name" value="${escapeHtml(it.name||"")}" style="flex:2; min-width:80px;">
        <input data-k="qty" type="number" min="1" step="1"
               value="${Number(it.qty)||1}" style="width:62px;">
        <input data-k="unit_price" type="number" min="0" step="1000"
               value="${Number(it.unit_price)||0}" style="width:112px;">
        <span class="oe-line-total faint"
              style="min-width:88px; text-align:right; font-weight:700; font-size:11px;">
          ${escapeHtml(fmtMoney((Number(it.qty)||0)*(Number(it.unit_price)||0), sym))}</span>
        <button class="btn icon" data-remove="${idx}" style="color:var(--danger);">✕</button>
      </div>`).join("");

    host.querySelectorAll(".oe-line").forEach(line=>{
      const idx = Number(line.dataset.idx);
      line.querySelectorAll("input[data-k]").forEach(inp=>{
        inp.addEventListener("input", ()=>{
          const it = this._items[idx];
          if (!it) return;
          const k = inp.dataset.k;
          if (k === "name") it.name = inp.value;
          else if (k === "qty") it.qty = Math.max(1, Number(inp.value)||1);
          else if (k === "unit_price") it.unit_price = Math.max(0, Number(inp.value)||0);
          const tot = line.querySelector(".oe-line-total");
          if (tot) tot.textContent =
            fmtMoney((Number(it.qty)||0)*(Number(it.unit_price)||0), sym);
          this._recalc();
        });
      });
    });
    host.querySelectorAll("[data-remove]").forEach(b=>{
      b.addEventListener("click", ()=>{
        this._items.splice(Number(b.dataset.remove), 1);
        this._renderItems();
        this._recalc();
      });
    });
  },

  _recalc(){
    const $ = id => document.getElementById(id);
    const subtotal = this._items.reduce((a,it)=>
      a + (Number(it.qty)||0)*(Number(it.unit_price)||0), 0);
    const disc  = Math.max(0, Number(($("oe-disc") ||{}).value)||0);
    const deliv = Math.max(0, Number(($("oe-deliv")||{}).value)||0);
    const total = Math.max(0, subtotal - disc) + deliv;
    if ($("oe-sub"))   $("oe-sub").textContent   = fmtMoneyDual(subtotal, DB.settings);
    if ($("oe-total")) $("oe-total").textContent = fmtMoneyDual(total, DB.settings);
    this._calc = { subtotal, discount:disc, delivery:deliv, total };
    return this._calc;
  },

  _applyStockDelta(oldItems, newItems){
    const map = new Map();
    for (const it of oldItems){
      if (it.product_id == null) continue;
      map.set(it.product_id, (map.get(it.product_id)||0) + (Number(it.qty)||0));
    }
    for (const it of newItems){
      if (it.product_id == null) continue;
      map.set(it.product_id, (map.get(it.product_id)||0) - (Number(it.qty)||0));
    }
    for (const [pid, delta] of map){
      if (!delta) continue;
      const p = DB.getProduct(pid);
      if (!p || !p.track_stock) continue;
      p.stock = Number(p.stock||0) + delta;
      DB.save("products");
      const mv = {
        id:newId(), product_id:pid, change:delta,
        reason:"Edit " + (this._row.order_no||""), created_at: nowIso(),
      };
      DB.stock_moves.push(mv);
      Persist.put("stock_moves", mv);
      Persist.adjustStock(pid, delta);
    }
  },

  _save(){
    const c = this._recalc();
    const row = DB.orders.find(o => o.id === this._id);
    if (!row){ toast("Order not found", "error"); return; }

    const items = [];
    for (const it of this._items){
      const qty  = Math.max(1, Number(it.qty)||1);
      const unit = Math.max(0, Number(it.unit_price)||0);
      items.push({
        id: it.id || newId(),
        order_id: this._id,
        product_id: (it.product_id != null ? it.product_id : null),
        name: String(it.name||"").trim() || "Item",
        qty, unit_price: unit,
        options: it.options || "",
        note: it.note || "",
        line_total: qty * unit,
      });
    }
    if (!items.length){ toast(t("no_items"), "warning"); return; }

    const oldItems = DB.order_items
      .filter(i => i.order_id === this._id)
      .map(i => cloneJson(i));
    try{ this._applyStockDelta(oldItems, items); }
    catch(e){ console.warn("stock delta failed:", e); }

    DB.updateOrder(this._id, {
      customer_name:  (document.getElementById("oe-name").value||"").trim(),
      customer_phone: (document.getElementById("oe-phone").value||"").trim(),
      payment_method: document.getElementById("oe-pay").value || "Cash",
      subtotal: c.subtotal,
      discount: c.discount,
      delivery: c.delivery,
      tax: Number(row.tax)||0,
      total: c.total,
    });
    DB.replaceOrderItems(this._id, items);
    DB.saveAll();

    Modal.close();
    toast(t("order_updated_report"), "success");
    if (this._onDone) this._onDone();
  },

  _delete(){
    if (!confirm(t("delete_order_q"))) return;
    const ok = DB.deletePaidOrder(this._id, { restock:true });
    if (!ok){ toast("Order not found", "error"); return; }
    Modal.close();
    toast(t("order_deleted"), "success");
    if (this._onDone) this._onDone();
  },
};

        if (inp.dataset.c !== undefined){
          const ch = (g.choices||[])[Number(inp.dataset.c)];
          if (!ch) return;
          if (k === "price") ch.price = Number(inp.value) || 0;
          else ch.label = inp.value;
          return;
        }
        if (k === "multi" || k === "large_only") g[k] = inp.checked;
        else if (k === "max_choices") g.max_choices = Math.max(0, Number(inp.value)||0);
        else g[k] = inp.value;
      });
    });
    host.querySelectorAll("[data-add-choice]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const gi = Number(b.dataset.addChoice);
        this.opts[gi].choices.push({ label:"", price:0 });
        this.renderOpts();
      });
    });
    host.querySelectorAll("[data-del-choice]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const parts = b.dataset.delChoice.split(":");
        const gi = Number(parts[0]), ci = Number(parts[1]);
        this.opts[gi].choices.splice(ci, 1);
        this.renderOpts();
      });
    });
    host.querySelectorAll("[data-del-group]").forEach(b=>{
      b.addEventListener("click", ()=>{
        this.opts.splice(Number(b.dataset.delGroup), 1);
        this.renderOpts();
      });
    });
  },
  save(){
    this.syncForm();
    const d = this.draft;
    if (!d.name){ toast(t("product_name_required"), "warning"); return; }
    const clean = this.opts.map(g=>({
      name: String(g.name||"").trim(),
      multi: !!g.multi,
      large_only: !!g.large_only,
      max_choices: Number(g.max_choices) || 0,
      choices: (g.choices||[])
        .map(c=>({ label:String(c.label||"").trim(), price:Number(c.price)||0 }))
        .filter(c=>c.label),
    })).filter(g=>g.name && g.choices.length);
    const payload = {
      name: d.name, emoji: d.emoji || "🍕", category_id: d.category_id,
      price: Number(d.price)||0, cost: Number(d.cost)||0,
      stock: Number(d.stock)||0, low_stock: Number(d.low_stock)||5,
      track_stock: d.track_stock ? 1 : 0, active: d.active ? 1 : 0,
      has_options: clean.length ? 1 : 0,
      custom_options: clean.length ? JSON.stringify(clean) : "",
      size_prices: d.size_prices || "",
    };
    const id = DB.saveProduct(payload, d.id);
    DB.saveAll();
    Modal.close();
    toast(this.isNew ? t("product_added") : t("product_updated"), "success");
    if (this.onSaved) this.onSaved(id);
  },
};

const CategoriesEditor = {
  onDone:null,
  open(onDone){ this.onDone = onDone || null; Modal.open(""); this.render(); },
  close(){ Modal.close(); if (this.onDone) this.onDone(); },
  render(){
    const cats = DB.categoriesSorted();
    const counts = {};
    for (const p of DB.products){
      if (p.category_id) counts[p.category_id] = (counts[p.category_id]||0) + 1;
    }
    Modal._render(`
      <div class="m-head">
        <h2>${escapeHtml(t("categories"))}</h2>
        <button class="btn ghost" id="ce-x">✕</button>
      </div>
      <div class="m-body">
        <div class="faint" style="font-size:11px; margin-bottom:10px; line-height:1.6;">
          ${escapeHtml(t("categories_hint"))}
        </div>
        <div id="ce-list">
          ${cats.map(c=>`
            <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px;" data-id="${c.id}">
              <input value="${escapeHtml(c.name)}" data-name="${c.id}" style="flex:1;">
              <span class="faint" style="font-size:10px; white-space:nowrap;">${counts[c.id]||0} ${escapeHtml(t("items_count"))}</span>
              <button class="btn icon" data-up="${c.id}" title="↑">↑</button>
              <button class="btn icon" data-down="${c.id}" title="↓">↓</button>
              <button class="btn icon" data-del-cat="${c.id}" style="color:var(--danger);" title="${escapeHtml(t("delete"))}">✕</button>
            </div>`).join("") || `<div class="faint" style="padding:10px 0;">${escapeHtml(t("no_categories"))}</div>`}
        </div>
        <hr class="sep">
        <div style="display:flex; gap:6px;">
          <input id="ce-new" placeholder="${escapeHtml(t("new_category_placeholder"))}" style="flex:1;">
          <button class="btn primary" id="ce-add">${escapeHtml(t("add"))}</button>
        </div>
      </div>
      <div class="m-foot"><button class="btn primary" id="ce-done">${escapeHtml(t("done"))}</button></div>`);
    document.getElementById("ce-x").addEventListener("click", ()=>this.close());
    document.getElementById("ce-done").addEventListener("click", ()=>this.close());
    document.getElementById("modal").querySelectorAll("input[data-name]").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const id = Number(inp.dataset.name);
        const c = DB.categories.find(x=>x.id === id);
        if (!c) return;
        c.name = inp.value;
        Persist.put("categories", c);
        DB.save("categories");
        if (this.onDone) this.onDone();
      });
    });
    const move = (id, dir)=>{
      const list = DB.categoriesSorted();
      const idx = list.findIndex(c=>c.id === id);
      const j = idx + dir;
      if (idx < 0 || j < 0 || j >= list.length) return;
      const tmp = list[idx]; list[idx] = list[j]; list[j] = tmp;
      list.forEach((c, i)=>{ c.sort_order = i; Persist.put("categories", c); });
      DB.saveAll();
      if (this.onDone) this.onDone();
      this.render();
    };
    document.getElementById("modal").querySelectorAll("[data-up]").forEach(b=>{
      b.addEventListener("click", ()=>move(Number(b.dataset.up), -1));
    });
    document.getElementById("modal").querySelectorAll("[data-down]").forEach(b=>{
      b.addEventListener("click", ()=>move(Number(b.dataset.down), +1));
    });
    document.getElementById("modal").querySelectorAll("[data-del-cat]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const id = Number(b.dataset.delCat);
        const c = DB.categories.find(x=>x.id === id);
        if (!c) return;
        const used = DB.products.filter(p=>p.category_id === id).length;
        const msg = used ? `Delete "${c.name}"? ${used} product(s) will become uncategorised.`
                         : `Delete "${c.name}"?`;
        if (!confirm(msg)) return;
        for (const p of DB.products){
          if (p.category_id === id){ p.category_id = null; Persist.put("products", p); }
        }
        DB.categories = DB.categories.filter(x=>x.id !== id);
        Persist.remove("categories", id);
        DB.saveAll();
        if (POSPage.current_cat === id) POSPage.current_cat = null;
        if (this.onDone) this.onDone();
        this.render();
        toast(t("category_deleted"), "success");
      });
    });
    document.getElementById("ce-add").addEventListener("click", ()=>{
      const inp = document.getElementById("ce-new");
      const name = (inp.value||"").trim();
      if (!name){ toast(t("enter_name"), "warning"); return; }
      DB.saveCategory({ name, sort_order: DB.categories.length });
      DB.saveAll();
      inp.value = "";
      if (this.onDone) this.onDone();
      this.render();
      toast(t("category_added"), "success");
    });
  },
};

    if (!rows.length){

      return;
    }
    tb.innerHTML = rows.map(p=>{
      const cat = p.category_id ? DB.categories.find(c=>c.id === p.category_id) : null;
      const stock = p.track_stock ? String(p.stock|0) : "—";
      let opts = t("no");
      if ((p.custom_options||"").trim()){
        try{
          const a = JSON.parse(p.custom_options);
          opts = (Array.isArray(a) && a.length) ? a.map(g=>g.name).join(", ") : t("no");
        }catch(e){ opts = "Custom"; }
      } else if (p.has_options) opts = "Default";
      return `<tr data-id="${p.id}">
        <td>${escapeHtml(p.emoji||"")}</td>
        <td>${escapeHtml(p.name)}${p.active ? "" : ' <span class="faint">(hidden)</span>'}</td>
        <td>${escapeHtml(cat ? cat.name : "—")}</td>
        <td><button class="btn ghost" data-act="price" style="padding:3px 8px; white-space:nowrap;">${fmtMoney(p.price, sym)} ✎</button></td>
        <td>${fmtMoney(p.cost, sym)}</td>
        <td>${stock}</td>
        <td class="faint" style="font-size:11px;">${escapeHtml(opts)}</td>
        <td>
          <button class="btn icon" data-act="edit">${escapeHtml(t("edit"))}</button>
          <button class="btn icon" data-act="dup">${escapeHtml(t("copy"))}</button>
          <button class="btn icon" data-act="del" style="color:var(--danger);">${escapeHtml(t("delete"))}</button>
        </td></tr>`;
    }).join("");
    tb.querySelectorAll("tr").forEach(tr=>{
      const p = DB.getProduct(Number(tr.dataset.id));
      if (!p) return;
      tr.querySelectorAll("button").forEach(b=>{
        const act = b.dataset.act;
        if (act === "edit") b.addEventListener("click", ()=>this.edit(p));
        else if (act === "price") b.addEventListener("click", ()=>this.quickPrice(p));
        else if (act === "dup") b.addEventListener("click", ()=>this.duplicate(p));
        else if (act === "del") b.addEventListener("click", ()=>{
          if (!confirm(t("delete_product_q"))) return;
          DB.deleteProduct(p.id); DB.saveAll();
          this.render(); POSPage.renderProducts();
          toast(t("product_deleted"), "success");
        });
      });
    });
  },
  edit(p){
    ProductEditor.open(p ? p.id : null, ()=>{
      this.render();
      POSPage.renderProducts();
      POSPage.refreshCategories();
    });
  },
  quickPrice(p){
    PricePrompt.open({
      title: t("edit_product_price"),
      subtitle: `${p.emoji||"🍕"}  ${p.name}`,
      value: p.price, baseValue: p.price, qty: 1,
      footer: t("product_price_footer"),
      onApply: v=>{
        p.price = v;
        Persist.put("products", p);
        DB.save("products");
        this.render();
        POSPage.renderProducts();
        toast(t("price_updated") + fmtMoney(v), "success");
      },
    });
  },
  duplicate(p){
    const copy = cloneJson(p);
    delete copy.id;
    copy.name = p.name + " (copy)";
    DB.saveProduct(copy, null);
    DB.saveAll();
    this.render();
    POSPage.renderProducts();
    toast(t("product_duplicated"), "success");
  },
};

    document.getElementById("rep-from").value = this.from;
    document.getElementById("rep-to").value   = this.to;
    document.getElementById("rep-from").addEventListener("change", e=>{
      this.from = e.target.value; this._activeQuick = null; this._paintQuick(); this.render();
    });
    document.getElementById("rep-to").addEventListener("change", e=>{
      this.to = e.target.value; this._activeQuick = null; this._paintQuick(); this.render();
    });
    document.getElementById("rep-apply").addEventListener("click", ()=>{
      this._activeQuick = null; this._paintQuick(); this.render();
    });
    el.querySelectorAll("[data-q]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const q = Number(b.dataset.q);
        this.from = addDaysStr(todayStr(), -q);
        this.to = todayStr();
        this._activeQuick = String(q);
        document.getElementById("rep-from").value = this.from;
        document.getElementById("rep-to").value = this.to;
        this._paintQuick();
        this.render();
      });
    });
    document.getElementById("rep-print-cc").addEventListener("click", async ()=>{
      const text = buildCloseCashText(this.from, this.to, DB.settings);
      await Printer.printText(text, DB.settings);
    });
    document.getElementById("rep-sync-cc").addEventListener("click", async ()=>{
      if (DB.settings.firebase_enabled !== "1"){ toast(t("cloud_sync_first"), "warning"); return; }
      const res = await CloudSync.pushCloseCash(this.from, this.to);
      if (res.ok) toast(t("close_cash_synced"), "success");
      else toast(t("firebase_sync_failed") + res.info, "error", 5000);
    });
    document.getElementById("rep-reset").addEventListener("click", ()=>{
      ResetReports.open(()=>{
        this.render();
        POSPage.renderTabs();
        POSPage.updateCartFab();
      });
    });

    this._paintQuick();
    this.render();
  },

  _paintQuick(){
    const el = document.getElementById("page-reports");
    if (!el) return;
    el.querySelectorAll("[data-q]").forEach(b=>{
      b.classList.toggle("active", String(this._activeQuick) === b.dataset.q);
    });
  },

  render(){
    const s = this.from, e = this.to;
    const settings = DB.settings;
    const sym = settings.currency_symbol;
    const summ = DB.summary(s, e);
    const profit = summ.revenue - summ.expenses;
    const cards = document.getElementById("rep-cards");
    if (cards) cards.innerHTML = `
      <div class="card metric-card"><div class="lbl">${escapeHtml(t("orders"))}</div><div class="val">${summ.orders}</div></div>
      <div class="card metric-card"><div class="lbl">${escapeHtml(t("revenue"))}</div><div class="val">${fmtMoney(summ.revenue, sym)}</div></div>
      <div class="card metric-card"><div class="lbl">${escapeHtml(t("discount"))}</div><div class="val">${fmtMoney(summ.discount, sym)}</div></div>
      <div class="card metric-card"><div class="lbl">${escapeHtml(t("expenses"))}</div><div class="val">${fmtMoney(summ.expenses, sym)}</div></div>
      <div class="card metric-card"><div class="lbl">${escapeHtml(t("net_profit"))}</div><div class="val">${fmtMoney(profit, sym)}</div></div>`;

    const tTop = document.getElementById("rep-top");
    if (tTop) tTop.innerHTML = DB.topProducts(s,e).map(r=>
      `<tr><td>${escapeHtml(r.name)}</td><td>${r.qty|0}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");
    const tCat = document.getElementById("rep-cat");
    if (tCat) tCat.innerHTML = DB.salesByCategory(s,e).map(r=>
      `<tr><td>${escapeHtml(r.category)}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");
    const tPm = document.getElementById("rep-pm");
    if (tPm) tPm.innerHTML = DB.salesByMethod(s,e).map(r=>
      `<tr><td>${escapeHtml(r.method)}</td><td>${r.c}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");
    const tDays = document.getElementById("rep-days");
    if (tDays) tDays.innerHTML = DB.salesByDay(s,e).map(r=>
      `<tr><td>${escapeHtml(r.day)}</td><td>${r.orders}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");

    /* ── Recent Orders list — click a row (or any icon) to view,
       reprint, EDIT or DELETE the order. ── */
    const ordersEl = document.getElementById("rep-orders");
    if (ordersEl){
      const orders = DB.paidOrdersWithItems(s, e);
      if (!orders.length){
        ordersEl.innerHTML = `<div class="held-empty">${escapeHtml(t("no_orders_in_range"))}</div>`;
      } else {
        ordersEl.innerHTML = orders.map(o=>{
          const num = String(o.order_no||"").split("-").pop();
          const when = (o.created_at||"").slice(11,16);
          const date = (o.created_at||"").slice(5,10);
          return `<div class="order-item" data-id="${o.id}">
            <div class="ono">#${escapeHtml(num)}</div>
            <div class="ocust">${escapeHtml(o.customer_name || "—")}</div>
            <div class="otime">${escapeHtml(date)} ${escapeHtml(when)}</div>
            <div class="ototal">${fmtMoney(o.total, sym)}</div>
            <div class="oact">
              <button class="btn icon" data-act="receipt" title="${escapeHtml(t("view_receipt"))}">🧾</button>
              <button class="btn icon" data-act="reprint" title="${escapeHtml(t("reprint"))}">🖨</button>
              <button class="btn icon" data-act="edit" title="${escapeHtml(t("order_edit"))}">✏️</button>
              <button class="btn icon" data-act="del" style="color:var(--danger);"
                      title="${escapeHtml(t("delete_order"))}">🗑</button>
            </div>
          </div>`;
        }).join("");
        ordersEl.querySelectorAll(".order-item").forEach(row=>{
          const id = Number(row.dataset.id);
          row.addEventListener("click", e=>{
            if (e.target.closest("button")) return;
            ReportsPage._openReceipt(id);
          });
          row.querySelectorAll("button").forEach(b=>{
            b.addEventListener("click", async ev=>{
              ev.stopPropagation();
              const act = b.dataset.act;
              if (act === "receipt"){
                ReportsPage._openReceipt(id);
              } else if (act === "reprint"){
                const snap = DB.buildReceiptSnapshot(id);
                if (!snap){ toast("Order not found", "error"); return; }
                const res = await Printer.print(snap, DB.settings);
                if (res && res.ok) toast(t("print_job_sent"), "success");
              } else if (act === "edit"){
                ReportsPage._editOrder(id);
              } else if (act === "del"){
                ReportsPage._deleteOrder(id);
              }
            });
          });
        });
      }
    }

    const cash = DB.cashSummary(s,e);
    const info = document.getElementById("rep-cc-info");
    if (info) info.innerHTML =
      `<b>${escapeHtml(t("cash_orders"))}:</b> ${cash.cash_orders} • ` +
      `<b>${escapeHtml(t("cash_sales"))}:</b> ${fmtMoney(cash.cash_sales, sym)} ` +
      `<span class="faint">(${fmtMoneySecondary(cash.cash_sales, settings)})</span> • ` +
      `<b>${escapeHtml(t("expenses"))}:</b> ${fmtMoney(cash.expenses, sym)} ` +
      `<span class="faint">(${fmtMoneySecondary(cash.expenses, settings)})</span><br>` +
      `<b>${escapeHtml(t("expected_drawer"))}:</b> ${fmtMoney(cash.expected, sym)} ` +
      `<span class="faint">(${fmtMoneySecondary(cash.expected, settings)})</span>`;
  },

  _openReceipt(orderId){
    const snap = DB.buildReceiptSnapshot(orderId);
    if (!snap){ toast("Order not found", "error"); return; }
    ReceiptDialog.show(snap);
  },

  /* Open the full order editor (customer, payment, line items, totals). */
  _editOrder(orderId){
    OrderEditor.open(orderId, ()=>{
      this.render();
      try{
        POSPage.renderProducts();
        POSPage.renderTabs();
        POSPage.updateCartFab();
      }catch(e){}
    });
  },

  /* Permanently delete the order and return its items to stock. */
  _deleteOrder(orderId){
    const o = DB.orders.find(x=>x.id === orderId);
    if (!o){ toast("Order not found", "error"); return; }
    if (!confirm(t("delete_order_q"))) return;
    const ok = DB.deletePaidOrder(orderId, { restock:true });
    if (!ok){ toast("Order not found", "error"); return; }
    toast(t("order_deleted"), "success");
    this.render();
    try{
      POSPage.renderProducts();
      POSPage.renderTabs();
      POSPage.updateCartFab();
    }catch(e){}
  },
};

/* ═══════════════════ FIREBASE REST ═══════════════════ */
function _firestoreValue(v){
  if (v === null || v === undefined) return { nullValue:null };
  if (typeof v === "boolean") return { booleanValue: v };
  if (typeof v === "number"){
    if (Number.isInteger(v)) return { integerValue: String(v) };
    return { doubleValue: v };
  }
  if (typeof v === "string") return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(_firestoreValue) } };
  if (typeof v === "object"){
    const fields = {};
    for (const k of Object.keys(v)) fields[k] = _firestoreValue(v[k]);
    return { mapValue: { fields } };
  }
  return { stringValue: String(v) };
}
function _firestoreDoc(obj){
  const fields = {};
  for (const k of Object.keys(obj)) fields[k] = _firestoreValue(obj[k]);
  return { fields };
}
const FirebaseSync = {
  _idToken: null, _authError: null,
  async _token(){
    const t = await CloudDB.token();
    if (t) return t;
    if (this._idToken) return this._idToken;
    return await this._signInAnonymous();
  },
  async _signInAnonymous(){
    const url = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`;
    try{
      const r = await fetch(url, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ returnSecureToken:true }),
      });
      const data = await r.json();
      if (data && data.idToken){ this._idToken = data.idToken; this._authError = null; return this._idToken; }
      this._idToken = null;
      this._authError = data && data.error ? (data.error.message || "auth failed") : "no token";
    }catch(e){ this._idToken = null; this._authError = String(e); }
    return null;
  },
  async pushDocument(collection, data){
    const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/${collection}?key=${FIREBASE_CONFIG.apiKey}`;
    const token = await this._token();
    const headers = { "Content-Type":"application/json" };
    if (token) headers["Authorization"] = `Bearer ${token}`;
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 15000);
      let r;
      try{
        r = await fetch(url, {
          method:"POST", headers, body: JSON.stringify(_firestoreDoc(data)), signal: ctrl.signal,
        });
      } finally { clearTimeout(timer); }
      if (r.ok){
        const j = await r.json().catch(()=> ({}));
        const name = j && j.name ? j.name.split("/").pop() : "";
        return { ok:true, info:"HTTP " + r.status, id:name };
      }
      const detail = await r.text();
      return { ok:false, info:`HTTP ${r.status}: ${detail.slice(0,220)}` };
    }catch(e){
      return { ok:false, info: e.name === "AbortError" ? "timeout" : String(e) };
    }
  },
};
const CloudSync = {
  _warned: false,
  enabled(){ return DB.settings.firebase_enabled === "1"; },
  _col(key, def){ return (DB.settings[key] || def || "").trim() || def; },
  async pushOrder(o){
    if (!this.enabled()) return { ok:false, info:"disabled" };
    const doc = {
      order_no: o.no, order_type: o.type, customer: o.customer_name||"",
      customer_id: o.customer_id||null, customer_phone: o.customer_phone||"",
      subtotal: +o.subtotal||0, discount: +o.discount||0,
      delivery: +o.delivery||0, total: +o.total||0,
      currency: (DB.settings.currency_symbol||"LBP ").trim(),
      payment: o.payment_method||"Cash",
      created_at: nowIso(),
      items: (o.items||[]).map(i=>({
        name:i.name||"", qty:+i.qty||1, unit:+i.unit||0, line:+i.line||0,
        options:(i.options||[]).map(x=>x.label||""), note:i.note||"",
      })),
    };
    return await FirebaseSync.pushDocument(this._col("firebase_collection_orders","orders"), doc);
  },
  async pushCustomer(c){
    if (!this.enabled()) return { ok:false, info:"disabled" };
    return await FirebaseSync.pushDocument(
      this._col("firebase_collection_customers","customers"),
      { name:c.name||"", phone:c.phone||"", address:c.address||"", created_at: nowIso() });
  },
  async pushCloseCash(start, end){
    if (!this.enabled()) return { ok:false, info:"disabled" };
    const cash = DB.cashSummary(start, end);
    return await FirebaseSync.pushDocument(
      this._col("firebase_collection_cash","close_cash"),
      { from:start, to:end, cash_orders:cash.cash_orders, cash_sales:cash.cash_sales,
        expenses:cash.expenses, expected:cash.expected,
        currency:(DB.settings.currency_symbol||"LBP ").trim(), created_at: nowIso() });
  },
  async queuePrintJob(job){
    if (!this.enabled()) throw new Error("Firebase disabled");
    const col = this._col("firebase_collection_print_jobs", "print_jobs");
    const doc = {
      printer_name: job.printer_name || "",
      order_no: job.order_no || "",
      cut: job.cut || "partial",
      cut_each: job.cut_each !== false,
      drawer: job.drawer === true,
      copies: job.copies || 1,
      data: job.data || [],
      order: job.order || null,
      status: "pending",
      source: "pizza_pos_web",
      created_by: CloudDB.uid || null,
      created_at: nowIso(),
    };
    const res = await FirebaseSync.pushDocument(col, doc);
    if (!res.ok) throw new Error(res.info);
    return res;
  },
};

const PWA = {
  deferredPrompt: null, _swRegistered: false,
  isIOS(){
    const ua = navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  },
  isAndroid(){ return /Android/i.test(navigator.userAgent || ""); },
  isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.matchMedia("(display-mode: fullscreen)").matches ||
           window.matchMedia("(display-mode: minimal-ui)").matches ||
           window.navigator.standalone === true;
  },
  makeIcon(size, maskable){
    const c = document.createElement("canvas");
    c.width = size; c.height = size;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0f172a";
    if (!maskable && ctx.roundRect){
      const r = size * 0.18;
      ctx.beginPath(); ctx.roundRect(0, 0, size, size, r); ctx.fill();
    } else { ctx.fillRect(0, 0, size, size); }
    const pad = maskable ? size * 0.22 : 0;
    const glyph = size - pad * 2;
    ctx.font = `${Math.round(glyph * 0.86)}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    try { ctx.fillText("🍕", size/2, size/2 + glyph * 0.05); } catch(e){}
    return c.toDataURL("image/png");
  },
  attachManifest(){
    let icon192 = "", icon512 = "", icon512m = "";
    try{
      icon192  = this.makeIcon(192, false);
      icon512  = this.makeIcon(512, false);
      icon512m = this.makeIcon(512, true);
    }catch(e){}
    const dir  = new URL(".", location.href).href;
    const self_ = location.origin + location.pathname + location.search;
    const manifest = {
      id: dir,
      name: "Pizza POS — Restaurant Management Suite",
      short_name: "PizzaPOS",
      description: "Pizza POS — Restaurant Management Suite",
      lang: "en", dir: "ltr",
      start_url: self_, scope: dir,
      display: "standalone",
      display_override: ["standalone", "minimal-ui"],
      orientation: "any",
      background_color: "#f4f6f9",
      theme_color: "#0f172a",
      categories: ["business", "productivity", "food"],
      prefer_related_applications: false,
      icons: [
        { src: icon192,  sizes: "192x192", type: "image/png", purpose: "any" },
        { src: icon512,  sizes: "512x512", type: "image/png", purpose: "any" },
        { src: icon512m, sizes: "512x512", type: "image/png", purpose: "maskable" },
      ],
    };
    let href = "";
    try{
      href = URL.createObjectURL(new Blob(
        [JSON.stringify(manifest)],
        { type: "application/manifest+json" }
      ));
    }catch(e){}
    if (href){
      let link = document.querySelector('link[rel="manifest"]');
      if (!link){ link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
      link.href = href;
    }
    try{
      let ati = document.querySelector('link[rel="apple-touch-icon"]');
      if (!ati){ ati = document.createElement("link"); ati.rel = "apple-touch-icon"; document.head.appendChild(ati); }
      ati.setAttribute("sizes", "180x180");
      ati.href = icon192 || icon512;
    }catch(e){}
  },
  async registerServiceWorker(){
    if (this._swRegistered) return;
    if (!("serviceWorker" in navigator)) return;
    if (!isSecureContext_()) return;
    try{
      const probe = await fetch("sw.js", { method:"HEAD" }).catch(()=> null);
      if (!probe || !probe.ok) return;
      await navigator.serviceWorker.register("sw.js", { scope: "./" });
      this._swRegistered = true;
    }catch(e){}
  },
  bindInstallButton(){
    const btn = document.getElementById("install-btn");
    if (!btn || btn._bound) return;
    btn._bound = true;
    btn.addEventListener("click", ()=>this.requestInstall());
    this.refreshButton();
  },
  refreshButton(){
    const btn = document.getElementById("install-btn");
    if (!btn) return;
    if (this.isStandalone()){ btn.classList.remove("show"); return; }
    btn.classList.add("show");
  },
  async requestInstall(){
    if (this.isStandalone()){ toast("Already installed", "success"); return; }
    if (this.deferredPrompt){
      const prompt = this.deferredPrompt;
      this.deferredPrompt = null;
      try{
        prompt.prompt();
        await prompt.userChoice;
      }catch(e){}
      this.refreshButton();
      return;
    }
    this.showInstallHelp();
  },
  showInstallHelp(){
    const secure = isSecureContext_();
    let steps;
    if (this.isIOS()){
      steps = [
        "Open this page in <b>Safari</b>.",
        "Tap the <b>Share</b> icon.",
        "Scroll and tap <b>Add to Home Screen</b>.",
        "Name it <b>Pizza POS</b> and tap <b>Add</b>."
      ];
    } else if (this.isAndroid()){
      steps = [
        "Open the browser menu <b>⋮</b>.",
        "Tap <b>Install app</b>.",
        "Confirm with <b>Install</b>."
      ];
    } else {
      steps = [
        "Look for the <b>install</b> icon in your address bar.",
        "Or browser menu → <b>Install Pizza POS</b>.",
        "Confirm the prompt."
      ];
    }
    Modal.open(`<div class="m-head"><h1>📲  Install Pizza POS</h1></div>
      <div class="m-body">
        <ol class="install-steps">${steps.map(s=>`<li>${s}</li>`).join("")}</ol>
        ${ secure ? "" : `
          <div class="install-warn">⚠ <b>This page is not served over HTTPS.</b> Phones only allow installation from a secure origin.</div>` }
      </div>
      <div class="m-foot"><button class="btn primary" id="pwa-help-close">${escapeHtml(t("ok"))}</button></div>`);
    document.getElementById("pwa-help-close").addEventListener("click", ()=>Modal.close());
  },
  setup(){
    this.attachManifest();
    this.bindInstallButton();
    window.addEventListener("beforeinstallprompt", (e)=>{
      e.preventDefault();
      this.deferredPrompt = e;
      this.refreshButton();
    });
    window.addEventListener("appinstalled", ()=>{
      this.deferredPrompt = null;
      this.refreshButton();
      toast("Installed 🍕", "success");
    });
    const mq = window.matchMedia("(display-mode: standalone)");
    const onChange = ()=>this.refreshButton();
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
    this.registerServiceWorker();
  },
};

function isStandalone(){ return PWA.isStandalone(); }

/* ═══════════════════ APP ═══════════════════ */
const App = {
  user: null, page: "pos",
  _pagesInited: false, _syncTimer: null, _pollTimer: null,

  async init(){
    PWA.setup();
    const status = document.getElementById("login-cloud");
    await DB.load(msg => { if (status) status.textContent = msg ? "☁ " + msg : ""; });

    /* Local device role — must never be overwritten by the cloud. */
    const localRole = STORE.get("device_role", "");
    if (localRole === "store"){
      DB.settings.printer_store_listener = "1";
      DB.settings.printer_mode           = "browser";
    } else if (localRole === "remote"){
      DB.settings.printer_store_listener = "0";
      DB.settings.printer_mode           = "cloud";
    }
    DB.save("settings");

    I18n.apply(DB.settings.language || "en");
    this.applyTheme(DB.settings.theme || "light");
    this.bindLogin();
    this.bindMisc();
    SyncStatus.render();

    if (status){
      if (CloudDB.ready){
        status.textContent = t("shared_ok");
      } else if (DB.settings.firebase_enabled === "1"){
        status.innerHTML = t("shared_fail") + "<br><span class='faint'>" +
          escapeHtml(CloudDB.error || "") + "</span>";
      } else {
        status.textContent = t("local_only");
      }
    }

    PrintListener.start();
    if (this._pollTimer) clearInterval(this._pollTimer);
    this._pollTimer = setInterval(()=>{
      if (PrintListener.isEnabled()) PrintListener.poll();
    }, 20000);
  },

  bindLogin(){
    const btn = document.getElementById("login-btn");
    const onEnter = e => { if (e.key === "Enter") btn.click(); };
    document.getElementById("login-user").addEventListener("keydown", onEnter);
    document.getElementById("login-pass").addEventListener("keydown", onEnter);
    btn.addEventListener("click", async ()=>{
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value;
      const err = document.getElementById("login-err");
      err.textContent = "";
      if (!u || !p){ err.textContent = t("enter_creds"); return; }
      try{
        const user = await DB.authenticate(u, p);
        if (!user){ err.textContent = t("invalid_creds"); return; }
        this.user = user;
        this.start();
      }catch(e){
        err.textContent = t("login_error") + e.message;
      }
    });
  },

  bindMisc(){
    const fab = document.getElementById("cart-fab");
    if (fab) fab.addEventListener("click", ()=>POSPage.openCartSheet());
    const refresh = ()=>{ POSPage.updateCartFab(); PWA.refreshButton(); };
    window.addEventListener("resize", refresh);
    window.addEventListener("orientationchange", ()=>setTimeout(refresh, 200));

    window.addEventListener("online", ()=>{
      SyncStatus.set(CloudDB.ready ? "synced" : "local",
        CloudDB.ready ? "Back online" : "Offline — local data only");
      if (DB.settings.firebase_enabled === "1" && !CloudDB.ready){
        CloudDB._initPromise = null;
        CloudDB.init().then(ok=>{
          if (ok){
            try{ Realtime.start(); }catch(e){}
            SyncStatus.set("synced", "Reconnected after offline");
          }
        });
      } else if (CloudDB.ready){
        Realtime.restart();
      }
      if (PrintListener.isEnabled()) PrintListener.restart();
    });
    window.addEventListener("offline", ()=>{
      SyncStatus.set("local", "Offline — changes will sync when back online");
    });

    document.getElementById("theme-btn").addEventListener("click", ()=>{
      const cur = DB.settings.theme || "light";
      const next = cur === "light" ? "dark" : "light";
      DB.settings.theme = next;
      DB.save("settings");
      Persist.putObject("settings", DB.settings);
      this.applyTheme(next);
      const sel = document.getElementById("s-theme");
      if (sel) sel.value = next;
    });

    document.getElementById("lang-btn").addEventListener("click", ()=>{
      const next = I18n.lang === "ar" ? "en" : "ar";
      DB.settings.language = next;
      DB.save("settings");
      Persist.putObject("settings", DB.settings);
      I18n.apply(next);
      const sel = document.getElementById("s-language");
      if (sel) sel.value = next;
      toast(next === "ar" ? "تم تغيير اللغة إلى العربية" : "Language switched to English", "success");
    });

    document.querySelectorAll(".navbtn").forEach(b=>{
      b.addEventListener("click", ()=>this.nav(b.dataset.page));
    });
  },

  start(){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").classList.add("on");
    const initials = (this.user.full_name || this.user.username)
      .split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join("") || "US";
    document.getElementById("user-avatar").textContent = initials;
    document.getElementById("user-who").textContent =
      `${this.user.full_name || this.user.username}  •  ${this.user.role}`;

    if (!this._pagesInited){
      try{ POSPage.init(); }catch(e){ console.error("POSPage.init", e); }
      try{ ProductsPage.init(); }catch(e){ console.error("ProductsPage.init", e); }
      try{ CustomersPage.init(); }catch(e){ console.error("CustomersPage.init", e); }
      try{ ExpensesPage.init(); }catch(e){ console.error("ExpensesPage.init", e); }
      try{ ReportsPage.init(); }catch(e){ console.error("ReportsPage.init", e); }
      try{ SettingsPage.init(); }catch(e){ console.error("SettingsPage.init", e); }
      this._pagesInited = true;
    }
    this.nav("pos");
    PWA.refreshButton();
    if (PrintListener.isEnabled()) PrintListener.start();
  },

  nav(page){
    this.page = page;
    document.querySelectorAll(".navbtn").forEach(b=>{
      b.classList.toggle("active", b.dataset.page === page);
    });
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    const el = document.getElementById("page-" + page);
    if (el) el.classList.add("on");
    const titles = {
      pos: t("nav_pos"), products: t("nav_products"),
      customers: t("nav_customers"), expenses: t("nav_expenses"),
      reports: t("nav_reports"), settings: t("nav_settings")
    };
    document.getElementById("page-title").textContent = titles[page] || page;

    try{
      if (page === "pos"){
        POSPage.renderTabs(); POSPage.renderProducts(); POSPage.recalc();
        if (!isMobile()) POSPage.closeCartSheet();
      } else if (page === "products") ProductsPage.render();
      else if (page === "customers")  CustomersPage.render();
      else if (page === "expenses")   ExpensesPage.render();
      else if (page === "reports")    ReportsPage.render();
      else if (page === "settings")   SettingsPage.renderUsers();
    }catch(e){ console.error("nav render error:", e); }
    POSPage.updateCartFab();
  },

  scheduleSyncRefresh(){
    if (this._syncTimer) return;
    this._syncTimer = setTimeout(()=>{
      this._syncTimer = null;
      this.refreshAfterSync();
    }, 250);
  },
  refreshAfterSync(){
    if (!this._pagesInited) return;
    try{
      if (this.page === "pos"){
        POSPage.refreshCategories();
        POSPage.renderProducts();
        POSPage.renderTabs();
        POSPage.updateOrderHeader();
        POSPage.updateCartFab();
      } else if (this.page === "products")  ProductsPage.render();
      else if (this.page === "customers")   CustomersPage.render();
      else if (this.page === "expenses")    ExpensesPage.render();
      else if (this.page === "reports")     ReportsPage.render();
      else if (this.page === "settings")    SettingsPage.renderUsers();
    }catch(e){ console.warn("refreshAfterSync:", e); }
  },
  applyTheme(theme){
    document.body.classList.toggle("dark", theme === "dark");
    if (DB.settings) DB.settings.theme = theme;
    const mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute("content", theme === "dark" ? "#0a0f1c" : "#0f172a");
  },
};

window.addEventListener("error", e=>{
  console.error("Global error:", e.error || e.message);
});
window.addEventListener("unhandledrejection", e=>{
  console.error("Unhandled rejection:", e.reason);
});

window.addEventListener("DOMContentLoaded", ()=>{
  App.init().catch(err=>{
    console.error("Init failed:", err);
    const el = document.getElementById("login-err");
    if (el) el.textContent = "Startup error: " + (err.message || err);
    try{
      if (!App._pagesInited){ App.bindLogin(); App.bindMisc(); }
    }catch(e){}
  });
});
</script>
</body>
</html>
