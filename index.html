      document.getElementById("opt-note").addEventListener("input", e=>{ state.note = e.target.value; });
      document.getElementById("opt-add").addEventListener("click", ()=>finalize());
      document.getElementById("modal").querySelectorAll(".opt-chip").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const g = btn.dataset.grp, l = btn.dataset.label;
          if (g === "Size"){
            state.size = (state.size === l) ? null : l;
            if (state.size !== "Large") state.flavorSet.clear();
          } else if (g === "Flavor"){
            if (state.flavorSet.has(l)) state.flavorSet.delete(l);
            else {
              if (state.flavorSet.size >= 2) state.flavorSet.delete(state.flavorSet.values().next().value);
              state.flavorSet.add(l);
            }
          } else {
            const grp = groups.find(x=>x.name === g);
            state.groups[g] = state.groups[g] || {};
            if (grp && !grp.multi) state.groups[g] = { [l]: true };
            else state.groups[g][l] = !state.groups[g][l];
          }
          const active = document.activeElement;
          const wasNote = active && active.id === "opt-note";
          rebuild();
          if (wasNote){
            const el = document.getElementById("opt-note");
            if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          }
        });
      });
    };

    const finalize = ()=>{
      const chosen = [];
      const isLarge = state.size === "Large";
      for (const grp of groups){
        if (grp.large_only && !isLarge) continue;
        if (grp.name === "Size"){
          if (state.size){
            const ch = grp.choices.find(c=>c.label === state.size);
            chosen.push({ group:grp.name, label:state.size, price: ch?ch.price:0 });
          }
        } else if (grp.name === "Flavor"){
          for (const l of state.flavorSet){
            const ch = grp.choices.find(c=>c.label === l);
            chosen.push({ group:grp.name, label:l, price: ch?ch.price:0 });
          }
        } else {
          const sel = state.groups[grp.name] || {};
          for (const l of Object.keys(sel)){
            if (sel[l]){
              const ch = grp.choices.find(c=>c.label === l);
              chosen.push({ group:grp.name, label:l, price: ch?ch.price:0 });
            }
          }
        }
      }
      if (isLarge){
        const flavors = chosen.filter(c=>c.group === "Flavor");
        if (flavors.length < 1){
          toast("Please choose at least 1 flavor for a Large pizza.", "warning");
          return;
        }
      }
      const unit = computeUnitPrice(p, chosen);
      const note = (state.note||"").trim();
      Modal.close();
      this.addItemToCart(p, state.qty, chosen, unit, note);
    };

    Modal.open("");
    rebuild();
  },

  renderCart(){
    const wrap = document.getElementById("cart-list");
    if (!wrap) return;
    const items = this.current_order ? this.current_order.items : [];
    if (!items.length){
      wrap.innerHTML = `<div class="cart-empty">Cart is empty<br>Click a product to add it</div>`;
      return;
    }
    const s = DB.settings;
    wrap.innerHTML = items.map(it=>{
      const opts = optLabels(it).join(", ");
      const note = (it.note||"").trim();
      return `<div class="cart-line" data-key="${escapeHtml(it.key)}">
        <div class="info">
          <div class="nm">${escapeHtml(it.emoji||"")} ${escapeHtml(it.name)}</div>
          ${opts?`<div class="opts">${escapeHtml(opts)}</div>`:""}
          ${note?`<div class="note">📝 ${escapeHtml(note)}</div>`:""}
          <div class="unit">${fmtMoney(it.unit, s.currency_symbol)}  (${fmtMoneySecondary(it.unit, s)})</div>
        </div>
        <div class="qty-ctrl">
          <button data-act="dec">−</button>
          <div class="q">${it.qty}</div>
          <button data-act="inc">+</button>
        </div>
        <div class="total">${fmtMoney(it.line, s.currency_symbol)}
          <div class="usd">${fmtMoneySecondary(it.line, s)}</div></div>
        <button class="btn icon" data-act="del">✕</button>
      </div>`;
    }).join("");
    wrap.querySelectorAll(".cart-line").forEach(line=>{
      const key = line.dataset.key;
      line.querySelectorAll("button").forEach(b=>{
        b.addEventListener("click", ()=>{
          const act = b.dataset.act;
          if (act === "inc") this.changeQty(key, +1);
          else if (act === "dec") this.changeQty(key, -1);
          else if (act === "del") this.removeItem(key);
        });
      });
    });
  },
  changeQty(key, delta){
    for (const it of this.current_order.items){
      if (it.key === key){
        it.qty = Math.max(1, it.qty + delta);
        it.line = it.unit * it.qty;
        break;
      }
    }
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  removeItem(key){
    this.current_order.items = this.current_order.items.filter(i=>i.key !== key);
    this.renderCart(); this.recalc(); this.updateCartFab();
  },

  recalc(){
    if (!this.current_order) return;
    const s = DB.settings;
    const subtotal = this.current_order.items.reduce((a,i)=>a + (Number(i.line)||0), 0);
    const discEl = document.getElementById("disc-in");
    let disc = Number(discEl ? discEl.value : 0) || 0;
    disc = Math.max(0, disc);
    const base = Math.max(0, subtotal - disc);
    const tax = 0;
    const delivery = Number(DB.settings.delivery_fee) || 0;
    const grand = base + tax + delivery;
    Object.assign(this.current_order, { subtotal, discount:disc, tax, delivery, total:grand });
    const elSub = document.getElementById("sum-sub");
    if (elSub){
      elSub.textContent   = fmtMoneyDual(subtotal, s);
      document.getElementById("sum-del").textContent   = fmtMoneyDual(delivery, s);
      document.getElementById("sum-grand").textContent = fmtMoneyDual(grand, s);
    }
    this.updateCartFab();
  },

  renderTabs(){
    const bar = document.getElementById("pos-tabs");
    if (!bar) return;
    const orders = DB.openOrders();
    const curId = this.current_order && this.current_order.id;
    let html = `<button class="btn chip" data-id="new">+ New</button>`;
    for (const o of orders){
      const num = String(o.order_no||"").split("-").pop();
      html += `<button class="btn chip ${String(o.id) === String(curId) ? "active" : ""}" data-id="${escapeHtml(o.id)}">#${escapeHtml(num)}</button>`;
    }
    bar.innerHTML = html;
    bar.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        if (b.dataset.id === "new") this.newOrder();
        else {
          const o = orders.find(x => String(x.id) === String(b.dataset.id));
          if (o) this.loadOrder(o);
        }
      });
    });
  },
  loadOrder(o){
    this.current_order = {
      id:o.id, no:o.order_no, type:o.order_type || "Delivery",
      items: (o.items||[]).map((i, idx)=>({
        key: uid("line") + "_" + idx,
        product_id:i.product_id, name:i.name, emoji:"",
        qty:i.qty, unit:i.unit,
        options: optLabels(i).map(l => ({ label:l })),
        note: i.note || "", line:i.line,
      })),
      customer_id:o.customer_id, customer_name:o.customer_name || "",
      customer_phone:o.customer_phone || "",
      discount:Number(o.discount)||0, delivery:Number(o.delivery)||0,
    };
    document.getElementById("pos-order-lbl").textContent = "Order " + o.order_no;
    this.setCustomer(o.customer_id, o.customer_name || "");
    document.getElementById("disc-in").value = String(this.current_order.discount|0);
    this.renderCart(); this.recalc(); this.renderTabs(); this.updateCartFab();
    if (isMobile()) this.openCartSheet();
  },
  async newOrder(){
    const no = await DB.nextOrderNo();
    this.current_order = {
      id:null, no, type:"Delivery",
      items:[], customer_id:null, customer_name:"", customer_phone:"",
      discount:0, delivery:0, subtotal:0, tax:0, total:0,
    };
    const lbl = document.getElementById("pos-order-lbl");
    if (lbl) lbl.textContent = "Order " + no + "  (new)";
    this.setCustomer(null, "");
    const d = document.getElementById("disc-in");
    if (d) d.value = "0";
    this.renderCart(); this.recalc(); this.renderTabs(); this.updateCartFab();
  },
  clearOrder(){
    if (!this.current_order) return;
    if (this.current_order.items.length && !confirm("Clear this order?")) return;
    this.current_order.items = [];
    document.getElementById("disc-in").value = "0";
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  async holdOrder(){
    if (!this.current_order || !this.current_order.items.length){
      toast("Nothing to hold", "warning"); return;
    }
    const { id, name, phone } = this.resolveCustomer();
    this.current_order.customer_id = id;
    this.current_order.customer_name = name;
    this.current_order.customer_phone = phone;
    this.current_order.user_id = App.user ? App.user.id : null;
    await DB.saveOrder(this.current_order, "open");
    toast(`Order ${this.current_order.no} held`, "success");
    this.renderTabs();
    await this.newOrder();
    if (isMobile()) this.closeCartSheet();
  },

  payOrder(){
    if (!this.current_order || !this.current_order.items.length){
      toast("Cart is empty", "warning"); return;
    }
    const total = this.current_order.total;
    const s = DB.settings;
    Modal.open(`<div class="m-head"><h1>Take Payment</h1></div>
      <div class="m-body">
        <div style="font-size:14px; font-weight:700; margin-bottom:12px;">
          Total: ${fmtMoneyDual(total, s)}</div>
        <div class="muted" style="font-size:12px; margin-bottom:6px;">Payment method: Cash</div>
        <h3>Amount tendered (cash, LBP)</h3>
        <input type="number" id="pay-cash" value="${Math.round(total)}" style="margin-top:6px;">
        <div id="pay-change" class="muted" style="margin-top:8px;">Change: —</div>
      </div>
      <div class="m-foot">
        <button class="btn" id="pay-cancel">Cancel</button>
        <button class="btn success" id="pay-ok">Confirm Payment</button>
      </div>`);
    const update = ()=>{
      const v = Number(document.getElementById("pay-cash").value) || 0;
      const ch = v - total;
      const el = document.getElementById("pay-change");
      if (ch >= 0) el.textContent = "Change: " + fmtMoneyDual(ch, s);
      else el.textContent = "Insufficient cash";
    };
    document.getElementById("pay-cash").addEventListener("input", update);
    document.getElementById("pay-cancel").addEventListener("click", ()=>Modal.close());
    document.getElementById("pay-ok").addEventListener("click", ()=>{
      const v = Number(document.getElementById("pay-cash").value) || 0;
      if (v < total){ toast("Cash tendered is less than total", "warning"); return; }
      Modal.close();
      this.finalizePayment();
    });
    update();
  },

  async finalizePayment(){
    const { id, name, phone } = this.resolveCustomer();
    this.current_order.customer_id = id;
    this.current_order.customer_name = name;
    this.current_order.customer_phone = phone;
    this.current_order.payment_method = "Cash";
    this.current_order.user_id = App.user ? App.user.id : null;

    const snapshot = {
      id:this.current_order.id, no:this.current_order.no,
      type:this.current_order.type || "Delivery",
      customer_id:id, customer_name:name, customer_phone:phone,
      items:this.current_order.items.map(i=>({
        name:i.name, qty:i.qty, unit:i.unit, line:i.line,
        options: optLabels(i), note:i.note||"",
      })),
      subtotal:this.current_order.subtotal, discount:this.current_order.discount,
      tax:this.current_order.tax, delivery:this.current_order.delivery,
      total:this.current_order.total, payment_method:"Cash",
    };

    await DB.saveOrder(this.current_order, "paid");
    await DB.deductStock(snapshot);

    const S = DB.settings;
    const auto = S.printer_auto === "1";
    if (auto){
      const res = await Printer.print(snapshot, S);
      if (!res || !res.ok){
        toast("Print failed — opening receipt for manual retry.", "warning", 4500);
        ReceiptDialog.show(snapshot);
      } else {
        toast(`Paid ${fmtMoney(snapshot.total)}`, "success");
      }
    } else {
      toast(`Paid ${fmtMoney(snapshot.total)}`, "success");
      ReceiptDialog.show(snapshot);
    }

    await this.newOrder();
    if (isMobile()) this.closeCartSheet();
  },
};

        <button class="btn primary" id="p-save">Save</button>
      </div>`);

          if (!Array.isArray(parsed)) throw new Error("must be array");

      };

    const secure = isSecureContext_();
    const usbSup = USBPrinter.isSupported();
    const usbCon = USBPrinter.isConnected();
    el_.innerHTML = [
      `Mode: ${escapeHtml(mode || S.printer_mode || "browser")}`,
      `Secure context: ${secure ? '<span class="ok">yes</span>' : '<span class="bad">no</span> (needed for WebUSB)'}`,
      `crypto.subtle: ${(typeof crypto !== "undefined" && crypto.subtle) ? '<span class="ok">available</span>' : '<span class="warn">fallback used</span>'}`,
      `WebUSB supported: ${usbSup ? '<span class="ok">yes</span>' : '<span class="bad">no</span>'}`,
      `USB connected: ${usbCon ? '<span class="ok">yes</span>' : '<span class="warn">no</span>'}`,
      `Agent URL: ${S.printer_agent_url ? escapeHtml(S.printer_agent_url) : '<span class="warn">not set</span>'}`,
      `Copies: ${escapeHtml(String(S.printer_copies||"2"))} · Cut: ${escapeHtml(S.printer_cut||"partial")} · Drawer: ${S.printer_drawer==="1"?"on":"off"}`,
    ].join("\n");
  },

  refreshSyncDiag(){
    const el_ = document.getElementById("s-diag-sync");
    if (!el_) return;
    const s = Sync;
    const stateTxt =
      s.mode === "cloud" && s.state === "online" ? '<span class="ok">connected</span>' :
      s.state === "connecting" ? '<span class="warn">connecting…</span>' :
      s.state === "error" ? '<span class="bad">error</span>' :
      '<span class="warn">local only</span>';
    const rows = [
      `Mode: ${s.mode} — ${stateTxt}`,
      `Browser online: ${navigator.onLine ? '<span class="ok">yes</span>' : '<span class="bad">no</span>'}`,
      `Last sync: ${s.lastSync ? s.lastSync.toLocaleTimeString() : "—"}`,
      `Project: ${escapeHtml(FIREBASE_CONFIG.projectId)}`,
      `Signed in as: ${Cloud.auth && Cloud.auth.currentUser ? '<span class="ok">' + escapeHtml(Cloud.auth.currentUser.uid.slice(0,10)) + '…</span>' : '<span class="warn">not signed in</span>'}`,
      `Categories: ${DB.categories.length} · Products: ${DB.products.length}`,
      `Customers: ${DB.customers.length} · Orders: ${DB.orders.length}`,
      `Expenses: ${DB.expenses.length} · Users: ${DB.users.length}`,
    ];
    if (s.error) rows.push(`Last error: <span class="bad">${escapeHtml(s.error)}</span>`);
    el_.innerHTML = rows.join("\n");
  },

  renderUsers(){
    const tb = document.getElementById("s-users-tbody");
    if (!tb) return;
    const rows = [...DB.users].sort((a,b)=>String(a.username).localeCompare(String(b.username)));
    tb.innerHTML = rows.map(u=>`
      <tr data-id="${escapeHtml(u.id)}">
        <td>${escapeHtml(u.username)}</td>
        <td>${escapeHtml(u.full_name||"")}</td>
        <td>${escapeHtml(u.role||"")}</td>
        <td>${u.username === "admin" ? "" :
          `<button class="btn icon" data-act="del" style="color:var(--danger);">Delete</button>`}</td>
      </tr>`).join("");
    tb.querySelectorAll("button[data-act=del]").forEach(b=>{
      const id = b.closest("tr").dataset.id;
      b.addEventListener("click", async ()=>{
        if (confirm("Delete this user?")){
          await DB.deleteUser(id);
          this.renderUsers();
        }
      });
    });
  },
};

/* ═══════════════════ PWA ═══════════════════ */
function setupPWA(){
  function makeIcon(size){
    const c = document.createElement("canvas");
    c.width = size; c.height = size;
    const ctx = c.getContext("2d");
    const r = size * 0.18;
    ctx.fillStyle = "#0f172a";
    if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(0, 0, size, size, r); ctx.fill(); }
    else { ctx.fillRect(0, 0, size, size); }
    ctx.font = `${Math.round(size * 0.66)}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    try { ctx.fillText("🍕", size/2, size/2 + size * 0.04); } catch(e){}
    return c.toDataURL("image/png");
  }
  let icon192 = "", icon512 = "";
  try { icon192 = makeIcon(192); icon512 = makeIcon(512); } catch(e){}

  const manifest = {
    name: "Pizza POS", short_name: "PizzaPOS",
    description: "Restaurant Management Suite",
    start_url: ".", scope: ".", display: "standalone", orientation: "any",
    background_color: "#f4f6f9", theme_color: "#0f172a",
    icons: [
      { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: icon512, sizes: "512x512", type: "image/png", purpose: "maskable" },
    ],
    categories: ["business","productivity","food"],
  };
  try{
    const blob = new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" });
    const url  = URL.createObjectURL(blob);
    let link = document.querySelector('link[rel="manifest"]');
    if (!link){ link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
    link.href = url;
  }catch(e){}

  try{
    let ati = document.querySelector('link[rel="apple-touch-icon"]');
    if (!ati){ ati = document.createElement("link"); ati.rel = "apple-touch-icon"; document.head.appendChild(ati); }
    ati.href = icon192;
  }catch(e){}

  let deferredPrompt = null;
  const installBtn = document.getElementById("install-btn");
  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault(); deferredPrompt = e;
    if (installBtn) installBtn.classList.add("show");
  });
  window.addEventListener("appinstalled", ()=>{
    deferredPrompt = null;
    if (installBtn) installBtn.classList.remove("show");
    toast("Pizza POS installed", "success");
  });
  if (installBtn){
    installBtn.addEventListener("click", async ()=>{
      if (!deferredPrompt){
        toast("Use your browser menu → Add to Home Screen", "info", 4000); return;
      }
      deferredPrompt.prompt();
      try{
        const choice = await deferredPrompt.userChoice;
        if (choice && choice.outcome === "accepted") toast("Installing…", "success");
      }catch(e){}
      deferredPrompt = null;
      installBtn.classList.remove("show");
    });
  }
  if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true){
    if (installBtn) installBtn.classList.remove("show");
  }
}

/* ═══════════════════ APP ═══════════════════ */
const App = {
  user: null,
  page: "pos",
  _pagesInited: false,
  _dataTimer: null,

  async init(){
    setupPWA();
    await DB.load();
    this.applyTheme(DB.settings.theme || "light");
    this.bindLogin();
    this.bindMisc();
    this.refreshLoginNet();
    /* start cloud sync in the background — the login screen stays usable */
    Sync.boot();
  },

  refreshLoginNet(){
    const el = document.getElementById("login-net");
    if (!el) return;
    const paint = ()=>{
      if (Sync.state === "connecting") el.textContent = "☁  Connecting to cloud…";
      else if (Sync.mode === "cloud" && Sync.state === "online")
        el.textContent = "☁  Cloud connected — data shared with all devices";
      else if (Sync.state === "error")
        el.textContent = "⚠  Cloud unavailable — running on this device only";
      else
        el.textContent = "📴  Local mode — data stays on this device";
    };
    paint();
    this._loginNetTimer = setInterval(()=>{
      if (!document.getElementById("login-net")){ clearInterval(this._loginNetTimer); return; }
      paint();
    }, 1000);
  },

  bindLogin(){
    const btn = document.getElementById("login-btn");
    const onEnter = e => { if (e.key === "Enter") btn.click(); };
    document.getElementById("login-user").addEventListener("keydown", onEnter);
    document.getElementById("login-pass").addEventListener("keydown", onEnter);
    btn.addEventListener("click", async ()=>{
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value;
      const err = document.getElementById("login-err");
      err.textContent = "";
      if (!u || !p){ err.textContent = "Enter username and password"; return; }

      /* if cloud sync is still starting, wait briefly for the users list */
      if (!DB.users.length && Sync.state === "connecting"){
        err.textContent = "Connecting to cloud…";
        await Sync.waitForUsers(5000);
        err.textContent = "";
      }

      try{
        const user = await DB.authenticate(u, p);
        if (!user){
          err.textContent = DB.users.length
            ? "Invalid credentials"
            : "No accounts available — cloud unreachable";
          return;
        }
        this.user = user;
        this.start();
      }catch(e){
        err.textContent = "Login error: " + e.message;
      }
    });
  },

  bindMisc(){
    const fab = document.getElementById("cart-fab");
    if (fab) fab.addEventListener("click", ()=>POSPage.openCartSheet());
    const refresh = ()=>{ POSPage.updateCartFab(); };
    window.addEventListener("resize", refresh);
    window.addEventListener("orientationchange", ()=>setTimeout(refresh, 200));

    document.getElementById("theme-btn").addEventListener("click", ()=>{
      const cur = DB.settings.theme || "light";
      const next = cur === "light" ? "dark" : "light";
      DB.saveSettings({ theme: next });
      this.applyTheme(next);
      const sel = document.getElementById("s-theme");
      if (sel) sel.value = next;
    });

    document.querySelectorAll(".navbtn").forEach(b=>{
      b.addEventListener("click", ()=>this.nav(b.dataset.page));
    });

    const syncPill = document.getElementById("sync-pill");
    if (syncPill) syncPill.addEventListener("click", ()=>this.nav("settings"));

    const printerPill = document.getElementById("printer-pill");
    if (printerPill) printerPill.addEventListener("click", ()=>{
      this.nav("settings");
      setTimeout(()=>{
        const d = document.getElementById("s-diag");
        if (d) d.scrollIntoView({ behavior:"smooth", block:"center" });
      }, 80);
    });
  },

  start(){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").classList.add("on");
    const initials = String(this.user.full_name || this.user.username)
      .split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join("") || "US";
    document.getElementById("user-avatar").textContent = initials;
    document.getElementById("user-who").textContent =
      `${this.user.full_name || this.user.username}  •  ${this.user.role}`;

    if (!this._pagesInited){
      try{ POSPage.init(); }catch(e){ console.error("POSPage.init", e); }
      try{ ProductsPage.init(); }catch(e){ console.error("ProductsPage.init", e); }
      try{ CustomersPage.init(); }catch(e){ console.error("CustomersPage.init", e); }
      try{ ExpensesPage.init(); }catch(e){ console.error("ExpensesPage.init", e); }
      try{ ReportsPage.init(); }catch(e){ console.error("ReportsPage.init", e); }
      try{ SettingsPage.init(); }catch(e){ console.error("SettingsPage.init", e); }
      this._pagesInited = true;
    }
    this.nav("pos");
    this.refreshPills();
  },

  /* called by Sync whenever remote data changes */
  onData(){
    if (this._dataTimer) return;
    this._dataTimer = setTimeout(()=>{
      this._dataTimer = null;
      this.refreshUI();
    }, 180);
  },

  refreshUI(){
    if (!this._pagesInited) return;
    try{
      if (this.page === "pos"){
        POSPage.refreshCategories();
        POSPage.renderProducts();
        POSPage.renderTabs();
        POSPage.recalc();
      }
      else if (this.page === "products")  ProductsPage.render();
      else if (this.page === "customers") CustomersPage.render();
      else if (this.page === "expenses")  ExpensesPage.render();
      else if (this.page === "reports")   ReportsPage.render();
      else if (this.page === "settings")  SettingsPage.renderUsers();
    }catch(e){ console.error("refreshUI error:", e); }
    this.applyTheme(DB.settings.theme || "light");
  },

  nav(page){
    this.page = page;
    document.querySelectorAll(".navbtn").forEach(b=>{
      b.classList.toggle("active", b.dataset.page === page);
    });
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    const el = document.getElementById("page-" + page);
    if (el) el.classList.add("on");
    const titles = { pos:"POS", products:"Products", customers:"Customers",
                     expenses:"Expenses", reports:"Reports", settings:"Settings" };
    document.getElementById("page-title").textContent = titles[page] || page;

    try{
      if (page === "pos"){
        POSPage.renderTabs(); POSPage.renderProducts(); POSPage.recalc();
        if (!isMobile()) POSPage.closeCartSheet();
      } else if (page === "products") ProductsPage.render();
      else if (page === "customers")  CustomersPage.render();
      else if (page === "expenses")   ExpensesPage.render();
      else if (page === "reports")    ReportsPage.render();
      else if (page === "settings")   SettingsPage.renderUsers();
    }catch(e){ console.error("nav render error:", e); }

    POSPage.updateCartFab();
    this.refreshPills();
  },

  applyTheme(theme){
    document.body.classList.toggle("dark", theme === "dark");
    if (DB.settings) DB.settings.theme = theme;
    const mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute("content", theme === "dark" ? "#0a0f1c" : "#0f172a");
  },

  refreshPills(){
    /* ---- sync pill ---- */
    const pill = document.getElementById("sync-pill");
    const txt  = document.getElementById("sync-pill-txt");
    if (pill && txt){
      pill.classList.remove("ok","bad","warn");
      let cls = "warn", label = "Local";
      if (Sync.state === "connecting"){ cls = "warn"; label = "Connecting…"; }
      else if (Sync.mode === "cloud" && Sync.state === "online"){ cls = "ok"; label = "Cloud ✓"; }
      else if (Sync.mode === "cloud"){ cls = "warn"; label = "Cloud"; }
      else if (Sync.state === "error"){ cls = "bad"; label = "Offline"; }
      pill.classList.add(cls);
      txt.textContent = label;
      pill.title = Sync.error
        ? Sync.error
        : (Sync.mode === "cloud"
            ? "Cloud sync active — this device shares data with all others"
            : "Local only — enable Cloud Sync in Settings");
    }
    /* ---- printer pill ---- */
    const ppill = document.getElementById("printer-pill");
    const ptxt  = document.getElementById("printer-pill-txt");
    if (ppill && ptxt){
      const S = DB.settings;
      const mode = (S.printer_mode || "browser").toLowerCase();
      ppill.classList.remove("ok","bad","warn");
      if (mode === "usb"){
        if (!USBPrinter.isSupported()){ ppill.classList.add("bad"); ptxt.textContent = "USB n/a"; }
        else if (USBPrinter.isConnected()){ ppill.classList.add("ok"); ptxt.textContent = "USB ready"; }
        else { ppill.classList.add("warn"); ptxt.textContent = "USB off"; }
      } else if (mode === "agent"){
        ppill.classList.add(S.printer_agent_url ? "ok" : "warn");
        ptxt.textContent = S.printer_agent_url ? "Agent" : "Agent ?";
      } else if (mode === "cloud"){
        ppill.classList.add(Sync.isCloud() ? "ok" : "bad");
        ptxt.textContent = Sync.isCloud() ? "Cloud" : "Cloud off";
      } else {
        ptxt.textContent = "Browser";
      }
    }
  },
};

window.addEventListener("error", e=>{
  console.error("Global error:", e.error || e.message);
});
window.addEventListener("unhandledrejection", e=>{
  console.error("Unhandled rejection:", e.reason);
});

window.addEventListener("DOMContentLoaded", ()=>{
  App.init().catch(err=>{
    console.error("Init failed:", err);
    const el = document.getElementById("login-err");
    if (el) el.textContent = "Startup error: " + (err.message || err);
  });
});
</script>
