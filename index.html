<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pizza POS">
<meta name="description" content="Pizza POS — Restaurant Management Suite">
<title>Pizza POS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8D%95%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#f8fafc; --surface3:#eef2f7;
  --border:#e5e9f0; --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --primary:#0f172a; --on-primary:#ffffff;
  --success:#16a34a; --danger:#ef4444; --warn:#f59e0b;
  --shadow:0 2px 8px rgba(15,23,42,.06);
}
body.dark{
  --bg:#0a0f1c; --surface:#111827; --surface2:#161f31; --surface3:#1d2739;
  --border:#243049; --text:#f1f5f9; --text2:#a3b1c6; --text3:#64748b;
  --primary:#f8fafc; --on-primary:#0f172a;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
  font-family:'Inter','Segoe UI','Helvetica Neue','Noto Color Emoji','Apple Color Emoji',sans-serif;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);}
body{font-size:13px; overflow:hidden;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea,button{font-size:13px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.btn{background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:10px; padding:7px 14px; font-size:12px; font-weight:600;}
.btn:hover{background:var(--surface3);}
.btn:disabled{color:var(--text3); cursor:not-allowed; opacity:.7;}
.btn.primary{background:var(--primary); color:var(--on-primary); border:none;}
.btn.success{background:var(--success); color:#fff; border:none;}
.btn.danger{background:var(--danger); color:#fff; border:none;}
.btn.warn{background:var(--warn); color:#fff; border:none;}
.btn.ghost{background:transparent;}
.btn.chip{background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:6px 14px; font-weight:600; color:var(--text2);}
.btn.chip:hover{background:var(--surface2);}
.btn.chip.active{background:var(--primary); color:var(--on-primary); border-color:var(--primary);}
.btn.icon{background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 10px;}

input,select,textarea{background:var(--surface2); border:1px solid var(--border);
  border-radius:9px; padding:8px 10px; font-size:13px; color:var(--text);
  width:100%; outline:none; transition:border .15s; -webkit-appearance:none; appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
textarea{resize:vertical; font-family:inherit;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow);}
h1{font-size:18px; font-weight:800; letter-spacing:-.3px; margin:0 0 8px;}
h2{font-size:14px; font-weight:700; margin:0;}
h3{font-size:12px; font-weight:700; color:var(--text2); margin:0;}
.muted{color:var(--text2);}
.faint{color:var(--text3);}
.sep{background:var(--border); height:1px; border:none; margin:8px 0;}

table{width:100%; border-collapse:collapse; font-size:12px;}
th{background:var(--surface2); color:var(--text2); padding:8px; text-align:left;
  font-size:11px; font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:7px 8px; border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface2);}

#app{display:none; height:100%;}
#app.on{display:grid; grid-template-columns:76px 1fr; height:100dvh;}
.sidebar{background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; padding:14px 10px; gap:6px; overflow-y:auto;}
.sidebar .logo{font-size:30px; padding-bottom:10px;}
.navbtn{background:transparent; border:none; border-radius:12px; font-size:20px;
  width:52px; height:52px; color:var(--text3); display:flex; align-items:center;
  justify-content:center; flex-shrink:0;}
.navbtn:hover{background:var(--surface2); color:var(--text);}
.navbtn.active{background:var(--primary); color:var(--on-primary);}
.avatar{margin-top:auto; background:var(--primary); color:var(--on-primary);
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;}
.main{display:grid; grid-template-rows:52px 1fr; overflow:hidden; min-width:0;}
.topbar{background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 16px; gap:10px;}
.topbar h1{margin:0; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .spacer{flex:1;}
.pages-host{overflow:hidden; position:relative; height:100%;}

.page{display:none; height:100%;}
.page.on{display:block; overflow:auto; padding:14px;}
#page-pos{padding:0;}
#page-pos.on{display:grid; grid-template-columns:1fr 440px; gap:14px;
  padding:14px; box-sizing:border-box; overflow:hidden;}

#login{position:fixed; inset:0; background:var(--bg); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px;}
#login .box{width:380px; max-width:100%; padding:40px 40px 30px; text-align:center;}
#login .logo{font-size:60px; line-height:1;}
#login h1{margin:10px 0 4px; font-size:22px;}
#login .sub{color:var(--text3); margin-bottom:24px;}
#login input{margin-bottom:10px; padding:11px 12px; text-align:left;}
#login .err{color:var(--danger); font-size:11px; min-height:16px; margin-bottom:6px;}
#login button{width:100%; padding:12px; font-size:14px; margin-top:6px;}
#login .hint{color:var(--text3); font-size:11px; margin-top:14px;}
#login .cloud{margin-top:10px; font-size:11px;}

.pos-left{display:flex; flex-direction:column; gap:10px; min-height:0; height:100%; min-width:0;}
.pos-right{display:flex; flex-direction:column; padding:14px; gap:10px;
  overflow:hidden; min-height:0; height:100%;}
.cat-bar{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.cat-bar::-webkit-scrollbar{height:0;}
.product-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
  gap:8px; overflow:auto; flex:1; align-content:start;}
.product-card{background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:10px 8px 8px; height:118px;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer; transition:border .15s, transform .08s; user-select:none;}
.product-card:active{transform:scale(.97);}
.product-card:hover{border-color:var(--text3);}
.product-card .emoji{font-size:26px; line-height:1;}
.product-card .name{font-size:11px; font-weight:600; text-align:center;
  line-height:1.2; flex:1; overflow:hidden;}
.product-card .badge{color:var(--danger); font-size:9px; font-weight:700;}

.tabs-bar{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.tabs-bar::-webkit-scrollbar{height:0;}
.cart-list{flex:1; overflow:auto; min-height:80px;
  border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  padding:6px 0;}
.cart-empty{color:var(--text3); text-align:center; padding:30px 10px; font-size:12px;}
.cart-line{display:flex; align-items:flex-start; gap:8px; padding:8px 0;
  border-bottom:1px solid var(--border);}
.cart-line:last-child{border-bottom:none;}
.cart-line .info{flex:1; min-width:0;}
.cart-line .nm{font-weight:600; font-size:12px;}
.cart-line .opts{color:var(--text3); font-size:10px; word-break:break-word;}
.cart-line .note{color:var(--warn); font-size:10px; word-break:break-word; font-style:italic; margin-top:2px;}
.cart-line .unit{color:var(--text3); font-size:9px; margin-top:2px;}
.cart-line .qty-ctrl{display:flex; align-items:center; gap:2px; flex-shrink:0; margin-top:2px;}
.cart-line .qty-ctrl button{background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; width:26px; height:26px; padding:0;
  display:flex; align-items:center; justify-content:center; font-size:14px;}
.cart-line .qty-ctrl .q{min-width:22px; text-align:center; font-weight:700; font-size:12px;}
.cart-line .total{min-width:88px; text-align:right; font-weight:700; font-size:11px;
  flex-shrink:0; margin-top:2px;}
.cart-line .total .usd{color:var(--text3); font-size:9px; font-weight:400;}

.totals{padding:6px 0; font-size:12px;}
.totals .row{display:flex; justify-content:space-between; padding:3px 0; align-items:center; gap:8px;}
.totals .row.disc input{width:110px; padding:5px 6px; font-size:11px; text-align:right;}
.totals .grand{font-size:15px; font-weight:800; padding-top:6px;}
.pos-actions{display:flex; gap:6px; flex-shrink:0;}
.pos-actions button{flex:1; padding:10px;}
.pos-actions .pay{flex:2; font-size:14px;}

.cust-row{display:flex; gap:6px; position:relative;}
.cust-row .picker{flex:1; position:relative;}
.cust-row .picker input{padding-left:28px; padding-right:28px;}
.cust-row .picker .ico{position:absolute; left:10px; top:50%;
  transform:translateY(-50%); pointer-events:none;}
.cust-row .picker .arrow{position:absolute; right:10px; top:50%;
  transform:translateY(-50%); color:var(--text3); pointer-events:none;}
.cust-list{position:absolute; top:calc(100% + 2px); left:0; right:0; max-height:220px;
  overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:9px; box-shadow:var(--shadow); z-index:30; display:none;}
.cust-list.on{display:block;}
.cust-list .item{padding:10px; cursor:pointer; font-size:13px;
  border-bottom:1px solid var(--border);}
.cust-list .item:last-child{border-bottom:none;}
.cust-list .item:hover{background:var(--surface2);}
.cust-list .item .ph{color:var(--text3); font-size:11px;}

.page-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.page-head h1{margin:0; flex:1; min-width:120px;}
.table-wrap{background:var(--surface); border:1px solid var(--border);
  border-radius:12px; overflow-x:auto;}
.table-wrap table{min-width:520px;}

.modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:200;
  display:none; align-items:center; justify-content:center; padding:20px;
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);}
.modal-bg.on{display:flex;}
.modal{background:var(--surface); border-radius:16px; max-width:640px; width:100%;
  max-height:90vh; overflow:auto; box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal .m-head{padding:16px 20px 8px; display:flex; align-items:center; gap:10px;}
.modal .m-head h1,.modal .m-head h2{flex:1; margin:0;}
.modal .m-body{padding:8px 20px 14px;}
.modal .m-foot{padding:12px 20px 16px; display:flex; gap:8px; justify-content:flex-end;
  border-top:1px solid var(--border);}

.opt-group{margin-bottom:14px;}
.opt-group h3{margin-bottom:6px;}
.opt-chips{display:flex; flex-wrap:wrap; gap:6px;}
.opt-chip{background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:8px 14px; font-weight:600; color:var(--text2); font-size:13px;}
.opt-chip:hover{background:var(--surface2);}
.opt-chip.on{background:var(--primary); color:var(--on-primary); border-color:var(--primary);}

.report-controls{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
.report-controls input[type=date]{width:auto;}
.cards-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:10px; margin-bottom:12px;}
.metric-card{padding:12px 14px;}
.metric-card .lbl{font-size:11px; color:var(--text3);}
.metric-card .val{font-size:16px; font-weight:800; margin-top:2px; word-break:break-word;}
.report-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
  gap:12px; margin-bottom:12px;}
.report-box{padding:12px; max-height:340px; overflow:auto;}
.report-box h3{margin-bottom:8px;}

#toasts{position:fixed; bottom:20px; right:20px; z-index:300;
  display:flex; flex-direction:column; gap:8px; align-items:flex-end;
  pointer-events:none; max-width:calc(100vw - 40px);}
.toast{background:var(--surface); border:1px solid var(--border);
  border-left:3px solid var(--primary); border-radius:12px; padding:10px 14px;
  font-size:12px; font-weight:600; box-shadow:var(--shadow);
  animation:slideIn .2s ease-out; max-width:340px; pointer-events:auto;
  white-space:pre-wrap; word-break:break-word;}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
.toast.warning{border-left-color:var(--warn);}
@keyframes slideIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-row{display:grid; grid-template-columns:180px 1fr; gap:10px;
  align-items:center; margin-bottom:8px;}
.form-row label{color:var(--text2); font-size:12px;}
.form-row.checkbox{grid-template-columns:1fr; gap:4px;}
.form-row.checkbox label{display:flex; align-items:center; gap:8px; cursor:pointer;}
.form-row.checkbox input[type=checkbox]{width:auto;}

.cart-fab{position:fixed; bottom:calc(72px + env(safe-area-inset-bottom, 0px));
  right:14px; z-index:60; background:var(--primary); color:var(--on-primary);
  border:none; border-radius:24px; padding:10px 18px;
  display:none; align-items:center; gap:8px; font-weight:700; font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,.25); cursor:pointer;}
.cart-fab .count{background:rgba(255,255,255,.18); border-radius:12px; padding:1px 8px; font-size:12px;}
body.dark .cart-fab .count{background:rgba(0,0,0,.25);}
.cart-fab.hidden{display:none !important;}
.cart-close{display:none;}

#receipt-area{display:none;}

.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
  border-radius:12px; font-size:11px; font-weight:700; border:1px solid var(--border);
  background:var(--surface2); color:var(--text2); cursor:pointer; flex-shrink:0;}
.pill .dot{width:8px; height:8px; border-radius:50%; background:var(--text3);}
.pill.ok .dot{background:var(--success);}
.pill.bad .dot{background:var(--danger);}
.pill.warn .dot{background:var(--warn);}

.seg{display:inline-flex; border:1px solid var(--border); border-radius:10px;
  overflow:hidden; background:var(--surface2); flex-wrap:wrap;}
.seg button{background:transparent; border:none; padding:8px 14px; font-weight:700;
  color:var(--text2); font-size:12px;}
.seg button.on{background:var(--primary); color:var(--on-primary);}

.diag{background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; font-family:ui-monospace,monospace;
  font-size:11px; line-height:1.6; color:var(--text2); white-space:pre-wrap;
  word-break:break-word; max-height:220px; overflow:auto;}
.diag .ok{color:var(--success); font-weight:700;}
.diag .bad{color:var(--danger); font-weight:700;}
.diag .warn{color:var(--warn); font-weight:700;}

/* ── Install helper ───────────────────────────────────────────── */
.install-steps{margin:0; padding-left:18px; line-height:1.9; font-size:13px;}
.install-steps li{margin-bottom:2px;}
.install-warn{background:var(--surface2); border:1px solid var(--border);
  border-left:3px solid var(--warn); border-radius:10px; padding:10px 12px;
  font-size:12px; line-height:1.6; margin-top:12px;}

@media (max-width:900px){
  body{overflow:hidden;}
  #app.on{grid-template-columns:1fr; grid-template-rows:1fr auto; height:100dvh;}
  .sidebar{order:2; flex-direction:row; justify-content:space-around; align-items:center;
    width:100%; height:auto; padding:4px 4px max(4px, env(safe-area-inset-bottom, 0px));
    border-right:none; border-top:1px solid var(--border); gap:0; overflow-x:auto;}
  .sidebar .logo, .sidebar .avatar{display:none;}
  .navbtn{width:44px; height:44px; font-size:22px; border-radius:10px; flex:1 1 0; max-width:80px;}
  .main{order:1; grid-template-rows:48px 1fr;}
  .topbar{padding:0 10px; gap:6px;}
  .topbar h1{font-size:15px;}
  #install-btn{display:none;}
  #install-btn.show{display:inline-flex;}
  #user-who{display:none;}
  .pill{padding:4px 8px; font-size:10px;}
  #page-pos.on{grid-template-columns:1fr; padding:8px; gap:8px;}
  .pos-left{padding:0;}
  .pos-right{position:fixed; top:0; left:0; right:0; bottom:0; z-index:80;
    border-radius:0; border:none; transform:translateX(100%);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);
    padding:14px; max-width:100vw; height:100dvh; width:100vw;}
  .pos-right.open{transform:translateX(0);}
  .cart-close{display:inline-flex !important;}
  .product-grid{grid-template-columns:repeat(auto-fill, minmax(108px,1fr)); gap:6px;}
  .product-card{height:110px;}
  .product-card .emoji{font-size:24px;}
  .product-card .name{font-size:10.5px;}
  .cart-fab{display:flex;}
  .modal-bg{padding:0;}
  .modal{max-width:none; width:100%; max-height:100dvh; height:100dvh; border-radius:0;}
  .two-col{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr; gap:4px;}
  .form-row label{font-size:11px;}
  .cards-row{grid-template-columns:repeat(2, 1fr);}
  .report-grid{grid-template-columns:1fr;}
  #login .box{padding:30px 22px 24px;}
  #login .logo{font-size:52px;}
  .table-wrap table{min-width:420px;}
}
@media (max-width:420px){
  .cards-row{grid-template-columns:1fr;}
  .product-grid{grid-template-columns:repeat(auto-fill, minmax(94px,1fr));}
}
@media print{
  body > *:not(#receipt-area){display:none !important;}
  #receipt-area{display:block !important; position:absolute; top:0; left:0;
    width:100%; background:#fff; color:#000;}
  .receipt-copy{font-family:'Courier New', ui-monospace, monospace;
    font-size:12px; line-height:1.35; white-space:pre; padding:6mm 4mm; color:#000;}
  .receipt-copy + .receipt-copy{page-break-before:always;}
  @page{size:80mm auto; margin:0;}
}
</style>
</head>
<body>

<div id="login">
  <div class="card box">
    <div class="logo">🍕</div>
    <h1>Pizza POS</h1>
    <div class="sub">Restaurant Management Suite</div>
    <input id="login-user" type="text" placeholder="Username" value="admin" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Password" value="admin123" autocomplete="current-password">
    <div class="err" id="login-err"></div>
    <button class="btn primary" id="login-btn">Sign In</button>
    <div class="hint">Default: admin / admin123</div>
    <div class="hint cloud" id="login-cloud">☁ Connecting to shared database…</div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="logo">🍕</div>
    <button class="navbtn" data-page="pos"       title="POS">🍕</button>
    <button class="navbtn" data-page="products"  title="Products">📦</button>
    <button class="navbtn" data-page="customers" title="Customers">👥</button>
    <button class="navbtn" data-page="expenses"  title="Expenses">💸</button>
    <button class="navbtn" data-page="reports"   title="Reports">📊</button>
    <button class="navbtn" data-page="settings"  title="Settings">⚙️</button>
    <div class="avatar" id="user-avatar">AD</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">POS</h1>
      <div class="spacer"></div>
      <span class="pill" id="cloud-pill" title="Shared database status — click for details">
        <span class="dot"></span><span id="cloud-pill-txt">Sync</span>
      </span>
      <span class="pill" id="printer-pill" title="Printer status — click for diagnostics">
        <span class="dot"></span><span id="printer-pill-txt">Printer</span>
      </span>
      <button class="btn icon" id="install-btn" title="Install app">📲</button>
      <button class="btn icon" id="theme-btn" title="Toggle theme">🌓</button>
      <span class="muted" id="user-who" style="font-size:12px; white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis; max-width:140px;">—</span>
    </div>
    <div class="pages-host">
      <div id="page-pos"       class="page"></div>
      <div id="page-products"  class="page"></div>
      <div id="page-customers" class="page"></div>
      <div id="page-expenses"  class="page"></div>
      <div id="page-reports"   class="page"></div>
      <div id="page-settings"  class="page"></div>
    </div>
  </div>
</div>

<button class="cart-fab hidden" id="cart-fab">

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")

}

function fmtMoney(v, sym){

function withTimeout(promise, ms){

/* Globally unique numeric id — safe across devices.
   ~1.7e15 max, well inside Number.MAX_SAFE_INTEGER, stays sortable by time. */
let _idCounter = 0;
function newId(){
  _idCounter = (_idCounter + 1) % 1000;
  return Date.now() * 1000 + ((_idCounter * 7 + Math.floor(Math.random() * 1000)) % 1000);
}

/* Firestore refuses `undefined`. Strip it out and guard NaN/Infinity. */
function sanitize(obj){
  if (Array.isArray(obj)) return obj.map(sanitize);
  if (obj && typeof obj === "object"){
    const out = {};
    for (const k of Object.keys(obj)){
      const v = obj[k];
      if (v === undefined) continue;
      out[k] = sanitize(v);
    }
    return out;
  }
  if (typeof obj === "number" && !isFinite(obj)) return 0;
  return obj;
}

/* ═══════════════════ CRYPTO (with HTTP fallback) ═══════════════════ */
const Crypto = {
  _buf2hex(buf){
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  },
  _randomSalt(){
    try{
      const s = crypto.getRandomValues(new Uint8Array(16));
      return this._buf2hex(s);
    }catch(e){
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
  },
  _fallbackHash(password, salt){
    const s = salt + "$" + password;
    let h1 = 0x811c9dc5, h2 = 0xc9dc5118;
    for (let i = 0; i < s.length; i++){
      const c = s.charCodeAt(i);
      h1 = ((h1 ^ c) * 16777619) >>> 0;
      h2 = ((h2 + c) * 2654435761) >>> 0;
    }
    return salt + "$fb$" + h1.toString(16) + h2.toString(16);
  },
  async hash(password, salt=null){
    if (!salt) salt = this._randomSalt();
    if (!isSecureContext_() || !crypto || !crypto.subtle){
      return this._fallbackHash(password, salt);
    }
    try{
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name:"PBKDF2", salt:enc.encode(salt), iterations:100_000, hash:"SHA-256" },
        key, 256);
      return salt + "$" + this._buf2hex(bits);
    }catch(e){
      console.warn("crypto.subtle failed, using fallback:", e);
      return this._fallbackHash(password, salt);
    }
  },
  async verify(password, stored){
    try{
      const salt = String(stored).split("$")[0];
      const test = await this.hash(password, salt);
      return test === stored;
    }catch(e){ return false; }
  },
};

/* ═══════════════════ CLOUD DATABASE (Firebase) ═══════════════════
   Shared backend for all devices. Anonymous auth + Firestore with
   offline persistence and real-time listeners.                      */
const CloudDB = {
  ready:false,
  error:"",
  app:null,
  auth:null,
  db:null,
  uid:null,
  _initPromise:null,

  sdkAvailable(){
    return typeof firebase !== "undefined" && firebase && firebase.initializeApp;
  },

  init(){
    if (this._initPromise) return this._initPromise;
    this._initPromise = this._doInit();
    return this._initPromise;
  },

  async _doInit(){
    if (!this.sdkAvailable()){
      this.error = "Firebase SDK not loaded (no internet on first load?)";
      this.ready = false;
      return false;
    }
    try{
      this.app = (firebase.apps && firebase.apps.length)
        ? firebase.app()
        : firebase.initializeApp(FIREBASE_CONFIG);

      this.auth = firebase.auth();
      this.db   = firebase.firestore();

      try{
        await this.db.enablePersistence({ synchronizeTabs:true });
      }catch(e){
        console.warn("Persistence not enabled:", e && e.code);
      }

      if (!this.auth.currentUser){
        await this.auth.signInAnonymously();
      }
      this.uid = this.auth.currentUser ? this.auth.currentUser.uid : null;

      this.auth.onAuthStateChanged(u => {
        this.uid = u ? u.uid : null;
        if (!u && this.ready){
          // token dropped — try silently again
          this.auth.signInAnonymously().catch(()=>{});
        }
      });

      this.ready = true;
      this.error = "";
      return true;
    }catch(e){
      this.error = (e && (e.code ? e.code + ": " : "") + (e.message || e)) || String(e);
      this.ready = false;
      console.warn("CloudDB init failed:", e);
      return false;
    }
  },

  col(key){ return this.db.collection(COLLECTIONS[key].name); },

  async token(){
    if (this.ready && this.auth && this.auth.currentUser){
      try{ return await this.auth.currentUser.getIdToken(); }catch(e){}
    }
    return null;
  },
};

/* ═══════════════════ PERSISTENCE LAYER ═══════════════════
   Every mutation writes to the local cache AND to the shared
   cloud database (batched through a serial queue).                 */
const Persist = {
  _chain: Promise.resolve(),

  _queue(fn){
    this._chain = this._chain.then(fn).catch(e=>{
      console.warn("Persist error:", e);
      SyncStatus.set("error", String((e && e.message) || e));
    });
    return this._chain;
  },

  cache(coll){ try{ STORE.set(coll, DB[coll]); }catch(e){} },

  _docId(coll, rec){
    return COLLECTIONS[coll].single ? "main" : String(rec.id);
  },

  put(coll, rec){
    this.cache(coll);
    if (!rec || !CloudDB.ready) return;
    const id = this._docId(coll, rec);
    const data = sanitize(rec);
    this._queue(()=> CloudDB.col(coll).doc(id).set(data));
  },

  putObject(coll, obj){
    this.cache(coll);
    if (!CloudDB.ready) return;
    const data = sanitize(obj || {});
    this._queue(()=> CloudDB.col(coll).doc("main").set(data));
  },

  remove(coll, id){
    this.cache(coll);
    if (!CloudDB.ready) return;
    this._queue(()=> CloudDB.col(coll).doc(String(id)).delete());
  },

  putAll(coll){
    this.cache(coll);
    if (!CloudDB.ready) return;
    if (COLLECTIONS[coll].single){ this.putObject(coll, DB[coll] || {}); return; }

    const rows = Array.isArray(DB[coll]) ? DB[coll].slice() : [];
    this._queue(async ()=>{
      const colRef = CloudDB.col(coll);
      let batch = CloudDB.db.batch();
      let n = 0;
      for (const rec of rows){
        if (!rec || rec.id == null) continue;
        batch.set(colRef.doc(String(rec.id)), sanitize(rec));
        if (++n >= 400){ await batch.commit(); batch = CloudDB.db.batch(); n = 0; }
      }
      if (n) await batch.commit();
    });
  },

  /* Atomic stock change — safe when several devices sell at once. */
  adjustStock(productId, delta){
    this.cache("products");
    if (!CloudDB.ready) return;
    this._queue(()=> CloudDB.col("products")
      .doc(String(productId))
      .set({ stock: firebase.firestore.FieldValue.increment(delta) }, { merge:true }));
  },
};

/* ═══════════════════ SYNC STATUS PILL ═══════════════════ */
const SyncStatus = {
  state:"local",
  msg:"",
  set(state, msg){
    this.state = state;
    if (msg !== undefined) this.msg = msg || "";
    this.render();
  },
  render(){
    const pill = document.getElementById("cloud-pill");
    const txt  = document.getElementById("cloud-pill-txt");
    if (!pill || !txt) return;
    pill.classList.remove("ok","bad","warn");
    if (this.state === "synced"){ pill.classList.add("ok");   txt.textContent = "Synced"; }
    else if (this.state === "error"){ pill.classList.add("bad");  txt.textContent = "Sync err"; }
    else if (this.state === "local"){ pill.classList.add("warn"); txt.textContent = "Local"; }
    else { pill.classList.add("warn"); txt.textContent = "Syncing"; }
    pill.title = this.msg || txt.textContent;
  },
};

/* ═══════════════════ REAL-TIME LISTENERS ═══════════════════ */
const Realtime = {
  unsubs: [],
  started: false,

  start(){
    if (!CloudDB.ready || this.started) return;
    this.started = true;
    for (const coll of COLLECTION_KEYS){
      const unsub = CloudDB.col(coll).onSnapshot(
        snap => this.apply(coll, snap),
        err => {
          console.warn("snapshot error [" + coll + "]", err);
          SyncStatus.set("error", (err && err.message) || String(err));
        }
      );
      this.unsubs.push(unsub);
    }
    SyncStatus.set("synced", "Shared database connected");
  },

  stop(){
    for (const u of this.unsubs){ try{ u(); }catch(e){} }
    this.unsubs = [];
    this.started = false;
  },

  apply(coll, snap){
    const single = COLLECTIONS[coll].single;
    let value;

    if (single){
      value = {};
      snap.docs.forEach(d => { if (d.id === "main") value = d.data() || {}; });
    } else {
      value = snap.docs.map(d => {
        const data = d.data() || {};
        const n = Number(data.id);
        return Object.assign({}, data, { id: Number.isFinite(n) ? n : data.id });
      });
    }

    const before = JSON.stringify(DB[coll] || (single ? {} : []));
    const after  = JSON.stringify(value);
    DB[coll] = value;
    try{ STORE.set(coll, value); }catch(e){}

    if (before !== after) App.scheduleSyncRefresh();
  },
};

/* ═══════════════════ DB (shared, cloud-backed) ═══════════════════ */
const DB = {
  settings:{}, users:[], categories:[], products:[], customers:[],
  orders:[], order_items:[], expenses:[], stock_moves:[],

  /* ---------- boot ---------- */
  _hydrateLocal(){
    this.settings    = STORE.get("settings",    {}) || {};
    this.users       = STORE.get("users",       []) || [];
    this.categories  = STORE.get("categories",  []) || [];
    this.products    = STORE.get("products",    []) || [];
    this.customers   = STORE.get("customers",   []) || [];
    this.orders      = STORE.get("orders",      []) || [];
    this.order_items = STORE.get("order_items", []) || [];
    this.expenses    = STORE.get("expenses",    []) || [];
    this.stock_moves = STORE.get("stock_moves", []) || [];
  },

  async load(onStatus){
    const status = onStatus || function(){};

    status("Loading local cache…");
    this._hydrateLocal();

    status("Connecting to shared database…");
    const cloudOk = await CloudDB.init();

    /* Cloud sync can be explicitly disabled — then we run local-only. */
    const cloudWanted = (this.settings.firebase_enabled !== "0");
    const useCloud = cloudOk && cloudWanted;

    let firstTime = true;
    let cloudReachable = false;

    if (useCloud){
      status("Downloading shared data…");
      try{
        const res = await withTimeout(this._fetchCloud(), 15000);
        firstTime = res.usersEmpty;
        cloudReachable = true;
      }catch(e){
        console.warn("Initial cloud fetch failed:", e);
        CloudDB.error = (e && e.message) || String(e);
        firstTime = false;                 // don't push, avoid clobbering
        SyncStatus.set("error", CloudDB.error);
      }
    } else {
      firstTime = !this.users.length;
      if (cloudOk && !cloudWanted) SyncStatus.set("local", "Cloud sync disabled in Settings");
      else if (!cloudOk) SyncStatus.set("local", CloudDB.error || "Offline — local data only");
    }

    if (firstTime){
      if (!this.users.length){ status("Seeding default data…"); await this._seed(); }
      this._migrations();
      this.saveAll();
      if (useCloud && cloudReachable){
        status("Uploading to shared database…");
        this.pushAllToCloud();
      }
    } else {
      this._migrations();
      this.saveAll();
    }

    if (useCloud && cloudReachable){
      Realtime.start();
      SyncStatus.set("synced", "Shared database connected · device " + (CloudDB.uid || "").slice(0,6));
    }
    status("");
  },

  /* Pull every shared collection once (used during boot). */
  async _fetchCloud(){
    const snaps = await Promise.all(
      COLLECTION_KEYS.map(k => CloudDB.col(k).get())
    );
    const map = {};
    COLLECTION_KEYS.forEach((k, i) => { map[k] = snaps[i]; });

    const usersEmpty = map.users.empty;

    if (!usersEmpty){
      const arr = snap => snap.docs.map(d => {
        const data = d.data() || {};
        const n = Number(data.id);
        return Object.assign({}, data, { id: Number.isFinite(n) ? n : data.id });
      });
      this.users       = arr(map.users);
      this.categories  = arr(map.categories);
      this.products    = arr(map.products);
      this.customers   = arr(map.customers);
      this.orders      = arr(map.orders);
      this.order_items = arr(map.order_items);
      this.expenses    = arr(map.expenses);
      this.stock_moves = arr(map.stock_moves);

      let s = {};
      map.settings.docs.forEach(d => { if (d.id === "main") s = d.data() || {}; });
      this.settings = s;
    }
    return { usersEmpty };
  },

  pushAllToCloud(){
    for (const coll of COLLECTION_KEYS){
      if (COLLECTIONS[coll].single) Persist.putObject(coll, this[coll] || {});
      else Persist.putAll(coll);
    }
  },

  saveAll(){
    for (const coll of COLLECTION_KEYS){
      try{ STORE.set(coll, this[coll]); }catch(e){}
    }
  },
  save(key){ try{ STORE.set(key, this[key]); }catch(e){} },

  async _seed(){
    this.settings = Object.assign({}, DEFAULT_SETTINGS, this.settings);
    this.settings.options_v2 = "1";
    this.settings.bbq_v1 = "1";
    this.settings.extras_v1 = "1";
    this.settings.extras_v2 = "1";
    try{
      const opts = JSON.parse(this.settings.product_options);
      this.settings.product_options = JSON.stringify(ensureExtrasGroup(opts).groups);
    }catch(e){
      this.settings.product_options = JSON.stringify(DEFAULT_OPTIONS);
    }

    if (!this.users.length){
      const hash = await Crypto.hash("admin123");
      this.users = [{
        id:newId(), username:"admin", password:hash,
        full_name:"Administrator", role:"manager", active:1,
        created_at: nowIso(),
      }];
    }

    if (!this.categories.length){
      this.categories = SEED_CATEGORIES.map((n,i)=>({ id:newId(), name:n, sort_order:i }));
    }

    if (!this.products.length){
      this.products = [];
      for (const [n,e,c,p,co,s,t,o] of SEED_PRODUCTS){
        const cat = this.categories.find(x=>x.name === c);
        const custom = CUSTOM_OPTIONS[n] ? JSON.stringify(CUSTOM_OPTIONS[n]) : "";
        this.products.push({
          id:newId(),
          name:n, emoji:e, category_id:cat ? cat.id : null,
          price:p, cost:co, stock:s, track_stock:t,
          low_stock: Number(this.settings.low_stock_default)||5,
          has_options:o, active:1,
          size_prices:"", custom_options:custom,
        });
      }
    }
  },

  _migrations(){
    let changed = false;

    if (this.settings.options_v2 !== "1"){
      this.settings.product_options = JSON.stringify(DEFAULT_OPTIONS);
      this.settings.options_v2 = "1";
      changed = true;
    }
    if (this.settings.extras_v1 !== "1"){
      let opts = null;
      try{ opts = JSON.parse(this.settings.product_options); }catch(e){ opts = null; }
      if (!Array.isArray(opts) || !opts.length) opts = cloneJson(DEFAULT_OPTIONS);
      this.settings.product_options = JSON.stringify(ensureExtrasGroup(opts).groups);
      this.settings.extras_v1 = "1";
      changed = true;
    }
    if (this.settings.extras_v2 !== "1"){
      let opts = null;
      try{ opts = JSON.parse(this.settings.product_options); }catch(e){ opts = null; }
      if (!Array.isArray(opts) || !opts.length) opts = cloneJson(DEFAULT_OPTIONS);
      this.settings.product_options = JSON.stringify(ensureExtrasGroup(opts).groups);
      this.settings.extras_v2 = "1";
      changed = true;
    }
    if (this.settings.bbq_v1 !== "1"){
      const bbq = this.products.find(x=>x.name === "Chicken BBQ Pizza");
      if (bbq){ bbq.price = 1200000; bbq.has_options = 0; bbq.custom_options = ""; bbq.size_prices = ""; }
      this.settings.bbq_v1 = "1";
      changed = true;
    }

    /* ── Pizza-first migration ─────────────────────────────────────
       Guarantee the "Pizza" category always owns the lowest
       sort_order and that every pizza product is flagged active, so
       the POS grid, the category bar and the products table all show
       pizza at the very top on every device.                        */
    if (this.settings.order_v1 !== "1"){
      const pizza = this.categories.find(c =>
        String(c.name||"").trim().toLowerCase() === "pizza");
      if (pizza){
        const others = this.categories
          .filter(c => c.id !== pizza.id)
          .sort((a,b)=> (Number(a.sort_order)||99) - (Number(b.sort_order)||99));
        pizza.sort_order = 0;
        others.forEach((c,i)=>{ c.sort_order = i + 1; });
        for (const c of this.categories) Persist.put("categories", c);
      }
      this.settings.order_v1 = "1";
      changed = true;
    }

    for (const k in DEFAULT_SETTINGS){
      if (!(k in this.settings)){ this.settings[k] = DEFAULT_SETTINGS[k]; changed = true; }
    }
    try{
      const opts = JSON.parse(this.settings.product_options);
      const res = ensureExtrasGroup(opts);
      if (res.changed){
        this.settings.product_options = JSON.stringify(res.groups);
        changed = true;
      }
    }catch(e){
      this.settings.product_options = JSON.stringify(DEFAULT_OPTIONS);
      changed = true;
    }
    for (const p of this.products){
      const c = CUSTOM_OPTIONS[p.name];
      if (c && !p.custom_options){ p.custom_options = JSON.stringify(c); p.has_options = 1; p.price = 0; changed = true; }
    }
    if (changed){
      try{ STORE.set("settings", this.settings); STORE.set("products", this.products); }catch(e){}
    }
    return changed;
  },

  /* ---------- categories ---------- */
  /* Pizza is always first, then the rest by sort_order, then name. */
  categoriesSorted(){
    const isPizza = c => String((c && c.name) || "").trim().toLowerCase() === "pizza";
    return [...this.categories].sort((a,b)=>{
      const pa = isPizza(a) ? -1 : 0;
      const pb = isPizza(b) ? -1 : 0;
      if (pa !== pb) return pa - pb;
      const sa = Number(a.sort_order), sb = Number(b.sort_order);
      const oa = Number.isFinite(sa) ? sa : 99;
      const ob = Number.isFinite(sb) ? sb : 99;
      if (oa !== ob) return oa - ob;
      return String(a.name||"").localeCompare(String(b.name||""));
    });
  },
  saveCategory(data, id){
    if (id){
      const c = this.categories.find(x=>x.id === id);
      if (c){ Object.assign(c, data); Persist.put("categories", c); }
      return id;
    }
    const c = Object.assign({ id:newId(), sort_order:99 }, data);
    this.categories.push(c);
    Persist.put("categories", c);
    return c.id;
  },

  /* ---------- products ---------- */
  /* Sort: pizza category first → other categories by sort_order →
     products inside a category by creation id (stable everywhere).  */
  sortProducts(list){
    const rank = new Map();
    this.categoriesSorted().forEach((c,i)=> rank.set(c.id, i));
    return list.slice().sort((a,b)=>{
      const ra = rank.has(a.category_id) ? rank.get(a.category_id) : 9000;
      const rb = rank.has(b.category_id) ? rank.get(b.category_id) : 9000;
      if (ra !== rb) return ra - rb;
      const ia = Number(a.id), ib = Number(b.id);
      if (Number.isFinite(ia) && Number.isFinite(ib) && ia !== ib) return ia - ib;
      return String(a.name||"").localeCompare(String(b.name||""));
    });
  },
  productsList({search="", category_id=null, only_active=true}={}){
    const s = (search||"").toLowerCase();
    const list = this.products.filter(p=>{
      if (only_active && !p.active) return false;
      if (category_id && p.category_id !== category_id) return false;
      if (s){
        const c = this.categories.find(x=>x.id === p.category_id);
        const inName = String(p.name||"").toLowerCase().includes(s);
        const inCat  = c ? String(c.name||"").toLowerCase().includes(s) : false;
        if (!inName && !inCat) return false;
      }
      return true;
    });
    return this.sortProducts(list);
  },
  getProduct(id){ return this.products.find(p=>p.id === id); },
  saveProduct(data, id){
    if (id){
      const p = this.getProduct(id);
      if (p){ Object.assign(p, data); Persist.put("products", p); }
      return id;
    }
    const p = Object.assign(
      { id:newId(), active:1, size_prices:"", custom_options:"" }, data);
    this.products.push(p);
    Persist.put("products", p);
    return p.id;
  },
  deleteProduct(id){
    this.products = this.products.filter(p=>p.id !== id);
    Persist.remove("products", id);
  },

  /* ---------- customers ---------- */
  customersList(search=""){
    const s = (search||"").toLowerCase();
    return [...this.customers]
      .filter(c => !s || String(c.name||"").toLowerCase().includes(s) || String(c.phone||"").toLowerCase().includes(s))
      .sort((a,b)=> String(a.name||"").localeCompare(String(b.name||"")));
  },
  saveCustomer(data, id){
    if (id){
      const c = this.customers.find(x=>x.id === id);
      if (c){ Object.assign(c, data); Persist.put("customers", c); }
      return id;
    }
    const c = Object.assign({ id:newId(), points:0, created_at: nowIso() }, data);
    this.customers.push(c);
    Persist.put("customers", c);
    return c.id;
  },
  deleteCustomer(id){
    this.customers = this.customers.filter(c=>c.id !== id);
    Persist.remove("customers", id);
  },

  /* ---------- orders ---------- */
  nextOrderNo(){
    const d = new Date();
    const day = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    const pref = `ORD-${day}-`;
    let n = 0;
    for (const o of this.orders){ if (o.order_no && o.order_no.startsWith(pref)) n++; }
    return pref + String(n+1).padStart(4,"0");
  },
  _freeOrderNo(no){
    if (!this.orders.some(o => o.order_no === no)) return no;
    const m = /^(.*-)(\d+)$/.exec(no);
    if (!m) return no + "-" + String(Math.floor(Math.random()*90+10));
    const base = m[1];
    let num = parseInt(m[2], 10);
    let candidate = no;
    let guard = 0;
    do {
      num++;
      candidate = base + String(num).padStart(4,"0");
      guard++;
    } while (this.orders.some(o => o.order_no === candidate) && guard < 9999);
    return candidate;
  },
  openOrders(){
    return this.orders
      .filter(o => o.status === "open")
      .map(o => Object.assign({}, o, {
        items: this.order_items.filter(i => i.order_id === o.id),
      }));
  },
  saveOrder(o, status="open"){
    const now = nowIso();
    let oid = o.id;
    let row;

    if (oid){
      row = this.orders.find(x=>x.id === oid);
      if (row){
        Object.assign(row, {
          order_type:o.type, status,
          customer_id:o.customer_id, customer_name:o.customer_name||"",
          customer_phone:o.customer_phone||"",
          subtotal:o.subtotal, discount:o.discount, tax:o.tax,
          delivery:o.delivery, total:o.total,
          payment_method:o.payment_method||"Cash",
          user_id:o.user_id, note:o.note||"",
        });
      }
      /* wipe this order's old lines, then re-add */
      const old = this.order_items.filter(i=>i.order_id === oid);
      this.order_items = this.order_items.filter(i=>i.order_id !== oid);
      for (const it of old) Persist.remove("order_items", it.id);
      if (row) Persist.put("orders", row);
    } else {
      oid = newId();
      const no = this._freeOrderNo(o.no);
      o.no = no;
      row = {
        id:oid, order_no:no, order_type:o.type||"Delivery", status,
        customer_id:o.customer_id||null, customer_name:o.customer_name||"",
        customer_phone:o.customer_phone||"",
        subtotal:o.subtotal, discount:o.discount, tax:o.tax,
        delivery:o.delivery, total:o.total,
        payment_method:o.payment_method||"Cash",
        user_id:o.user_id||null, note:o.note||"",
        created_at:now, closed_at:null,
      };
      this.orders.push(row);
      o.id = oid;
      Persist.put("orders", row);
    }

    for (const it of o.items){
      const item = {
        id:newId(),
        order_id: oid, product_id: it.product_id, name: it.name,
        qty: it.qty, unit_price: it.unit,
        options: (it.options||[]).map(x=>x.label).join(", "),
        note: it.note||"",
        line_total: it.line,
      };
      this.order_items.push(item);
      Persist.put("order_items", item);
    }

    if (status === "paid"){
      const r = this.orders.find(x=>x.id === oid);
      if (r){ r.closed_at = now; Persist.put("orders", r); }
    }
    return oid;
  },
  deductStock(o){
    for (const it of o.items){
      const p = this.getProduct(it.product_id);
      if (p && p.track_stock){
        p.stock = Number(p.stock||0) - Number(it.qty||0);
        const mv = {
          id:newId(), product_id:p.id,
          change:-it.qty, reason:"Order " + o.no, created_at: nowIso(),
        };
        this.stock_moves.push(mv);
        Persist.put("stock_moves", mv);
        Persist.adjustStock(p.id, -Number(it.qty||0));
      }
    }
  },

  /* ---------- expenses ---------- */
  expensesList(){
    return [...this.expenses].sort((a,b)=>
      String(b.spent_on||"").localeCompare(String(a.spent_on||"")) || (b.id - a.id));
  },
  saveExpense(data, id){
    if (id){
      const e = this.expenses.find(x=>x.id === id);
      if (e){ Object.assign(e, data); Persist.put("expenses", e); }
      return id;
    }
    const e = Object.assign({ id:newId(), created_at: nowIso() }, data);
    this.expenses.push(e);
    Persist.put("expenses", e);
    return e.id;
  },
  deleteExpense(id){
    this.expenses = this.expenses.filter(e=>e.id !== id);
    Persist.remove("expenses", id);
  },

  /* ---------- reports ---------- */
  _paidOrdersInRange(s, e){
    return this.orders.filter(o =>
      o.status === "paid" &&
      (o.created_at||"").slice(0,10) >= s &&
      (o.created_at||"").slice(0,10) <= e);
  },
  summary(s, e){
    const os = this._paidOrdersInRange(s, e);
    const exp = this.expenses.filter(x =>
      (x.spent_on||"") >= s && (x.spent_on||"") <= e);
    return {
      orders:   os.length,
      revenue:  os.reduce((a,o)=>a + Number(o.total||0), 0),
      discount: os.reduce((a,o)=>a + Number(o.discount||0), 0),
      tax:      os.reduce((a,o)=>a + Number(o.tax||0), 0),
      expenses: exp.reduce((a,x)=>a + Number(x.amount||0), 0),
    };
  },
  topProducts(s, e){
    const os = this._paidOrdersInRange(s, e);
    const ids = new Set(os.map(o=>o.id));
    const map = new Map();
    for (const it of this.order_items){
      if (!ids.has(it.order_id)) continue;
      const k = it.name;
      if (!map.has(k)) map.set(k, { name:k, qty:0, revenue:0 });
      const r = map.get(k);
      r.qty += Number(it.qty||0);
      r.revenue += Number(it.line_total||0);
    }
    return [...map.values()].sort((a,b)=>b.revenue - a.revenue).slice(0,10);
  },
  salesByCategory(s, e){
    const os = this._paidOrdersInRange(s, e);
    const ids = new Set(os.map(o=>o.id));
    const map = new Map();
    for (const it of this.order_items){
      if (!ids.has(it.order_id)) continue;
      const p = this.getProduct(it.product_id);
      const c = p ? this.categories.find(x=>x.id === p.category_id) : null;
      const k = c ? c.name : "Other";
      map.set(k, (map.get(k)||0) + Number(it.line_total||0));
    }
    return [...map.entries()].map(([category, revenue])=>({category, revenue}))
      .sort((a,b)=>b.revenue - a.revenue);
  },
  salesByMethod(s, e){
    const os = this._paidOrdersInRange(s, e);
    const map = new Map();
    for (const o of os){
      const k = o.payment_method || "Cash";
      if (!map.has(k)) map.set(k, { method:k, c:0, revenue:0 });
      const r = map.get(k);
      r.c++; r.revenue += Number(o.total||0);
    }
    return [...map.values()];
  },
  salesByDay(s, e){
    const os = this._paidOrdersInRange(s, e);
    const map = new Map();
    for (const o of os){
      const d = (o.created_at||"").slice(0,10);
      if (!map.has(d)) map.set(d, { day:d, orders:0, revenue:0 });
      const r = map.get(d);
      r.orders++; r.revenue += Number(o.total||0);
    }
    return [...map.values()].sort((a,b)=>b.day.localeCompare(a.day));
  },
  cashSummary(s, e){
    const os = this._paidOrdersInRange(s, e).filter(o=>o.payment_method === "Cash");
    const exp = this.expenses.filter(x =>
      (x.spent_on||"") >= s && (x.spent_on||"") <= e);
    const cash_sales = os.reduce((a,o)=>a + Number(o.total||0), 0);
    const expenses   = exp.reduce((a,x)=>a + Number(x.amount||0), 0);
    return { cash_orders: os.length, cash_sales, expenses, expected: cash_sales - expenses };
  },

  /* ---------- users ---------- */
  async authenticate(u, p){
    const user = this.users.find(x=>x.username === u && x.active);
    if (!user) return null;
    const ok = await Crypto.verify(p, user.password);
    return ok ? user : null;
  },
  async addUser(u, p, n, r){
    if (this.users.some(x=>x.username === u)) throw new Error("exists");
    const hash = await Crypto.hash(p);
    const rec = {
      id:newId(), username:u, password:hash,
      full_name:n, role:r, active:1, created_at: nowIso(),
    };
    this.users.push(rec);
    Persist.put("users", rec);
  },
  deleteUser(id){
    const u = this.users.find(x=>x.id === id);
    if (u && u.username !== "admin"){
      this.users = this.users.filter(x=>x.id !== id);
      Persist.remove("users", id);
    }
  },
};

/* ═══════════════════ OPTIONS ═══════════════════ */
function ensureExtrasGroup(groups){
  let changed = false;
  if (!Array.isArray(groups)){ groups = []; changed = true; }
  let grp = null;
  for (const g of groups){ if (g && g.name === EXTRAS_GROUP_NAME){ grp = g; break; } }
  if (!grp){ grp = { name:EXTRAS_GROUP_NAME, multi:true, choices:[] }; groups.push(grp); changed = true; }
  if (grp.multi !== true){ grp.multi = true; changed = true; }
  if (grp.large_only){ grp.large_only = false; changed = true; }
  if (!Array.isArray(grp.choices)){ grp.choices = []; changed = true; }
  for (const c of EXTRAS_CHOICES){
    const ex = grp.choices.find(x => x && x.label === c.label);
    if (!ex){ grp.choices.push({ label:c.label, price:0 }); changed = true; }
    else if (Number(ex.price) !== 0){ ex.price = 0; changed = true; }
  }
  return { groups, changed };
}
function computeUnitPrice(product, chosenOptions){
  let total = Number(product.price) || 0;
  for (const o of chosenOptions) total += Number(o.price) || 0;
  const labels = new Set(chosenOptions.map(o=>(o.label||"").toLowerCase()));
  const name = (product.name||"").toLowerCase();
  const isLarge = labels.has("large");
  const hasBBQ  = [...labels].some(l => l.includes("bbq") || l.includes("barbecue"));
  const productIsBBQ = name.includes("bbq") || name.includes("barbecue");
  if (isLarge && (hasBBQ || productIsBBQ)) total = CHICKEN_BBQ_LARGE_PRICE;
  return total;
}
function optionsFor(product){
  if (product && product.custom_options){
    try{
      const parsed = JSON.parse(product.custom_options);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    }catch(e){}
  }
  let groups = null;
  try{ groups = JSON.parse(DB.settings.product_options); }catch(e){ groups = null; }
  if (!Array.isArray(groups) || !groups.length) groups = cloneJson(DEFAULT_OPTIONS);
  const res = ensureExtrasGroup(groups);
  if (res.changed){
    try{
      DB.settings.product_options = JSON.stringify(res.groups);
      DB.save("settings");
      Persist.putObject("settings", DB.settings);
    }catch(e){}
  }
  return res.groups;
}

/* ═══════════════════ ESC/POS ═══════════════════ */
class EscPos {
  constructor(){ this.buf = []; }
  _u8(...b){ for (const x of b) this.buf.push(x & 0xFF); return this; }
  init(){ return this._u8(0x1B, 0x40); }
  align(n){ return this._u8(0x1B, 0x61, n & 3); }
  bold(on){ return this._u8(0x1B, 0x45, on ? 1 : 0); }
  size(w, h){ return this._u8(0x1D, 0x21, ((w & 7) << 4) | (h & 7)); }
  text(s){
    for (const ch of String(s)){
      const code = ch.charCodeAt(0);
      if (code === 0x09){ this.buf.push(0x09); continue; }
      if (code < 0x80) this.buf.push(code);
      else if (code < 0x100) this.buf.push(code);
      else this.buf.push(0x3F);
    }
    return this;
  }
  line(s=""){ return this.text(s)._u8(0x0A); }
  feed(n=1){ return this._u8(0x1B, 0x64, n & 0xFF); }
  cut(mode="partial"){
    this.feed(4);
    if (mode === "full")    return this._u8(0x1D, 0x56, 0x00);
    if (mode === "partial") return this._u8(0x1D, 0x56, 0x42, 0x00);
    return this;
  }
  kickDrawer(){ return this._u8(0x1B, 0x70, 0x00, 0x19, 0xFA); }
  bytes(){ return new Uint8Array(this.buf); }
}

/* ═══════════════════ USB PRINTER ═══════════════════ */
const USBPrinter = {
  device: null,
  endpoint: null,
  ifaceNum: 0,
  _busy: false,

  isSupported(){ return typeof navigator !== "undefined" && "usb" in navigator; },
  isConnected(){ return !!(this.device && this.endpoint !== null); },

  async connect(){
    if (!this.isSupported()) throw new Error("WebUSB not supported in this browser (use Chrome or Edge on desktop)");
    if (!isSecureContext_()) throw new Error("WebUSB requires HTTPS or localhost");
    let dev = null;
    try{
      const known = await navigator.usb.getDevices();
      if (known && known.length) dev = known[0];
    }catch(e){}
    if (!dev){
      dev = await navigator.usb.requestDevice({ filters:[
        { classCode:7 }, { classCode:0xFF }, {}
      ]});
    }
    try{
      await dev.open();
    }catch(e){
      if (!String(e.message||"").match(/already open/i)) throw e;
    }
    if (dev.configuration === null) await dev.selectConfiguration(1);

    let epNum = null, ifaceNum = 0;
    for (const i of dev.configuration.interfaces){
      for (const alt of i.alternates){
        for (const e of alt.endpoints){
          if (e.direction === "out" && (e.type === "bulk" || e.type === "interrupt")){
            epNum = e.endpointNumber; ifaceNum = i.interfaceNumber; break;
          }
        }
        if (epNum !== null) break;
      }
      if (epNum !== null) break;
    }
    if (epNum === null){
      try{ await dev.close(); }catch(e){}
      throw new Error("No OUT endpoint on this device — is it a printer?");
    }
    try{ await dev.claimInterface(ifaceNum); }catch(e){}

    this.device = dev;
    this.endpoint = epNum;
    this.ifaceNum = ifaceNum;
    STORE.set("usb_printer", { vid: dev.vendorId, pid: dev.productId });
    return { vid: dev.vendorId, pid: dev.productId };
  },

  async disconnect(){
    try{ if (this.device) await this.device.close(); }catch(e){}
    this.device = null; this.endpoint = null;
  },

  async send(bytes){
    if (!this.isConnected()) throw new Error("USB printer not connected");
    if (this._busy) throw new Error("USB printer busy");
    this._busy = true;
    try{
      const CHUNK = 4096;
      for (let i = 0; i < bytes.length; i += CHUNK){
        const slice = bytes.slice(i, Math.min(i + CHUNK, bytes.length));
        const res = await this.device.transferOut(this.endpoint, slice);
        if (res && res.status && res.status !== "ok"){
          throw new Error("USB transfer " + res.status);
        }
      }
    } finally {
      this._busy = false;
    }
  },
};

/* ═══════════════════ RECEIPT BUILDERS ═══════════════════ */
const RECEIPT_WIDTH = 42;
function center(s, w=RECEIPT_WIDTH){
  s = String(s);
  if (s.length >= w) return s;
  return " ".repeat(Math.floor((w - s.length)/2)) + s;
}
function lr(left, right, w=RECEIPT_WIDTH){
  left = String(left); right = String(right);
  let gap = w - left.length - right.length;
  if (gap < 1) gap = 1;
  return left + " ".repeat(gap) + right;
}
function sep(ch="-", w=RECEIPT_WIDTH){ return ch.repeat(w); }

function buildReceiptText(order, settings, copyLabel=""){
  const sym = settings.currency_symbol || "LBP ";
  const lines = [];
  if (settings.restaurant_name) lines.push(center(settings.restaurant_name));
  if (settings.tagline) lines.push(center(settings.tagline));
  if (settings.address) lines.push(center(settings.address));
  if (settings.phone)   lines.push(center(settings.phone));
  lines.push(sep("-"));
  if (copyLabel){
    lines.push(center("*** " + copyLabel + " ***"));
    lines.push(sep("-"));
  }
  const when = new Date().toLocaleString([], { hour12:false });
  lines.push(lr("Order: " + order.no, when));
  if (order.customer_name) lines.push("Customer: " + order.customer_name);
  if (order.customer_phone) lines.push("Phone: " + order.customer_phone);
  lines.push("Type: " + (order.type || "Delivery"));
  lines.push(sep("-"));
  for (const it of order.items){
    lines.push(it.name);
    const opts = (it.options||[]).map(o=>o.label).join(", ");
    if (opts) lines.push("  " + opts);
    if (it.note) lines.push("  Note: " + it.note);
    lines.push(lr("  " + it.qty + " x " + fmtMoney(it.unit, sym), fmtMoney(it.line, sym)));
  }
  lines.push(sep("-"));
  lines.push(lr("Subtotal", fmtMoney(order.subtotal, sym)));
  if (order.discount) lines.push(lr("Discount", "-" + fmtMoney(order.discount, sym)));
  if (order.delivery) lines.push(lr("Delivery", fmtMoney(order.delivery, sym)));
  lines.push(sep("="));
  lines.push(lr("TOTAL", fmtMoney(order.total, sym)));
  const rate = Number(settings.secondary_rate)||90000;
  const sec  = (settings.secondary_currency||"USD").toUpperCase();
  const secSym = sec === "USD" ? "$" : sec + " ";
  if (rate) lines.push(center(secSym + (Number(order.total)/rate).toFixed(2) + "  @ " + rate.toFixed(0)));
  lines.push(sep("="));
  lines.push(lr("Payment", order.payment_method || "Cash"));
  lines.push(sep("-"));
  if (settings.receipt_footer) lines.push(center(settings.receipt_footer));
  lines.push(""); lines.push("");
  return lines.join("\n");
}

function buildEscPosReceipt(order, settings, copyLabel){
  const sym = settings.currency_symbol || "LBP ";
  const p = new EscPos();
  p.init();
  p.align(1);
  if (settings.restaurant_name){
    p.size(1,1); p.bold(true);
    p.line(settings.restaurant_name);
    p.size(0,0); p.bold(false);
  }
  if (settings.tagline) p.line(settings.tagline);
  if (settings.address) p.line(settings.address);
  if (settings.phone)   p.line(settings.phone);
  p.align(0);
  p.line(sep("-"));
  if (copyLabel){
    p.align(1); p.bold(true);
    p.line("*** " + copyLabel + " ***");
    p.bold(false); p.align(0);
    p.line(sep("-"));
  }
  const when = new Date().toLocaleString([], { hour12:false });
  p.line(lr("Order: " + order.no, when));
  if (order.customer_name) p.line("Customer: " + order.customer_name);
  if (order.customer_phone) p.line("Phone: " + order.customer_phone);
  p.line("Type: " + (order.type || "Delivery"));
  p.line(sep("-"));
  for (const it of order.items){
    p.line(it.name);
    const opts = (it.options||[]).map(o=>o.label).join(", ");
    if (opts) p.line("  " + opts);
    if (it.note) p.line("  Note: " + it.note);
    p.line(lr("  " + it.qty + " x " + fmtMoney(it.unit, sym), fmtMoney(it.line, sym)));
  }
  p.line(sep("-"));
  p.line(lr("Subtotal", fmtMoney(order.subtotal, sym)));
  if (order.discount) p.line(lr("Discount", "-" + fmtMoney(order.discount, sym)));
  if (order.delivery) p.line(lr("Delivery", fmtMoney(order.delivery, sym)));
  p.line(sep("="));
  p.bold(true); p.size(1,1);
  p.line(lr("TOTAL", fmtMoney(order.total, sym)));
  p.size(0,0); p.bold(false);
  const rate = Number(settings.secondary_rate)||90000;
  const sec  = (settings.secondary_currency||"USD").toUpperCase();
  const secSym = sec === "USD" ? "$" : sec + " ";
  if (rate){
    p.align(1);
    p.line(secSym + (Number(order.total)/rate).toFixed(2) + "  @ " + rate.toFixed(0));
    p.align(0);
  }
  p.line(sep("="));
  p.line(lr("Payment", order.payment_method || "Cash"));
  p.line(sep("-"));
  if (settings.receipt_footer){
    p.align(1); p.line(settings.receipt_footer); p.align(0);
  }
  if (settings.printer_drawer === "1") p.kickDrawer();
  p.cut(settings.printer_cut || "partial");
  return p.bytes();
}

function buildCloseCashText(start, end, settings){
  const sym = settings.currency_symbol || "LBP ";
  const cash = DB.cashSummary(start, end);
  const lines = [];
  lines.push(center(settings.restaurant_name || "Pizza POS"));
  lines.push(center("CLOSE CASH REPORT"));
  lines.push(sep("="));
  lines.push(center(start + "  ->  " + end));
  lines.push(sep("-"));
  lines.push(lr("Cash orders", String(cash.cash_orders)));
  lines.push(lr("Cash sales",  fmtMoney(cash.cash_sales, sym)));
  lines.push(lr("Expenses",    fmtMoney(cash.expenses, sym)));
  lines.push(sep("="));
  lines.push(lr("EXPECTED DRAWER", fmtMoney(cash.expected, sym)));
  const rate = Number(settings.secondary_rate)||90000;
  const sec  = (settings.secondary_currency||"USD").toUpperCase();
  const secSym = sec === "USD" ? "$" : sec + " ";
  if (rate) lines.push(center(secSym + (cash.expected/rate).toFixed(2) + "  @ " + rate.toFixed(0)));
  lines.push(sep("="));
  lines.push("");
  lines.push(lr("Opened by", "________________"));
  lines.push(lr("Closed by", "________________"));
  lines.push(lr("Signature", "________________"));
  lines.push("");
  lines.push(center(new Date().toLocaleString([], { hour12:false })));
  return lines.join("\n");
}

/* ═══════════════════ UNIFIED PRINTER ═══════════════════ */
const Printer = {
  copies(settings){
    const n = Number(settings.printer_copies || 2);
    return Math.max(1, Math.min(3, n));
  },

  async print(order, settings){
    const mode = (settings.printer_mode || "browser").toLowerCase();
    const copies = this.copies(settings);
    const jobs = [];
    for (let i = 0; i < copies; i++){
      const label = i === 0 ? "CUSTOMER COPY" : "RESTAURANT COPY";
      jobs.push({ label, bytes: buildEscPosReceipt(order, settings, label) });
    }
    switch (mode){
      case "usb":   return await this._usb(jobs, order, settings);
      case "agent": return await this._agent(jobs, order, settings);
      case "cloud": return await this._cloud(jobs, order, settings);
      default:      return await this._browser(order, settings);
    }
  },

  async _usb(jobs, order, settings){
    if (!USBPrinter.isSupported()){
      toast("WebUSB not supported — use Chrome/Edge on desktop, over HTTPS or localhost.", "error", 6000);
      return { ok:false, error:"usb unsupported" };
    }
    if (!USBPrinter.isConnected()){
      toast("USB printer not connected — Settings → Connect USB printer.", "warning", 5000);
      return { ok:false, error:"usb not connected" };
    }
    try{
      for (const job of jobs){
        await USBPrinter.send(job.bytes);
        await new Promise(r => setTimeout(r, 300));
      }
      toast(`🖨  Printed ${jobs.length} ${jobs.length===1?"copy":"copies"} (USB)`, "success");
      return { ok:true };
    }catch(e){
      toast("USB print failed: " + e.message, "error", 6000);
      return { ok:false, error:e.message };
    }
  },

  async _agent(jobs, order, settings){
    const url = (settings.printer_agent_url || "").trim();
    if (!url){
      toast("Set the Print Agent URL in Settings → Printer.", "warning", 5000);
      return { ok:false, error:"no agent url" };
    }
    if (!isSecureContext_()){
      toast("Agent printing over HTTP requires HTTPS page (or localhost).", "error", 7000);
      return { ok:false, error:"not secure context" };
    }
    try{
      const headers = { "Content-Type":"application/json" };
      if (settings.printer_agent_token) headers["X-Auth-Token"] = settings.printer_agent_token;
      const body = {
        printer: settings.printer_name || "",
        order_no: order.no || "",
        cut:     settings.printer_cut || "partial",
        drawer:  settings.printer_drawer === "1",
        jobs: jobs.map(j => ({ label: j.label, data: Array.from(j.bytes) })),
      };
      const r = await fetch(url.replace(/\/+$/,"") + "/print", {
        method:"POST", headers, body: JSON.stringify(body),
      });
      if (!r.ok){
        const t = await r.text().catch(()=> "");
        throw new Error("HTTP " + r.status + (t ? " " + t.slice(0,140) : ""));
      }
      toast(`🖨  Sent ${jobs.length} ${jobs.length===1?"copy":"copies"} to agent`, "success");
      return { ok:true };
    }catch(e){
      toast("Print agent failed: " + e.message, "error", 6000);
      return { ok:false, error:e.message };
    }
  },

  async _cloud(jobs, order, settings){
    if (settings.firebase_enabled !== "1"){
      toast("Cloud print needs Firebase enabled (Settings → Cloud).", "warning", 5000);
      return { ok:false, error:"firebase disabled" };
    }
    try{
      const all = [];
      for (const j of jobs) for (const b of j.bytes) all.push(b);
      await CloudSync.queuePrintJob({
        printer_name: settings.printer_name || "",
        order_no: order.no || "",
        cut: settings.printer_cut || "partial",
        drawer: settings.printer_drawer === "1",
        copies: jobs.length,
        data: all,
      });
      toast("☁  Print job queued — store agent will print it", "success");
      return { ok:true };
    }catch(e){
      toast("Cloud print failed: " + e.message, "error", 6000);
      return { ok:false, error:e.message };
    }
  },

  async _browser(order, settings){
    const copies = this.copies(settings);
    const blocks = [];
    for (let i = 0; i < copies; i++){
      const label = i === 0 ? "CUSTOMER COPY" : "RESTAURANT COPY";
      blocks.push(buildReceiptText(order, settings, label) + "\n\n\n\n");
    }
    const area = document.getElementById("receipt-area");
    area.innerHTML = blocks.map(b => `<div class="receipt-copy">${escapeHtml(b)}</div>`).join("");
    setTimeout(()=>window.print(), 60);
    return { ok:true };
  },

  async printText(text, settings){
    const mode = (settings.printer_mode || "browser").toLowerCase();
    if (mode !== "browser"){
      const p = new EscPos();
      p.init(); p.align(0);
      for (const line of String(text).split("\n")) p.line(line);
      if (settings.printer_drawer === "1") p.kickDrawer();
      p.cut(settings.printer_cut || "partial");
      const bytes = p.bytes();

      if (mode === "usb"){
        if (!USBPrinter.isConnected()){ toast("USB printer not connected","warning"); return { ok:false }; }
        try{ await USBPrinter.send(bytes); toast("🖨  Printed (USB)","success"); return { ok:true }; }
        catch(e){ toast("USB print failed: " + e.message,"error",5000); return { ok:false }; }
      }
      if (mode === "agent"){
        const url = (settings.printer_agent_url || "").trim();
        if (!url){ toast("Set Print Agent URL","warning"); return { ok:false }; }
        try{
          const headers = { "Content-Type":"application/json" };
          if (settings.printer_agent_token) headers["X-Auth-Token"] = settings.printer_agent_token;
          const r = await fetch(url.replace(/\/+$/,"") + "/print", {
            method:"POST", headers,
            body: JSON.stringify({
              printer: settings.printer_name || "",
              order_no: "CLOSE-CASH",
              cut: settings.printer_cut || "partial",
              drawer: settings.printer_drawer === "1",
              jobs: [{ label:"CLOSE CASH", data: Array.from(bytes) }],
            }),
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          toast("🖨  Sent to agent","success"); return { ok:true };
        }catch(e){ toast("Print agent failed: " + e.message,"error",5000); return { ok:false }; }
      }
      if (mode === "cloud"){
        if (settings.firebase_enabled !== "1"){ toast("Cloud print needs Firebase","warning"); return { ok:false }; }
        try{
          await CloudSync.queuePrintJob({
            printer_name: settings.printer_name || "",
            order_no: "CLOSE-CASH",
            cut: settings.printer_cut || "partial",
            drawer: settings.printer_drawer === "1",
            copies: 1, data: Array.from(bytes),
          });
          toast("☁  Close Cash queued","success"); return { ok:true };
        }catch(e){ toast("Cloud print failed: " + e.message,"error",5000); return { ok:false }; }
      }
    }
    const area = document.getElementById("receipt-area");
    area.innerHTML = `<div class="receipt-copy">${escapeHtml(text + "\n\n\n\n")}</div>`;
    setTimeout(()=>window.print(), 60);
    return { ok:true };
  },
};

      if (picker && !picker.contains(e.target)) list.classList.remove("on");

      product_id: p.id, name: p.name, emoji: p.emoji,
      qty, unit, options, note: note || "", line: unit * qty,
    });
    this.renderCart(); this.recalc(); this.updateCartFab();

  showOptionDialog(p){
    const groups = optionsFor(p);
    const state = { size:null, flavorSet:new Set(), groups:{}, qty:1, note:"" };
    const sym = DB.settings.currency_symbol;

    const rebuild = ()=>{
      let html = `<div class="m-head">
        <div style="font-size:34px;">${escapeHtml(p.emoji||"🍕")}</div>
        <h2 style="flex:1;">${escapeHtml(p.name)}</h2>
