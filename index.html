        if (epNum !== null) break;
      }
      if (epNum !== null) break;
    }
    if (epNum === null){
      try{ await dev.close(); }catch(e){}
      throw new Error("No OUT endpoint on this device — is it a printer?");
    }
    try{ await dev.claimInterface(ifaceNum); }
    catch(e){
      const msg = String(e.message || e);
      if (!/already/i.test(msg)){
        try{ await dev.close(); }catch(e2){}
        throw new Error("Could not claim USB interface: " + msg);
      }
    }
    this.device = dev;
    this.endpoint = epNum;
    this.ifaceNum = ifaceNum;
    STORE.set("usb_printer", { vid: dev.vendorId, pid: dev.productId });
    return { vid: dev.vendorId, pid: dev.productId };
  },
  async autoReconnect(){
    if (this.isConnected()) return true;
    if (!this.isSupported()) return false;
    try{
      const known = await navigator.usb.getDevices();
      if (!known || !known.length) return false;
      const saved = STORE.get("usb_printer", null);
      let dev = known[0];
      if (saved){
        const match = known.find(d => d.vendorId === saved.vid && d.productId === saved.pid);
        if (match) dev = match;
      }
      try{ await dev.open(); }
      catch(e){
        const msg = String(e.message || e);
        if (!/already open/i.test(msg) && !/access denied/i.test(msg)) return false;
        if (/access denied/i.test(msg)) return false;
      }
      if (dev.configuration === null){
        try{ await dev.selectConfiguration(1); }catch(e){ return false; }
      }
      let epNum = null, ifaceNum = 0;
      const ifaces = (dev.configuration && dev.configuration.interfaces) || [];
      for (const i of ifaces){
        for (const alt of i.alternates){
          for (const e of alt.endpoints){
            if (e.direction === "out" && (e.type === "bulk" || e.type === "interrupt")){
              epNum = e.endpointNumber; ifaceNum = i.interfaceNumber; break;
            }
          }
          if (epNum !== null) break;
        }
        if (epNum !== null) break;
      }
      if (epNum === null){ try{ await dev.close(); }catch(e){} return false; }
      try{ await dev.claimInterface(ifaceNum); }catch(e){}
      this.device = dev; this.endpoint = epNum; this.ifaceNum = ifaceNum;
      return true;
    }catch(e){ return false; }
  },
  async disconnect(){
    try{ if (this.device) await this.device.close(); }catch(e){}
    this.device = null; this.endpoint = null;
  },
  async send(bytes){
    if (!this.isConnected()){
      const ok = await this.autoReconnect();
      if (!ok) throw new Error("USB printer not connected");
    }
    if (this._busy) throw new Error("USB printer busy");
    this._busy = true;
    try{
      const CHUNK = 4096;
      for (let i = 0; i < bytes.length; i += CHUNK){
        const slice = bytes.slice(i, Math.min(i + CHUNK, bytes.length));
        const res = await this.device.transferOut(this.endpoint, slice);
        if (res && res.status && res.status !== "ok"){
          throw new Error("USB transfer " + res.status);
        }
      }
    } finally { this._busy = false; }
  },
  showHelp(errMsg){
    const ua = navigator.userAgent || "";
    const isWin   = /Win/i.test(ua);
    const isMac   = /Mac/i.test(ua);
    const isLinux = /Linux/i.test(ua) && !/Android/i.test(ua);
    let osSteps = "";
    if (isWin){
      osSteps = `
        <li><b>Windows:</b> The printer is claimed by the Windows print driver. WebUSB cannot share it.</li>
        <li>Download <b>Zadig</b> from <b>zadig.akeo.ie</b> (free).</li>
        <li>Plug the printer in, open Zadig, choose the printer, select <b>WinUSB</b>, click <b>Replace Driver</b>.</li>
        <li>Unplug, replug, then click <b>Connect USB</b> again.</li>`;
    } else if (isMac){
      osSteps = `
        <li><b>macOS:</b> Quit any app that may be using the printer.</li>
        <li>Unplug, replug, try <b>Connect USB</b> again.</li>
        <li>Grant Chrome permission under <b>System Settings → Privacy &amp; Security → Input Monitoring</b>.</li>`;
    } else if (isLinux){
      osSteps = `
        <li><b>Linux:</b> The kernel module <code>usblp</code> is holding the printer.</li>
        <li>Run <code>sudo modprobe -r usblp</code> (until reboot).</li>
        <li>Add a udev rule so your user can claim it.</li>`;
    } else {
      osSteps = `<li>Try a different USB port, cable, or restart the browser.</li>`;
    }
    Modal.open(`
      <div class="m-head"><h2>🔌 USB Connection Help</h2></div>
      <div class="m-body">
        <div class="danger-warn" style="margin-bottom:12px;"><b>${escapeHtml(errMsg || "Access denied")}</b></div>
        <ol class="install-steps" style="font-size:12px;">
          <li><b>Close every other tab</b> of this app.</li>
          <li>Close any other app that might use the printer.</li>
          ${osSteps}
          <li class="faint">Easiest fallback: switch <b>Printer mode</b> to <b>Browser</b>.</li>
        </ol>
      </div>
      <div class="m-foot">
        <button class="btn" id="usb-help-mode-browser">Switch to Browser mode</button>
        <button class="btn primary" id="usb-help-close">OK</button>
      </div>`);
    document.getElementById("usb-help-close")?.addEventListener("click", ()=>Modal.close());
    document.getElementById("usb-help-mode-browser")?.addEventListener("click", ()=>{
      DB.settings.printer_mode = "browser";
      DB.save("settings");
      Persist.putObject("settings", DB.settings);
      Modal.close();
      toast("Printer mode set to Browser", "info");
    });
  },
};

/* ═══════════════════ RECEIPT BUILDERS ═══════════════════ */
const RECEIPT_WIDTH = 42;
function center(s, w=RECEIPT_WIDTH){
  s = String(s);
  if (s.length >= w) return s;
  return " ".repeat(Math.floor((w - s.length)/2)) + s;
}
function lr(left, right, w=RECEIPT_WIDTH){
  left = String(left); right = String(right);
  let gap = w - left.length - right.length;
  if (gap < 1) gap = 1;
  return left + " ".repeat(gap) + right;
}
function sep(ch="-", w=RECEIPT_WIDTH){ return ch.repeat(w); }

function buildReceiptText(order, settings, copyLabel=""){
  const sym = settings.currency_symbol || "LBP ";
  const lines = [];
  if (settings.restaurant_name) lines.push(center(settings.restaurant_name));
  if (settings.tagline) lines.push(center(settings.tagline));
  if (settings.address) lines.push(center(settings.address));
  if (settings.phone)   lines.push(center(settings.phone));
  lines.push(sep("-"));
  if (copyLabel){
    lines.push(center("*** " + copyLabel + " ***"));
    lines.push(sep("-"));
  }
  const when = new Date().toLocaleString([], { hour12:false });
  lines.push(lr("Order: " + order.no, when));
  if (order.customer_name) lines.push("Customer: " + order.customer_name);
  if (order.customer_phone) lines.push("Phone: " + order.customer_phone);
  lines.push("Type: " + (order.type || "Delivery"));
  lines.push(sep("-"));
  for (const it of order.items){
    lines.push(it.name);
    const opts = (it.options||[]).map(o=>o.label).join(", ");
    if (opts) lines.push("  " + opts);
    if (it.note) lines.push("  Note: " + it.note);
    lines.push(lr("  " + it.qty + " x " + fmtMoney(it.unit, sym), fmtMoney(it.line, sym)));
  }
  lines.push(sep("-"));
  lines.push(lr("Subtotal", fmtMoney(order.subtotal, sym)));
  if (order.discount) lines.push(lr("Discount", "-" + fmtMoney(order.discount, sym)));
  if (order.delivery) lines.push(lr("Delivery", fmtMoney(order.delivery, sym)));
  else lines.push(lr("Delivery", "FREE"));
  lines.push(sep("="));
  lines.push(lr("TOTAL", fmtMoney(order.total, sym)));
  const rate = Number(settings.secondary_rate)||90000;
  const sec  = (settings.secondary_currency||"USD").toUpperCase();
  const secSym = sec === "USD" ? "$" : sec + " ";
  if (rate) lines.push(center(secSym + (Number(order.total)/rate).toFixed(2) + "  @ " + rate.toFixed(0)));
  lines.push(sep("="));
  lines.push(lr("Payment", order.payment_method || "Cash"));
  lines.push(sep("-"));
  if (settings.receipt_footer) lines.push(center(settings.receipt_footer));
  lines.push(""); lines.push("");
  return lines.join("\n");
}

function buildEscPosBody(order, settings, copyLabel){
  const sym = settings.currency_symbol || "LBP ";
  const p = new EscPos();
  p.init();
  p.bold(true);
  p.doubleStrike(true);
  p.align(1);
  if (settings.restaurant_name){
    p.size(1,1);
    p.line(settings.restaurant_name);
    p.size(0,0);
  }
  if (settings.tagline) p.line(settings.tagline);
  if (settings.address) p.line(settings.address);
  if (settings.phone)   p.line(settings.phone);
  p.align(0);
  p.line(sep("-"));
  if (copyLabel){
    p.align(1);
    p.line("*** " + copyLabel + " ***");
    p.align(0);
    p.line(sep("-"));
  }
  const when = new Date().toLocaleString([], { hour12:false });
  p.line(lr("Order: " + order.no, when));
  if (order.customer_name) p.line("Customer: " + order.customer_name);
  if (order.customer_phone) p.line("Phone: " + order.customer_phone);
  p.line("Type: " + (order.type || "Delivery"));
  p.line(sep("-"));
  for (const it of order.items){
    p.line(it.name);
    const opts = (it.options||[]).map(o=>o.label).join(", ");
    if (opts) p.line("  " + opts);
    if (it.note) p.line("  Note: " + it.note);
    p.line(lr("  " + it.qty + " x " + fmtMoney(it.unit, sym), fmtMoney(it.line, sym)));
  }
  p.line(sep("-"));
  p.line(lr("Subtotal", fmtMoney(order.subtotal, sym)));
  if (order.discount) p.line(lr("Discount", "-" + fmtMoney(order.discount, sym)));
  if (order.delivery) p.line(lr("Delivery", fmtMoney(order.delivery, sym)));
  else p.line(lr("Delivery", "FREE"));
  p.line(sep("="));
  p.size(1,1);
  p.line(lr("TOTAL", fmtMoney(order.total, sym)));
  p.size(0,0);
  const rate = Number(settings.secondary_rate)||90000;
  const sec  = (settings.secondary_currency||"USD").toUpperCase();
  const secSym = sec === "USD" ? "$" : sec + " ";
  if (rate){
    p.align(1);
    p.line(secSym + (Number(order.total)/rate).toFixed(2) + "  @ " + rate.toFixed(0));
    p.align(0);
  }
  p.line(sep("="));
  p.line(lr("Payment", order.payment_method || "Cash"));
  p.line(sep("-"));
  if (settings.receipt_footer){
    p.align(1); p.line(settings.receipt_footer); p.align(0);
  }
  p.doubleStrike(false);
  p.bold(false);
  return p.bytes();
}

/* Cut FIRST, then kick drawer AFTER */
function buildEscPosCut(settings, opts){
  opts = opts || {};
  const mode = settings.printer_cut || "partial";
  const p = new EscPos();
  p.cut(mode);
  if (opts.drawer) p.kickDrawer();
  return p.bytes();
}
function buildEscPosReceipt(order, settings, copyLabel){
  const body = buildEscPosBody(order, settings, copyLabel);
  const cut  = buildEscPosCut(settings, { drawer: settings.printer_drawer === "1" });
  return concatBytes(body, cut);
}

/* ───────────────────────────────────────────────────────────────
   CLOSE-CASH report — DETAILED invoice-style.
   Every cash order is expanded with its line items:
     name • qty × unit ........ line total
   Then a full expense list, then the drawer summary.
   ─────────────────────────────────────────────────────────────── */
function buildCloseCashText(start, end, settings){
  const sym = settings.currency_symbol || "LBP ";
  const cash = DB.cashSummary(start, end);
  const lines = [];

  lines.push(center(settings.restaurant_name || "Pizza POS"));
  if (settings.address) lines.push(center(settings.address));
  if (settings.phone)   lines.push(center(settings.phone));
  lines.push(center("CLOSE CASH REPORT"));
  lines.push(sep("="));
  lines.push(center(start + "  ->  " + end));
  lines.push(center(new Date().toLocaleString([], { hour12:false })));
  lines.push(sep("="));

  /* ── CASH ORDERS — full invoice detail per order ── */
  const cashOrders = DB.paidOrdersWithItems(start, end)
    .filter(o => o.payment_method === "Cash");

  lines.push("");
  lines.push("CASH ORDERS (" + cashOrders.length + ")");
  lines.push(sep("="));

  if (!cashOrders.length){
    lines.push("  (none)");
    lines.push(sep("-"));
  } else {
    let grandItems = 0;
    let grandLines = 0;

    for (let idx = 0; idx < cashOrders.length; idx++){
      const o = cashOrders[idx];
      const no   = String(o.order_no || "").split("-").pop();
      const when = (o.created_at || "").slice(11,16);
      const date = (o.created_at || "").slice(0,10);

      lines.push("");
      lines.push(sep("-"));
      lines.push(lr("#" + no + "  " + date + " " + when, fmtMoney(o.total, sym)));
      if (o.customer_name){
        const cLine = "  Customer: " + o.customer_name +
          (o.customer_phone ? "  " + o.customer_phone : "");
        lines.push(cLine.slice(0, RECEIPT_WIDTH));
      }
      lines.push("  Items:");
      for (const it of (o.items || [])){
        grandItems += Number(it.qty||0);
        grandLines += 1;
        const nm = "    " + it.name;
        lines.push(nm.slice(0, RECEIPT_WIDTH));
        const optStr = (it.options || "").trim();
        if (optStr) lines.push(("      " + optStr).slice(0, RECEIPT_WIDTH));
        if (it.note) lines.push(("      Note: " + it.note).slice(0, RECEIPT_WIDTH));
        lines.push(lr(
          "      " + it.qty + " x " + fmtMoney(it.unit_price, sym),
          fmtMoney(it.line_total, sym)
        ));
      }
      lines.push(lr("  Order total", fmtMoney(o.total, sym)));
    }

    lines.push(sep("-"));
    lines.push(lr("Total line items", String(grandLines)));
    lines.push(lr("Total qty",        String(grandItems)));
    lines.push(lr("Cash sales",       fmtMoney(cash.cash_sales, sym)));
    lines.push(sep("="));
  }

  /* ── EXPENSES — full detail ── */
  const expenses = DB.expenses
    .filter(x => (x.spent_on||"") >= start && (x.spent_on||"") <= end)
    .sort((a,b) => String(a.spent_on||"").localeCompare(String(b.spent_on||"")));

  lines.push("");
  lines.push("EXPENSES (" + expenses.length + ")");
  lines.push(sep("="));
  if (!expenses.length){
    lines.push("  (none)");
    lines.push(sep("-"));
  } else {
    for (const e of expenses){
      const left = ("  " + (e.spent_on||"") + " " +
                    (e.category||"") + ": " + (e.description||"")).slice(0, 30);
      lines.push(lr(left, fmtMoney(e.amount||0, sym)));
    }
    lines.push(sep("-"));
    lines.push(lr("Expenses total", fmtMoney(cash.expenses, sym)));
    lines.push(sep("="));
  }

  /* ── Drawer summary ── */
  lines.push("");
  lines.push(lr("CASH ORDERS", String(cash.cash_orders)));
  lines.push(lr("CASH SALES",  fmtMoney(cash.cash_sales, sym)));
  lines.push(lr("EXPENSES",    fmtMoney(cash.expenses,   sym)));
  lines.push(sep("="));
  lines.push(lr("EXPECTED DRAWER", fmtMoney(cash.expected, sym)));

  const rate = Number(settings.secondary_rate)||90000;
  const sec  = (settings.secondary_currency||"USD").toUpperCase();
  const secSym = sec === "USD" ? "$" : sec + " ";
  if (rate) lines.push(center(secSym + (cash.expected/rate).toFixed(2) + "  @ " + rate.toFixed(0)));
  lines.push(sep("="));
  lines.push("");
  lines.push(lr("Opened by", "________________"));
  lines.push(lr("Closed by", "________________"));
  lines.push(lr("Signature", "________________"));
  lines.push("");
  return lines.join("\n");
}

/* ═══════════════════ PRINTER ═══════════════════ */
const Printer = {
  copies(settings){
    const n = Number(settings.printer_copies || 2);
    return Math.max(1, Math.min(3, n));
  },
  _estimateMs(bytes){
    let lines = 0;
    for (let i = 0; i < bytes.length; i++){ if (bytes[i] === 0x0A) lines++; }
    return Math.min(9000, Math.max(1800, lines * 95));
  },
  _buildJobs(order, settings){
    const copies     = this.copies(settings);
    const cutBetween = settings.printer_cut_between !== "0";
    const jobs = [];
    for (let i = 0; i < copies; i++){
      const label  = i === 0 ? "CUSTOMER COPY" : "RESTAURANT COPY";
      const isLast = (i === copies - 1);
      const wantCut = isLast || cutBetween;
      const body = buildEscPosBody(order, settings, label);
      const cut  = wantCut
        ? buildEscPosCut(settings, { drawer: i === 0 && settings.printer_drawer === "1" })
        : new Uint8Array(0);
      jobs.push({ label, body, cut, full: concatBytes(body, cut), ms: this._estimateMs(body) });
    }
    return jobs;
  },
  async print(order, settings){
    const mode = (settings.printer_mode || "browser").toLowerCase();
    const jobs = this._buildJobs(order, settings);
    switch (mode){
      case "usb":   return await this._usb(jobs, order, settings);
      case "agent": return await this._agent(jobs, order, settings);
      case "cloud": return await this._cloud(jobs, order, settings);
      default:      return await this._browser(order, settings);
    }
  },
  async _usb(jobs, order, settings){
    if (!USBPrinter.isSupported()){
      toast("WebUSB not supported — use Chrome/Edge on desktop, over HTTPS or localhost.", "error", 6000);
      return { ok:false, error:"usb unsupported" };
    }
    if (!USBPrinter.isConnected()){
      const ok = await USBPrinter.autoReconnect();
      if (!ok){
        toast("USB printer not connected — Settings → Connect USB printer.", "warning", 5000);
        return { ok:false, error:"usb not connected" };
      }
    }
    try{
      for (let i = 0; i < jobs.length; i++){
        const job = jobs[i];
        try{ await USBPrinter.send(job.body); }
        catch(e1){
          const ok = await USBPrinter.autoReconnect();
          if (!ok) throw e1;
          await USBPrinter.send(job.body);
        }
        await sleep(Math.min(job.ms, 4000));
        if (job.cut && job.cut.length){
          try{ await USBPrinter.send(job.cut); }
          catch(e){
            try{ const ok = await USBPrinter.autoReconnect(); if (ok) await USBPrinter.send(job.cut); }catch(e2){}
          }
          await sleep(800);
        }
      }
      toast(`🖨  Printed ${jobs.length} ${jobs.length===1?"copy":"copies"} (USB)`, "success");
      return { ok:true };
    }catch(e){
      const msg = e.message || String(e);
      toast("USB print failed: " + msg, "error", 6000);
      if (/access denied|not connected/i.test(msg)) setTimeout(()=>USBPrinter.showHelp(msg), 400);
      return { ok:false, error:msg };
    }
  },
  async _agent(jobs, order, settings){
    const url = (settings.printer_agent_url || "").trim();
    if (!url){ toast("Set the Print Agent URL in Settings → Printer.", "warning", 5000); return { ok:false, error:"no agent url" }; }
    try{
      const headers = { "Content-Type":"application/json" };
      if (settings.printer_agent_token) headers["X-Auth-Token"] = settings.printer_agent_token;
      const body = {
        printer: settings.printer_name || "",
        order_no: order.no || "",
        cut:     settings.printer_cut || "partial",
        cut_each: settings.printer_cut_between !== "0",
        drawer:  settings.printer_drawer === "1",
        jobs: jobs.map(j => ({ label: j.label, data: Array.from(j.full) })),
      };
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 12000);
      let r;
      try{
        r = await fetch(url.replace(/\/+$/,"") + "/print", {
          method:"POST", headers, body: JSON.stringify(body), signal: ctrl.signal,
        });
      } finally { clearTimeout(timer); }
      if (!r.ok){
        const txt = await r.text().catch(()=> "");
        throw new Error("HTTP " + r.status + (txt ? " " + txt.slice(0,140) : ""));
      }
      toast(`🖨  Sent ${jobs.length} ${jobs.length===1?"copy":"copies"} to agent`, "success");
      return { ok:true };
    }catch(e){
      const msg = e.name === "AbortError" ? "Agent timeout (12s)" : e.message;
      toast("Print agent failed: " + msg, "error", 6000);
      return { ok:false, error:msg };
    }
  },
  async _cloud(jobs, order, settings){
    if (settings.firebase_enabled !== "1"){
      toast("Cloud print needs Firebase enabled (Settings → Cloud).", "warning", 5000);
      return { ok:false, error:"firebase disabled" };
    }
    if (!CloudDB.ready){
      toast("Cloud not connected — check Settings → Cloud.", "error", 5000);
      return { ok:false, error:"cloud not ready" };
    }
    try{
      const all = [];
      for (const j of jobs){ for (let k = 0; k < j.full.length; k++) all.push(j.full[k]); }
      const remoteCopies = Math.max(2, Math.min(3, jobs.length));
      await CloudSync.queuePrintJob({
        printer_name: settings.printer_name || "",
        order_no: order.no || "",
        cut: settings.printer_cut || "partial",
        cut_each: settings.printer_cut_between !== "0",
        drawer: settings.printer_drawer === "1",
        copies: remoteCopies,
        data: all,
        order: order,
      });
      toast("☁  Print job queued — store printer will pick it up", "success");
      return { ok:true };
    }catch(e){
      toast("Cloud print failed: " + e.message, "error", 6000);
      return { ok:false, error:e.message };
    }
  },
  async _browser(order, settings){
    const copies = this.copies(settings);
    const blocks = [];
    for (let i = 0; i < copies; i++){
      const label = i === 0 ? "CUSTOMER COPY" : "RESTAURANT COPY";
      blocks.push(buildReceiptText(order, settings, label));
    }
    await this.printTextViaIframe(blocks);
    return { ok:true };
  },
  async printTextViaIframe(blocks){
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
      html,body{margin:0;padding:0;background:#fff;color:#000;}
      .receipt-copy{
        font-family:'Consolas','Menlo','DejaVu Sans Mono','Courier New',ui-monospace,monospace;
        font-size:12px; font-weight:700;
        -webkit-text-stroke:0.35px #000;
        text-shadow:0 0 0.6px #000, 0 0 0.4px #000;
        line-height:1.35; letter-spacing:0.1px;
        white-space:pre;
        padding:6mm 4mm 18mm 4mm;
        page-break-after:always; break-after:page;
        -webkit-font-smoothing:none;
      }
      .receipt-copy:last-child{ page-break-after:auto; break-after:auto; }
      @media print{
        @page{ size:80mm auto; margin:0; }
        .receipt-copy{ -webkit-text-stroke:0.35px #000; text-shadow:0 0 0.6px #000; }
      }
    </style></head><body>${
      blocks.map(b => `<div class="receipt-copy">${escapeHtml(b)}</div>`).join("")
    }</body></html>`;

    const iframe = document.createElement("iframe");
    iframe.setAttribute("aria-hidden", "true");
    iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;";
    document.body.appendChild(iframe);
    try{
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open(); doc.write(html); doc.close();
      await new Promise(r=>setTimeout(r, 250));
      const w = iframe.contentWindow;
      w.focus(); w.print();
      setTimeout(()=>{ try{ iframe.remove(); }catch(e){} }, 2500);
    }catch(e){
      try{ iframe.remove(); }catch(_){}
      const area = document.getElementById("receipt-area");
      area.innerHTML = blocks.map(b => `<div class="receipt-copy">${escapeHtml(b + "\n\n\n\n")}</div>`).join("");
      setTimeout(()=>window.print(), 80);
    }
  },
  async printText(text, settings){
    const mode = (settings.printer_mode || "browser").toLowerCase();
    if (mode === "browser"){
      await this.printTextViaIframe([text]);
      return { ok:true };
    }
    const p = new EscPos();
    p.init();
    p.bold(true); p.doubleStrike(true); p.align(0);
    for (const line of String(text).split("\n")) p.line(line);
    p.cut(settings.printer_cut || "partial");
    if (settings.printer_drawer === "1") p.kickDrawer();
    p.doubleStrike(false); p.bold(false);
    const bytes = p.bytes();

    if (mode === "usb"){
      if (!USBPrinter.isConnected()){
        const ok = await USBPrinter.autoReconnect();
        if (!ok){ toast("USB printer not connected","warning"); return { ok:false }; }
      }
      try{ await USBPrinter.send(bytes); toast("🖨  Printed (USB)","success"); return { ok:true }; }
      catch(e){ toast("USB print failed: " + e.message,"error",5000); return { ok:false }; }
    }
    if (mode === "agent"){
      const url = (settings.printer_agent_url || "").trim();
      if (!url){ toast("Set Print Agent URL","warning"); return { ok:false }; }
      try{
        const headers = { "Content-Type":"application/json" };
        if (settings.printer_agent_token) headers["X-Auth-Token"] = settings.printer_agent_token;
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), 12000);
        let r;
        try{
          r = await fetch(url.replace(/\/+$/,"") + "/print", {
            method:"POST", headers,
            body: JSON.stringify({
              printer: settings.printer_name || "",
              order_no: "CLOSE-CASH",
              cut: settings.printer_cut || "partial",
              cut_each: false,
              drawer: settings.printer_drawer === "1",
              jobs: [{ label:"CLOSE CASH", data: Array.from(bytes) }],
            }),
            signal: ctrl.signal,
          });
        } finally { clearTimeout(timer); }
        if (!r.ok) throw new Error("HTTP " + r.status);
        toast("🖨  Sent to agent","success"); return { ok:true };
      }catch(e){ toast("Print agent failed: " + e.message,"error",5000); return { ok:false }; }
    }
    if (mode === "cloud"){
      if (settings.firebase_enabled !== "1"){ toast("Cloud print needs Firebase","warning"); return { ok:false }; }
      if (!CloudDB.ready){ toast("Cloud not connected","error"); return { ok:false }; }
      try{
        await CloudSync.queuePrintJob({
          printer_name: settings.printer_name || "",
          order_no: "CLOSE-CASH",
          cut: settings.printer_cut || "partial",
          cut_each: false,
          drawer: settings.printer_drawer === "1",
          copies: 1, data: Array.from(bytes),
        });
        toast("☁  Close Cash queued","success"); return { ok:true };
      }catch(e){ toast("Cloud print failed: " + e.message,"error",5000); return { ok:false }; }
    }
    await this.printTextViaIframe([text]);
    return { ok:true };
  },
};

/* ═══════════════════ PRINT LISTENER ═══════════════════ */
const PrintListener = {
  unsub: null, active: false, processing: new Set(),
  lastJobAt: null, lastJobInfo: "", processedCount: 0, failedCount: 0,
  _restartTimer: null,
  isEnabled(){ return DB.settings.printer_store_listener === "1"; },
  start(){
    if (!this.isEnabled()){ this.stop(); return; }
    if (!CloudDB.ready){
      if (!this._restartTimer){
        this._restartTimer = setTimeout(()=>{
          this._restartTimer = null;
          if (this.isEnabled() && !this.active) this.start();
        }, 2500);
      }
      return;
    }
    if (this.active) return;
    const colName = CloudDB.printJobsCol();
    try{
      this.unsub = CloudDB.db.collection(colName)
        .where("status", "==", "pending")
        .onSnapshot(snap => {
          snap.docChanges().forEach(change => {
            if (change.type === "added" || change.type === "modified"){
              const data = change.doc.data() || {};
              const id   = change.doc.id;
              this.handleJob(id, data);
            }
          });
        }, err => {
          console.warn("Print listener error:", err);
          ListenerPill.set("error", "Listener error: " + ((err && err.message) || err));
          this.active = false;
          if (!this._restartTimer){
            this._restartTimer = setTimeout(()=>{
              this._restartTimer = null;
              if (this.isEnabled()){ this.stop(); this.start(); }
            }, 5000);
          }
        });
      this.active = true;
      ListenerPill.set("on", "Listening for print jobs on '" + colName + "'");
      console.info("[PrintListener] listening on", colName);
    }catch(e){
      console.warn("PrintListener start failed:", e);
      ListenerPill.set("error", String(e.message || e));
    }
  },
  stop(){
    if (this._restartTimer){ clearTimeout(this._restartTimer); this._restartTimer = null; }
    if (this.unsub){ try{ this.unsub(); }catch(e){} }
    this.unsub = null;
    this.active = false;
    ListenerPill.set("off", "Listener off");
  },
  restart(){ this.stop(); if (this.isEnabled()) this.start(); },
  async _claim(jobId){
    const colName = CloudDB.printJobsCol();
    const ref = CloudDB.db.collection(colName).doc(jobId);
    try{
      return await CloudDB.db.runTransaction(async (t) => {
        const doc = await t.get(ref);
        if (!doc.exists) return { ok:false, reason:"gone" };
        const d = doc.data() || {};
        if (d.status && d.status !== "pending"){ return { ok:false, reason:"already-" + d.status }; }
        if (d.claimed_at && d.claimed_by && d.claimed_by !== CloudDB.uid){
          const age = Date.now() - new Date(d.claimed_at).getTime();
          if (age < 120000){ return { ok:false, reason:"claimed-by-other" }; }
        }
        t.update(ref, {
          status: "processing",
          claimed_by: CloudDB.uid || "unknown",
          claimed_at: nowIso(),
        });
        return { ok:true, data: d };
      });
    }catch(e){
      console.warn("claim failed:", e);
      return { ok:false, reason: String(e.message || e) };
    }
  },
  async _mark(jobId, patch){
    const colName = CloudDB.printJobsCol();
    try{ await CloudDB.db.collection(colName).doc(jobId).update(sanitize(patch)); }
    catch(e){ console.warn("mark job failed:", e); }
  },
  async handleJob(jobId, data){
    if (this.processing.has(jobId)) return;
    this.processing.add(jobId);
    try{
      if (data.created_by && CloudDB.uid && data.created_by === CloudDB.uid){
        await this._mark(jobId, {
          status: "done", printed_at: nowIso(), printed_by: CloudDB.uid,
          note: "skipped own job (already printed locally)",
        });
        return;
      }
      const claim = await this._claim(jobId);
      if (!claim.ok){
        if (claim.reason !== "claimed-by-other" && claim.reason !== "already-done"){
          console.info("[PrintListener] skip", jobId, claim.reason);
        }
        return;
      }
      const job = claim.data || {};
      const bytes = new Uint8Array(job.data || []);
      const hasOrder = job.order && typeof job.order === "object" && Array.isArray(job.order.items);
      if (!bytes.length && !hasOrder) throw new Error("job has no data");

      let lastErr = null;
      for (let attempt = 1; attempt <= 2; attempt++){
        try{ await this._printLocal(bytes, job); lastErr = null; break; }
        catch(e){
          lastErr = e;
          console.warn("[PrintListener] attempt", attempt, "failed:", e.message);
          if (attempt < 2) await sleep(1500);
        }
      }
      if (lastErr) throw lastErr;

      this.processedCount++;
      this.lastJobAt = new Date();
      this.lastJobInfo = job.order_no || jobId;
      await this._mark(jobId, {
        status: "done", printed_at: nowIso(), printed_by: CloudDB.uid || "unknown",
      });
      ListenerPill.set("on", "Listening · last job " + (job.order_no || jobId));
      toast("🖨  Printed remote order " + (job.order_no || ""), "success");
    }catch(e){
      this.failedCount++;
      console.warn("[PrintListener] print failed:", e);
      await this._mark(jobId, {
        status: "error", error: String(e.message || e),
        attempted_at: nowIso(), attempted_by: CloudDB.uid || "unknown",
      });
      ListenerPill.set("warn", "Last job failed: " + (e.message || e));
      toast("Remote print failed: " + (e.message || e), "error", 5000);
    } finally { this.processing.delete(jobId); }
  },
  async _printLocal(bytes, job){
    if (job && job.order && typeof job.order === "object" && Array.isArray(job.order.items)){
      const storeSettings = Object.assign({}, DB.settings);
      const wantCopies = Math.max(2, Math.min(3, Number(job.copies) || 2));
      storeSettings.printer_copies = String(wantCopies);
      storeSettings.printer_cut_between = "1";
      if (job.cut && job.cut !== "none") storeSettings.printer_cut = job.cut;
      else if (!storeSettings.printer_cut || storeSettings.printer_cut === "none")
        storeSettings.printer_cut = "partial";
      if (job.drawer) storeSettings.printer_drawer = "1";
      return await this._printOrder(job.order, storeSettings);
    }
    const mode = (DB.settings.printer_mode || "browser").toLowerCase();
    if (mode === "usb"){
      if (!USBPrinter.isConnected()){
        const ok = await USBPrinter.autoReconnect();
        if (!ok) throw new Error("USB printer not connected on store device");
      }
      await USBPrinter.send(bytes);
      return;
    }
    if (mode === "agent"){
      const url = (DB.settings.printer_agent_url || "").trim();
      if (!url) throw new Error("no agent URL on store device");
      const headers = { "Content-Type":"application/json" };
      if (DB.settings.printer_agent_token) headers["X-Auth-Token"] = DB.settings.printer_agent_token;
      const body = {
        printer: DB.settings.printer_name || "",
        order_no: job.order_no || "",
        cut: job.cut || DB.settings.printer_cut || "partial",
        cut_each: job.cut_each !== false,
        drawer: job.drawer === true,
        jobs: [{ label: "REMOTE", data: Array.from(bytes) }],
      };
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 12000);
      let r;
      try{
        r = await fetch(url.replace(/\/+$/,"") + "/print", {
          method:"POST", headers, body: JSON.stringify(body), signal: ctrl.signal,
        });
      } finally { clearTimeout(timer); }
      if (!r.ok) throw new Error("agent HTTP " + r.status);
      return;
    }
    const text = this._decodeEscPosText(bytes);
    await Printer.printTextViaIframe([text]);
  },
  async _printOrder(order, settings){
    settings = Object.assign({}, settings);
    settings.printer_cut_between = "1";
    if (!settings.printer_cut || settings.printer_cut === "none"){
      settings.printer_cut = "partial";
    }
    const _n = Number(settings.printer_copies || 2);
    settings.printer_copies = String(Math.max(2, Math.min(3, _n)));
    const mode = (settings.printer_mode || "browser").toLowerCase();
    const jobs = Printer._buildJobs(order, settings);

    if (mode === "usb"){
      if (!USBPrinter.isConnected()){
        const ok = await USBPrinter.autoReconnect();
        if (!ok) throw new Error("USB printer not connected on store device");
      }
      for (const j of jobs){
        await USBPrinter.send(j.body);
        await sleep(Math.min(j.ms, 4000));
        if (j.cut && j.cut.length){
          try{ await USBPrinter.send(j.cut); }
          catch(e){
            try{ const ok = await USBPrinter.autoReconnect(); if (ok) await USBPrinter.send(j.cut); }catch(e2){}
          }
          await sleep(1200);
        }
      }
      return;
    }
    if (mode === "agent"){
      const url = (settings.printer_agent_url || "").trim();
      if (!url) throw new Error("no agent URL on store device");
      const headers = { "Content-Type":"application/json" };
      if (settings.printer_agent_token) headers["X-Auth-Token"] = settings.printer_agent_token;
      const body = {
        printer: settings.printer_name || "",
        order_no: order.no || "",
        cut: settings.printer_cut || "partial",
        cut_each: true,
        drawer: settings.printer_drawer === "1",
        jobs: jobs.map(j => ({ label: j.label, data: Array.from(j.full) })),
      };
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 20000);
      let r;
      try{
        r = await fetch(url.replace(/\/+$/,"") + "/print", {
          method:"POST", headers, body: JSON.stringify(body), signal: ctrl.signal,
        });
      } finally { clearTimeout(timer); }
      if (!r.ok) throw new Error("agent HTTP " + r.status);
      return;
    }
    const blocks = jobs.map(j => buildReceiptText(order, settings, j.label));
    await Printer.printTextViaIframe(blocks);
  },
  _decodeEscPosText(bytes){
    const out = [];
    let i = 0;
    const n = bytes.length;
    while (i < n){
      const b = bytes[i];
      if (b === 0x1B){
        const c = bytes[i+1];
        if (c === 0x40){ i += 2; continue; }
        if (c === 0x61){ i += 3; continue; }
        if (c === 0x45){ i += 3; continue; }
        if (c === 0x47){ i += 3; continue; }
        if (c === 0x64){ i += 3; continue; }
        if (c === 0x70){ i += 5; continue; }
        i += 2; continue;
      }
      if (b === 0x1D){
        const c = bytes[i+1];
        if (c === 0x21){ i += 3; continue; }
        if (c === 0x56){ i += 4; continue; }
        i += 2; continue;
      }
      if (b === 0x0A){ out.push("\n"); i++; continue; }
      if (b === 0x0D){ i++; continue; }
      if (b >= 0x20 && b < 0x80){ out.push(String.fromCharCode(b)); i++; continue; }
      if (b >= 0x80){ out.push("?"); i++; continue; }
      i++;
    }
    return out.join("");
  },
  async poll(){
    if (!this.isEnabled() || !CloudDB.ready) return;
    const colName = CloudDB.printJobsCol();
    try{
      const snap = await CloudDB.db.collection(colName)
        .where("status", "==", "pending")
        .limit(20)
        .get();
      for (const doc of snap.docs){
        this.handleJob(doc.id, doc.data() || {});
      }
    }catch(e){ console.warn("[PrintListener] poll failed:", e); }
  },
};

const ListenerPill = {
  state: "off",
  set(state, msg){
    this.state = state;
    const pill = document.getElementById("listener-pill");
    const txt  = document.getElementById("listener-pill-txt");
    if (!pill || !txt) return;
    pill.classList.remove("ok","bad","warn");
    if (state === "on"){        pill.classList.add("ok");   txt.textContent = "Listener"; }
    else if (state === "warn"){ pill.classList.add("warn"); txt.textContent = "Listener !"; }
    else if (state === "error"){ pill.classList.add("bad"); txt.textContent = "Listener err"; }
    else { txt.textContent = "Listener off"; }
    pill.title = msg || txt.textContent;
  },
};

/* ═══════════════════ RESET REPORTS ═══════════════════ */
const ResetReports = {
  _count(scope, from, to){
    let ordersN = 0, itemsN = 0, expN = 0;
    if (scope === "all"){
      ordersN = DB.orders.length;
      itemsN  = DB.order_items.length;
      expN    = DB.expenses.length;
    } else {
      const ids = new Set();
      for (const o of DB.orders){
        const d = (o.created_at||"").slice(0,10);
        if (d >= from && d <= to) ids.add(o.id);
      }
      ordersN = ids.size;
      itemsN  = DB.order_items.filter(i => ids.has(i.order_id)).length;
      expN    = DB.expenses.filter(e => {
        const d = e.spent_on || "";
        return d >= from && d <= to;
      }).length;
    }
    return { ordersN, itemsN, expN };
  },
  async run(scope, from, to){
    const orderIds = new Set();
    for (const o of DB.orders){
      if (scope === "all") orderIds.add(o.id);
      else {
        const d = (o.created_at||"").slice(0,10);
        if (d >= from && d <= to) orderIds.add(o.id);
      }
    }
    if (CloudDB.ready){
      try{
        const osnap = await CloudDB.col("orders").get();
        let batch = CloudDB.db.batch(), n = 0;
        for (const doc of osnap.docs){
          if (orderIds.has(Number(doc.data().id))){
            batch.delete(doc.ref);
            if (++n >= 400){ await batch.commit(); batch = CloudDB.db.batch(); n = 0; }
          }
        }
        if (n) await batch.commit();

        const isnap = await CloudDB.col("order_items").get();
        batch = CloudDB.db.batch(); n = 0;
        for (const doc of isnap.docs){
          if (orderIds.has(Number(doc.data().order_id))){
            batch.delete(doc.ref);
            if (++n >= 400){ await batch.commit(); batch = CloudDB.db.batch(); n = 0; }
          }
        }
        if (n) await batch.commit();

        const esnap = await CloudDB.col("expenses").get();
        batch = CloudDB.db.batch(); n = 0;
        for (const doc of esnap.docs){
          const d = doc.data() || {};
          const inRange = scope === "all"
            || ((d.spent_on||"") >= from && (d.spent_on||"") <= to);
          if (inRange){
            batch.delete(doc.ref);
            if (++n >= 400){ await batch.commit(); batch = CloudDB.db.batch(); n = 0; }
          }
        }
        if (n) await batch.commit();
      }catch(e){
        console.warn("Reset cloud deletion failed:", e);
        throw e;
      }
    }
    DB.orders      = DB.orders.filter(o => !orderIds.has(o.id));
    DB.order_items = DB.order_items.filter(i => !orderIds.has(i.order_id));
    if (scope === "all") DB.expenses = [];
    else DB.expenses = DB.expenses.filter(e => !((e.spent_on||"") >= from && (e.spent_on||"") <= to));
    DB.saveAll();
    return orderIds.size;
  },
  open(onDone){
    Modal.open(`
      <div class="m-head"><h2>${escapeHtml(t("reset_reports"))}</h2></div>
      <div class="m-body">
        <div class="danger-warn">⚠ ${escapeHtml(t("reset_warning"))}</div>
        <div class="faint" style="font-size:11px; line-height:1.6; margin-bottom:10px;">
          ${escapeHtml(t("reset_reports_hint"))}
        </div>
        <div class="form-row">
          <label>${escapeHtml(t("reset_scope"))}</label>
          <div class="seg" id="rs-seg">
            <button data-scope="all" class="on">${escapeHtml(t("reset_scope_all"))}</button>
            <button data-scope="range">${escapeHtml(t("reset_scope_range"))}</button>
          </div>
        </div>
        <div id="rs-range-fields" style="display:none;">
          <div class="form-row"><label>${escapeHtml(t("reset_from"))}</label>
            <input type="date" id="rs-from" value="${addDaysStr(todayStr(), -30)}"></div>
          <div class="form-row"><label>${escapeHtml(t("reset_to"))}</label>
            <input type="date" id="rs-to" value="${todayStr()}"></div>
        </div>
        <h3 style="margin:10px 0 6px;">${escapeHtml(t("reset_preview_title"))}</h3>
        <div class="diag" id="rs-preview">…</div>
      </div>
      <div class="m-foot">
        <button class="btn" id="rs-cancel">${escapeHtml(t("cancel"))}</button>
        <button class="btn danger" id="rs-go">${escapeHtml(t("reset_confirm"))}</button>
      </div>`);
    let scope = "all";
    const updatePreview = ()=>{
      const pv = document.getElementById("rs-preview");
      if (!pv) return;
      const f  = (document.getElementById("rs-from") || {}).value || "";
      const t2 = (document.getElementById("rs-to")   || {}).value || "";
      const c  = this._count(scope, f, t2);
      if (c.ordersN === 0 && c.itemsN === 0 && c.expN === 0){
        pv.innerHTML = `<span class="warn">${escapeHtml(t("reset_nothing"))}</span>`;
        return;
      }
      pv.innerHTML =
        `<b>${escapeHtml(t("orders"))}:</b> ${c.ordersN}<br>` +
        `<b>Order lines:</b> ${c.itemsN}<br>` +
        `<b>${escapeHtml(t("expenses"))}:</b> ${c.expN}`;
    };
    const seg = document.getElementById("rs-seg");
    seg.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        scope = b.dataset.scope;
        seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        document.getElementById("rs-range-fields").style.display = scope === "range" ? "block" : "none";
        updatePreview();
      });
    });
    const rf = document.getElementById("rs-from");
    const rt = document.getElementById("rs-to");
    if (rf) rf.addEventListener("change", updatePreview);
    if (rt) rt.addEventListener("change", updatePreview);
    document.getElementById("rs-cancel").addEventListener("click", ()=>Modal.close());
    document.getElementById("rs-go").addEventListener("click", async ()=>{
      const f  = rf.value;
      const t2 = rt.value;
      if (scope === "range" && (!f || !t2)){ toast(t("required"), "warning"); return; }
      const msg = scope === "all" ? t("reset_go_all_q") : t("reset_go_range_q", { from: f, to: t2 });
      if (!confirm(msg)) return;
      const goBtn = document.getElementById("rs-go");
      goBtn.disabled = true;
      goBtn.textContent = "…";
      try{
        const n = await ResetReports.run(scope, f, t2);
        Modal.close();
        toast(t("reset_done", { n }), "success", 4500);
        if (onDone) onDone(n);
      }catch(e){
        goBtn.disabled = false;
        goBtn.textContent = t("reset_confirm");
        toast("Reset failed: " + (e.message || e), "error", 6000);
      }
    });
    updatePreview();
  },
};

        if (p) POSPage.addProduct(p);
      });
    });
    grid.querySelectorAll("[data-edit]").forEach(b=>{
      b.addEventListener("click", e=>{
        e.stopPropagation();
        ProductEditor.open(Number(b.dataset.edit), ()=>{
          POSPage.renderProducts(); POSPage.refreshCategories();
        });
      });
    });
  },
  addProduct(p){
    if (p.track_stock && p.stock <= 0){ toast(`${p.name} is out of stock`, "warning"); return; }
    if (p.has_options) this.showOptionDialog(p);
    else this.addItemToCart(p, 1, [], Number(p.price), "");
  },
  addItemToCart(p, qty, options, unit, note){
    this.current_order.items.push({
      key: `${p.id}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
      product_id: p.id, name: p.name, emoji: p.emoji,
      qty, unit, base_unit: unit, options, note: note || "",
      edited: false, line: unit * qty,
    });
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  showOptionDialog(p){
    const groups = optionsFor(p);
    const state = { size:null, flavorSet:new Set(), groups:{}, qty:1, note:"", override:"" };
    const sym = DB.settings.currency_symbol;
    const collectChosen = ()=>{
      const chosen = [];
      const isLarge = state.size === "Large";
      for (const grp of groups){
        if (grp.large_only && !isLarge) continue;
        if (grp.name === "Size"){
          if (state.size){
            const ch = grp.choices.find(c=>c.label === state.size);
            chosen.push({ group:grp.name, label:state.size, price: ch?ch.price:0 });
          }
        } else if (grp.name === "Flavor"){
          for (const l of state.flavorSet){
            const ch = grp.choices.find(c=>c.label === l);
            chosen.push({ group:grp.name, label:l, price: ch?ch.price:0 });
          }
        } else {
          const sel = state.groups[grp.name] || {};
          for (const l of Object.keys(sel)){
            if (sel[l]){
              const ch = grp.choices.find(c=>c.label === l);
              chosen.push({ group:grp.name, label:l, price: ch?ch.price:0 });
            }
          }
        }
      }
      return chosen;
    };
    const rebuild = ()=>{
      const autoUnit = computeUnitPrice(p, collectChosen());
      let html = `<div class="m-head">
        <div style="font-size:34px;">${escapeHtml(p.emoji||"🍕")}</div>
        <h2 style="flex:1;">${escapeHtml(p.name)}</h2>
        <button class="btn ghost" id="opt-cancel-x">✕</button>
      </div><div class="m-body">`;
      for (const grp of groups){
        const isSize    = grp.name === "Size";
        const isFlavor  = grp.name === "Flavor";
        const isExtras  = grp.name === EXTRAS_GROUP_NAME;
        const largeOnly = !!grp.large_only;
        const isLarge   = state.size === "Large";
        const show = isExtras || !largeOnly || isLarge;
        let hint;
        if (isExtras) hint = ` <span class="faint">(optional · tap to toggle)</span>`;
        else if (isFlavor && largeOnly) hint = ` <span class="faint">(optional · choose 1 or 2)</span>`;
        else if (grp.multi && grp.max_choices) hint = ` <span class="faint">(up to ${grp.max_choices})</span>`;
        else if (grp.multi) hint = " <span class='faint'>(multiple)</span>";
        else hint = "";
        html += `<div class="opt-group" style="display:${show?"block":"none"};">`
          + `<h3>${escapeHtml(grp.name)}${hint}</h3>`
          + `<div class="opt-chips">`;
        for (const ch of grp.choices){
          let on = false;
          if (isSize) on = state.size === ch.label;
          else if (isFlavor) on = state.flavorSet.has(ch.label);
          else on = !!(state.groups[grp.name] && state.groups[grp.name][ch.label]);
          let priceStr = "";
          if (Number(ch.price)){
            const sign = ch.price > 0 ? "+" : "−";
            priceStr = `  ${sign}${fmtMoney(Math.abs(ch.price), sym)}`;
          }
          html += `<button class="opt-chip ${on?"on":""}" data-grp="${escapeHtml(grp.name)}" data-label="${escapeHtml(ch.label)}">${escapeHtml(ch.label)}${priceStr}</button>`;
        }
        html += `</div></div>`;
      }
      html += `<div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
        <span class="muted">${escapeHtml(t("quantity"))}</span>
        <input type="number" id="opt-qty" min="1" max="99" value="${state.qty}" style="width:90px;">
      </div>
      <div class="form-row" style="margin-top:10px;">
        <label>${escapeHtml(t("unit_price"))}</label>
        <input type="number" id="opt-price" min="0" step="1000"
               value="${escapeHtml(state.override)}" placeholder="${Math.round(autoUnit)}">
      </div>
      <div class="faint" style="font-size:11px; margin:2px 0 0;">
        ${escapeHtml(t("auto_price"))}: <b>${escapeHtml(fmtMoney(autoUnit, sym))}</b> —
        ${escapeHtml(t("custom_price_hint"))}.
      </div>
      <div style="margin-top:10px;">
        <h3 style="margin-bottom:6px;">${escapeHtml(t("note_optional"))}</h3>
        <textarea id="opt-note" rows="2" maxlength="180" placeholder="${escapeHtml(t("note_placeholder"))}" style="width:100%; font-family:inherit; font-size:13px;">${escapeHtml(state.note)}</textarea>
      </div>
      </div>
      <div class="m-foot">
        <button class="btn" id="opt-cancel">${escapeHtml(t("cancel"))}</button>
        <button class="btn primary" id="opt-add">${escapeHtml(t("add_to_order"))}</button>
      </div>`;
      Modal._render(html);
      document.getElementById("opt-cancel-x").addEventListener("click", ()=>Modal.close());
      document.getElementById("opt-cancel").addEventListener("click", ()=>Modal.close());
      document.getElementById("opt-qty").addEventListener("input", e=>{
        state.qty = Math.max(1, Math.min(99, Number(e.target.value)||1));
      });
      document.getElementById("opt-price").addEventListener("input", e=>{ state.override = e.target.value; });
      document.getElementById("opt-note").addEventListener("input", e=>{ state.note = e.target.value; });
      document.getElementById("opt-add").addEventListener("click", ()=>finalize());
      document.getElementById("modal").querySelectorAll(".opt-chip").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const g = btn.dataset.grp, l = btn.dataset.label;
          if (g === "Size"){
            state.size = (state.size === l) ? null : l;
            if (state.size !== "Large") state.flavorSet.clear();
          } else if (g === "Flavor"){
            if (state.flavorSet.has(l)) state.flavorSet.delete(l);
            else {
              if (state.flavorSet.size >= 2) state.flavorSet.delete(state.flavorSet.values().next().value);
              state.flavorSet.add(l);
            }
          } else {
            const grp = groups.find(x=>x.name === g);
            state.groups[g] = state.groups[g] || {};
            if (grp && !grp.multi) state.groups[g] = { [l]: true };
            else state.groups[g][l] = !state.groups[g][l];
          }
          rebuild();
        });
      });
    };
    const finalize = ()=>{
      const chosen = collectChosen();
      let unit = computeUnitPrice(p, chosen);
      const ov = String(state.override||"").trim();
      if (ov !== "" && Number.isFinite(Number(ov))) unit = Math.max(0, Number(ov));
      const note = (state.note||"").trim();
      Modal.close();
      this.addItemToCart(p, state.qty, chosen, unit, note);
    };
    Modal.open("");
    rebuild();
  },
  renderCart(){
    const wrap = document.getElementById("cart-list");
    if (!wrap || !this.current_order) return;
    const items = this.current_order.items;
    if (!items.length){
      wrap.innerHTML = `<div class="cart-empty">${escapeHtml(t("cart_empty")).replace(/\n/g,"<br>")}</div>`;
      return;
    }
    const s = DB.settings;
    wrap.innerHTML = items.map(it=>{
      const opts = (it.options||[]).map(o=>o.label).join(", ");
      const note = (it.note||"").trim();
      const edited = it.edited ? `<span class="tag-edited">✎</span>` : "";
      return `<div class="cart-line" data-key="${escapeHtml(it.key)}">
        <div class="info">
          <div class="nm">${escapeHtml(it.emoji||"")} ${escapeHtml(it.name)}</div>
          ${opts?`<div class="opts">${escapeHtml(opts)}</div>`:""}
          ${note?`<div class="note">📝 ${escapeHtml(note)}</div>`:""}
          <div class="unit" data-act="price" title="${escapeHtml(t("edit_line_price"))}">
            ${fmtMoney(it.unit, s.currency_symbol)} ✎
            <span class="faint">(${fmtMoneySecondary(it.unit, s)})</span>${edited}
          </div>
        </div>
        <div class="qty-ctrl">
          <button data-act="dec">−</button>
          <div class="q">${it.qty}</div>
          <button data-act="inc">+</button>
        </div>
        <div class="total">${fmtMoney(it.line, s.currency_symbol)}
          <div class="usd">${fmtMoneySecondary(it.line, s)}</div></div>
        <button class="btn icon" data-act="del">✕</button>
      </div>`;
    }).join("");
    wrap.querySelectorAll(".cart-line").forEach(line=>{
      const key = line.dataset.key;
      line.querySelectorAll("button").forEach(b=>{
        b.addEventListener("click", ()=>{
          const act = b.dataset.act;
          if (act === "inc") this.changeQty(key, +1);
          else if (act === "dec") this.changeQty(key, -1);
          else if (act === "del") this.removeItem(key);
        });
      });
      const u = line.querySelector('[data-act="price"]');
      if (u) u.addEventListener("click", ()=>this.editLinePrice(key));
    });
  },
  editLinePrice(key){
    const it = this.current_order && this.current_order.items.find(i=>i.key === key);
    if (!it) return;
    PricePrompt.open({
      title: t("edit_line_price"),
      subtitle: `${it.emoji||""} ${it.name}  •  ${t("quantity")} ${it.qty}`,
      value: it.unit,
      baseValue: (it.base_unit != null ? it.base_unit : it.unit),
      qty: it.qty,
      footer: t("line_price_footer"),
      onApply: v=>{
        const base = (it.base_unit != null ? it.base_unit : it.unit);
        it.unit = v;
        it.edited = (v !== base);
        it.line = it.unit * it.qty;
        this.renderCart(); this.recalc(); this.updateCartFab();
        toast(t("line_price_updated"), "success");
      },
    });
  },
  changeQty(key, delta){
    for (const it of this.current_order.items){
      if (it.key === key){
        it.qty = Math.max(1, it.qty + delta);
        it.line = it.unit * it.qty;
        break;
      }
    }
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  removeItem(key){
    this.current_order.items = this.current_order.items.filter(i=>i.key !== key);
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  recalc(){
    if (!this.current_order) return;
    const s = DB.settings;
    const subtotal = this.current_order.items.reduce((a,i)=>a + (Number(i.line)||0), 0);
    let disc = Number((document.getElementById("disc-in")||{}).value) || 0;
    disc = Math.max(0, disc);
    const base = Math.max(0, subtotal - disc);
    const tax = 0;
    const delivery = Math.max(0, this.getDeliveryFee());
    const grand = base + tax + delivery;
    Object.assign(this.current_order, { subtotal, discount:disc, tax, delivery, total:grand });
    const sub = document.getElementById("sum-sub");
    const del = document.getElementById("sum-del");
    const gr  = document.getElementById("sum-grand");
    if (sub) sub.textContent   = fmtMoneyDual(subtotal, s);
    if (del) del.textContent   = delivery === 0 ? t("free_delivery") : fmtMoneyDual(delivery, s);
    if (gr)  gr.textContent    = fmtMoneyDual(grand, s);
    this.updateCartFab();
  },
  renderTabs(){
    const bar = document.getElementById("pos-tabs");
    if (!bar) return;
    const orders = DB.openOrders();
    const curId = this.current_order && this.current_order.id;
    let html = `<button class="btn chip ${!curId ? "tab-draft active" : "tab-draft"}" data-id="new">+ ${escapeHtml(t("new_order"))}</button>`;
    for (const o of orders){
      const num = String(o.order_no||"").split("-").pop();
      const isCur = o.id === curId;
      const itemCount = o.items.reduce((a,i)=>a + Number(i.qty||0), 0);
      const ttl = o.order_no + " • " + fmtMoney(o.total) + " • " + itemCount + " items";
      html += `<button class="btn chip ${isCur ? "active" : ""}" data-id="${o.id}"
        title="${escapeHtml(ttl)}">#${escapeHtml(num)}<span class="tab-del"
        data-del="${o.id}" title="${escapeHtml(t("void_order"))}">✕</span></button>`;
    }
    bar.innerHTML = html;
    bar.querySelectorAll(".tab-del").forEach(sp=>{
      sp.addEventListener("click", e=>{
        e.stopPropagation();
        this.voidOrder(Number(sp.dataset.del));
      });
    });
    bar.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        if (b.dataset.id === "new") this.newOrder();
        else {
          const o = orders.find(x=>x.id === Number(b.dataset.id));
          if (o) this.loadOrder(o);
        }
      });
    });
    this.updateHeldBadge();
  },
  loadOrder(o){
    this.current_order = {
      id:o.id, no:o.order_no, type:o.order_type || "Delivery",
      items: o.items.map(i=>{
        const prod = DB.getProduct(i.product_id);
        return {
          key:String(i.id), product_id:i.product_id, name:i.name,
          emoji: prod ? (prod.emoji||"") : "",
          qty:i.qty, unit:i.unit_price, base_unit:i.unit_price, edited:false,
          options: String(i.options||"").split(",").map(t=>({label:t.trim()})).filter(x=>x.label),
          note: i.note||"", line:i.line_total,
        };
      }),
      customer_id:o.customer_id, customer_name:o.customer_name || "",
      customer_phone:o.customer_phone || "",
      discount:Number(o.discount)||0, delivery:Number(o.delivery)||0,
    };
    this.setCustomer(o.customer_id, o.customer_name || "");
    document.getElementById("disc-in").value = String(this.current_order.discount|0);
    this.setDeliveryFee(this.current_order.delivery);
    this.updateOrderHeader();
    this.renderCart(); this.recalc(); this.renderTabs(); this.updateCartFab();
    if (isMobile()) this.openCartSheet();
  },
  newOrder(){
    this.current_order = {
      id:null, no: DB.nextOrderNo(), type:"Delivery",
      items:[], customer_id:null, customer_name:"", customer_phone:"",
      discount:0, delivery:0, subtotal:0, tax:0, total:0,
    };
    this.setCustomer(null, "");
    document.getElementById("disc-in").value = "0";
    this.setDeliveryFee(defaultDeliveryFee());
    this.updateOrderHeader();
    this.renderCart(); this.recalc(); this.renderTabs(); this.updateCartFab();
  },
  clearOrder(){
    if (!this.current_order) return;
    if (this.current_order.items.length && !confirm(t("clear_order_q"))) return;
    this.current_order.items = [];
    document.getElementById("disc-in").value = "0";
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  holdOrder(){
    if (!this.current_order || !this.current_order.items.length){
      toast(t("nothing_to_hold"), "warning"); return;
    }
    const wasEditing = !!this.current_order.id;
    const { id, name, phone } = this.resolveCustomer();
    this.current_order.customer_id = id;
    this.current_order.customer_name = name;
    this.current_order.customer_phone = phone;
    DB.saveOrder(this.current_order, "open");
    DB.saveAll();
    toast(`${this.current_order.no} ${wasEditing ? t("order_updated") : t("order_held")}`, "success");
    this.newOrder();
    if (isMobile()) this.closeCartSheet();
  },
  voidOrder(id){
    const row = DB.orders.find(x=>x.id === id);
    if (!row) return;
    if (!confirm(t("void_order_q"))) return;
    const wasCurrent = !!(this.current_order && this.current_order.id === id);
    DB.voidOrder(id);
    toast(t("order_voided"), "success");
    if (wasCurrent) this.newOrder();
    else this.renderTabs();
  },
  payOrder(){
    if (!this.current_order || !this.current_order.items.length){
      toast(t("cart_is_empty"), "warning"); return;
    }
    const total = this.current_order.total;
    const s = DB.settings;
    Modal.open(`<div class="m-head"><h1>${escapeHtml(t("take_payment"))}</h1></div>
      <div class="m-body">
        <div style="font-size:14px; font-weight:700; margin-bottom:12px;">
          ${escapeHtml(t("total"))}: ${fmtMoneyDual(total, s)}</div>
        <div class="muted" style="font-size:12px; margin-bottom:6px;">${escapeHtml(t("payment_cash"))}</div>
        <h3>${escapeHtml(t("amount_tendered"))}</h3>
        <input type="number" id="pay-cash" value="${Math.round(total)}" style="margin-top:6px;">
        <div id="pay-change" class="muted" style="margin-top:8px;">${escapeHtml(t("change"))}: —</div>
      </div>
      <div class="m-foot">
        <button class="btn" id="pay-cancel">${escapeHtml(t("cancel"))}</button>
        <button class="btn success" id="pay-ok">${escapeHtml(t("confirm_payment"))}</button>
      </div>`);
    const update = ()=>{
      const v = Number(document.getElementById("pay-cash").value) || 0;
      const ch = v - total;
      const el = document.getElementById("pay-change");
      if (ch >= 0) el.textContent = t("change") + ": " + fmtMoneyDual(ch, s);
      else el.textContent = t("insufficient");
    };
    document.getElementById("pay-cash").addEventListener("input", update);
    document.getElementById("pay-cancel").addEventListener("click", ()=>Modal.close());
    document.getElementById("pay-ok").addEventListener("click", ()=>{
      const v = Number(document.getElementById("pay-cash").value) || 0;
      if (v < total){ toast(t("cash_less"), "warning"); return; }
      Modal.close();
      this.finalizePayment();
    });
    update();
  },
  async finalizePayment(){
    const { id, name, phone } = this.resolveCustomer();
    this.current_order.customer_id = id;
    this.current_order.customer_name = name;
    this.current_order.customer_phone = phone;
    this.current_order.payment_method = "Cash";
    this.current_order.user_id = App.user ? App.user.id : null;
    DB.saveOrder(this.current_order, "paid");
    DB.deductStock(this.current_order);
    DB.saveAll();
    const snapshot = {
      id:this.current_order.id, no:this.current_order.no,
      type:this.current_order.type || "Delivery",
      customer_id:id, customer_name:name, customer_phone:phone,
      items:this.current_order.items.map(i=>({
        name:i.name, qty:i.qty, unit:i.unit, line:i.line,
        options:i.options||[], note:i.note||"",
      })),
      subtotal:this.current_order.subtotal, discount:this.current_order.discount,
      tax:this.current_order.tax, delivery:this.current_order.delivery,
      total:this.current_order.total, payment_method:"Cash",
    };
    CloudSync.pushOrder(snapshot);
    const S = DB.settings;
    const auto = S.printer_auto === "1";
    if (auto){
      const res = await Printer.print(snapshot, S);
      if (!res || !res.ok){
        toast(t("print_failed_manual"), "warning", 4500);
        ReceiptDialog.show(snapshot);
      } else {
        toast(t("paid") + fmtMoney(snapshot.total), "success");
      }
    } else {
      toast(t("paid") + fmtMoney(snapshot.total), "success");
      ReceiptDialog.show(snapshot);
    }
    this.newOrder();
    if (isMobile()) this.closeCartSheet();
  },
};

/* ═══════════════════ RECEIPT DIALOG (editable + reprint) ═══════════════════ */
const ReceiptDialog = {
  _order: null,
  _edited: null,
  show(order){
    this._order  = order;
    this._edited = null;
    this._render();
  },
  _defaultText(){
    return buildReceiptText(this._order, DB.settings, "CUSTOMER COPY");
  },
  _render(){
    const S = DB.settings;
    const mode = (S.printer_mode || "browser").toLowerCase();
    const copies = Printer.copies(S);
    const text = (this._edited != null) ? this._edited : this._defaultText();
    Modal.open(`
      <div class="m-head"><h1>${escapeHtml(t("receipt"))}</h1></div>
      <div class="m-body">
        <div class="faint" style="font-size:11px; margin-bottom:6px;">
          ✎ ${escapeHtml(t("edit_receipt_hint"))}
        </div>
        <textarea id="rcpt-text" spellcheck="false"
          style="width:100%; height:min(60vh,420px); font-family:ui-monospace,monospace;
                 font-size:12px; line-height:1.35;"
          >${escapeHtml(text)}</textarea>
        <div class="faint" style="font-size:11px; margin-top:8px;">
          ${escapeHtml(t("mode"))}: <b>${escapeHtml(mode)}</b> ·
          ${escapeHtml(t("cut"))}: <b>${escapeHtml(S.printer_cut||"partial")}</b> ·
          ${escapeHtml(t("copies"))}: <b>${escapeHtml(String(copies))}</b> ·
          ${escapeHtml(t("cut_each"))}: <b>${S.printer_cut_between === "0" ? "off" : "on"}</b> ·
          ${escapeHtml(t("drawer"))}: <b>${S.printer_drawer==="1"?"on":"off"}</b> ·
          ${escapeHtml(t("listener"))}: <b>${S.printer_store_listener === "1" ? "on" : "off"}</b>
        </div>
      </div>
      <div class="m-foot">
        <button class="btn ghost" id="rcpt-reset">↺ ${escapeHtml(t("reset_receipt"))}</button>
        <button class="btn" id="rcpt-close">${escapeHtml(t("close"))}</button>
        <button class="btn success" id="rcpt-print">${escapeHtml(t("print_now"))}</button>
      </div>`);
    const ta = document.getElementById("rcpt-text");
    ta.addEventListener("input", ()=>{ this._edited = ta.value; });
    document.getElementById("rcpt-close").addEventListener("click", ()=>Modal.close());
    document.getElementById("rcpt-reset").addEventListener("click", ()=>{
      this._edited = null;
      ta.value = this._defaultText();
    });
    document.getElementById("rcpt-print").addEventListener("click", async ()=>{
      this._edited = ta.value;
      await this._printEdited(ta.value);
    });
  },
  async _printEdited(text){
    const S = DB.settings;
    const mode    = (S.printer_mode || "browser").toLowerCase();
    const copies  = Printer.copies(S);
    const order   = this._order || {};

    if (mode === "browser"){
      const blocks = [];
      for (let i = 0; i < copies; i++) blocks.push(text);
      await Printer.printTextViaIframe(blocks);
      toast(t("print_job_sent"), "success");
      return { ok:true };
    }

    const bodyBytes = (()=>{
      const p = new EscPos();
      p.init();
      p.bold(true); p.doubleStrike(true); p.align(0);
      for (const line of String(text).split("\n")) p.line(line);
      p.doubleStrike(false); p.bold(false);
      return p.bytes();
    })();

    const perCopy = [];
    for (let i = 0; i < copies; i++){
      const cut = buildEscPosCut(S, { drawer: i === 0 && S.printer_drawer === "1" });
      perCopy.push(concatBytes(bodyBytes, cut));
    }

    try{
      if (mode === "usb"){
        if (!USBPrinter.isConnected()){
          const ok = await USBPrinter.autoReconnect();
          if (!ok) throw new Error("USB printer not connected");
        }
        for (let i = 0; i < perCopy.length; i++){
          await USBPrinter.send(perCopy[i]);
          if (i < perCopy.length - 1) await sleep(1500);
        }
        toast(`🖨  Printed ${copies} ${copies===1?"copy":"copies"} (USB)`, "success");
        return { ok:true };
      }
      if (mode === "agent"){
        const url = (S.printer_agent_url || "").trim();
        if (!url) throw new Error("Set the Print Agent URL in Settings");
        const headers = { "Content-Type":"application/json" };
        if (S.printer_agent_token) headers["X-Auth-Token"] = S.printer_agent_token;
        const jobs = perCopy.map((b, i)=>({
          label: i === 0 ? "CUSTOMER COPY" : "RESTAURANT COPY",
          data: Array.from(b),
        }));
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), 15000);
        let r;
        try{
          r = await fetch(url.replace(/\/+$/,"") + "/print", {
            method:"POST", headers,
            body: JSON.stringify({
              printer: S.printer_name || "",
              order_no: order.no || "",
              cut: S.printer_cut || "partial",
              cut_each: true,
              drawer: S.printer_drawer === "1",
              jobs,
            }),
            signal: ctrl.signal,
          });
        } finally { clearTimeout(timer); }
        if (!r.ok) throw new Error("HTTP " + r.status);
        toast("🖨  Sent to agent", "success");
        return { ok:true };
      }
      if (mode === "cloud"){
        if (S.firebase_enabled !== "1") throw new Error("Firebase disabled in Settings");
        if (!CloudDB.ready)             throw new Error("Cloud not connected");
        const flat = [];
        for (const b of perCopy){ for (let i = 0; i < b.length; i++) flat.push(b[i]); }
        await CloudSync.queuePrintJob({
          printer_name: S.printer_name || "",
          order_no: order.no || "",
          cut: S.printer_cut || "partial",
          cut_each: true,
          drawer: S.printer_drawer === "1",
          copies, data: flat,
        });
        toast("☁  Print job queued — store printer will pick it up", "success");
        return { ok:true };
      }
      return { ok:false };
    }catch(e){
      toast("Print failed: " + (e.message || e), "error", 6000);
      return { ok:false, error: e.message };
    }
  },
};

const PricePrompt = {

    const upd = ()=>{
      const v = Math.max(0, Number(inp.value) || 0);
      prev.textContent = qty > 1
        ? `${qty} × ${fmtMoney(v, s.currency_symbol)}  =  ` + fmtMoneyDual(v * qty, s)
        : fmtMoneyDual(v, s);
    };
    inp.addEventListener("input", upd);
    document.getElementById("modal").querySelectorAll("[data-d]").forEach(b=>{

      const v = Math.max(0, Number(inp.value) || 0);
      Modal.close();
      if (opts.onApply) opts.onApply(v);
    });
    upd();
    try{ inp.focus(); inp.select(); }catch(e){}
  },
};

const OrderEditor = {
  _id:null, _row:null, _items:[], _onDone:null, _calc:null,

    Modal.open(this._shell());
    this._bind();
    this._recalc();
  },

  _shell(){
    const o = this._row;
    const num = String(o.order_no||"").split("-").pop();
    const when = (o.created_at||"").replace("T"," ").slice(0,16);
    const pay = o.payment_method || "Cash";
