      </div><div class="m-body">`;
      for (const grp of groups){
        const isSize    = grp.name === "Size";
        const isFlavor  = grp.name === "Flavor";
        const isExtras  = grp.name === EXTRAS_GROUP_NAME;
        const largeOnly = !!grp.large_only;
        const isLarge   = state.size === "Large";
        const show = isExtras || !largeOnly || isLarge;

        let hint;
        if (isExtras){
          hint = ` <span class="faint">(optional · tap to toggle)</span>`;
        } else if (isFlavor && largeOnly){
          hint = ` <span class="faint">(choose 1 or 2)</span>`;
        } else if (grp.multi && grp.max_choices){
          hint = ` <span class="faint">(up to ${grp.max_choices})</span>`;
        } else if (grp.multi){
          hint = " <span class='faint'>(multiple)</span>";
        } else {
          hint = "";
        }

        html += `<div class="opt-group" style="display:${show?"block":"none"};">
          <h3>${escapeHtml(grp.name)}${hint}</h3>
          <div class="opt-chips">`;
        for (const ch of grp.choices){
          let on = false;
          if (isSize) on = state.size === ch.label;
          else if (isFlavor) on = state.flavorSet.has(ch.label);
          else on = !!(state.groups[grp.name] && state.groups[grp.name][ch.label]);
          let priceStr = "";
          if (Number(ch.price)){
            const sign = ch.price > 0 ? "+" : "−";
            priceStr = `  ${sign}${fmtMoney(Math.abs(ch.price), sym)}`;
          }
          html += `<button class="opt-chip ${on?"on":""}" data-grp="${escapeHtml(grp.name)}" data-label="${escapeHtml(ch.label)}">${escapeHtml(ch.label)}${priceStr}</button>`;
        }
        html += `</div></div>`;
      }
      html += `<div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
        <span class="muted">Quantity</span>
        <input type="number" id="opt-qty" min="1" max="99" value="${state.qty}" style="width:90px;">
      </div>
      <div style="margin-top:10px;">
        <h3 style="margin-bottom:6px;">Note <span class="faint">(optional)</span></h3>
        <textarea id="opt-note" rows="2" maxlength="180" placeholder="E.g. extra napkins, no onions on top…" style="width:100%; font-family:inherit; font-size:13px;">${escapeHtml(state.note)}</textarea>
      </div>
      </div>
      <div class="m-foot">
        <button class="btn" id="opt-cancel">Cancel</button>
        <button class="btn primary" id="opt-add">Add to Order</button>
      </div>`;
      Modal._render(html);
      document.getElementById("opt-cancel-x").addEventListener("click", ()=>Modal.close());
      document.getElementById("opt-cancel").addEventListener("click", ()=>Modal.close());
      document.getElementById("opt-qty").addEventListener("input", e=>{
        state.qty = Math.max(1, Math.min(99, Number(e.target.value)||1));
      });
      document.getElementById("opt-note").addEventListener("input", e=>{ state.note = e.target.value; });
      document.getElementById("opt-add").addEventListener("click", ()=>finalize());
      document.getElementById("modal").querySelectorAll(".opt-chip").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const g = btn.dataset.grp, l = btn.dataset.label;
          if (g === "Size"){
            state.size = (state.size === l) ? null : l;
            if (state.size !== "Large") state.flavorSet.clear();
          } else if (g === "Flavor"){
            if (state.flavorSet.has(l)) state.flavorSet.delete(l);
            else {
              if (state.flavorSet.size >= 2) state.flavorSet.delete(state.flavorSet.values().next().value);
              state.flavorSet.add(l);
            }
          } else {
            const grp = groups.find(x=>x.name === g);
            state.groups[g] = state.groups[g] || {};
            if (grp && !grp.multi) state.groups[g] = { [l]: true };
            else state.groups[g][l] = !state.groups[g][l];
          }
          const active = document.activeElement;
          const wasNote = active && active.id === "opt-note";
          rebuild();
          if (wasNote){
            const el = document.getElementById("opt-note");
            if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          }
        });
      });
    };

    const finalize = ()=>{
      const chosen = [];
      const isLarge = state.size === "Large";
      for (const grp of groups){
        if (grp.large_only && !isLarge) continue;
        if (grp.name === "Size"){
          if (state.size){
            const ch = grp.choices.find(c=>c.label === state.size);
            chosen.push({ group:grp.name, label:state.size, price: ch?ch.price:0 });
          }
        } else if (grp.name === "Flavor"){
          for (const l of state.flavorSet){
            const ch = grp.choices.find(c=>c.label === l);
            chosen.push({ group:grp.name, label:l, price: ch?ch.price:0 });
          }
        } else {
          const sel = state.groups[grp.name] || {};
          for (const l of Object.keys(sel)){
            if (sel[l]){
              const ch = grp.choices.find(c=>c.label === l);
              chosen.push({ group:grp.name, label:l, price: ch?ch.price:0 });
            }
          }
        }
      }
      if (isLarge){
        const flavors = chosen.filter(c=>c.group === "Flavor");
        if (flavors.length < 1){
          toast("Please choose at least 1 flavor for a Large pizza.", "warning");
          return;
        }
      }
      const unit = computeUnitPrice(p, chosen);
      const note = (state.note||"").trim();
      Modal.close();
      this.addItemToCart(p, state.qty, chosen, unit, note);
    };

    Modal.open("");
    rebuild();
  },

  renderCart(){
    const wrap = document.getElementById("cart-list");
    if (!wrap || !this.current_order) return;
    const items = this.current_order.items;
    if (!items.length){
      wrap.innerHTML = `<div class="cart-empty">Cart is empty<br>Click a product to add it</div>`;
      return;
    }
    const s = DB.settings;
    wrap.innerHTML = items.map(it=>{
      const opts = (it.options||[]).map(o=>o.label).join(", ");
      const note = (it.note||"").trim();
      return `<div class="cart-line" data-key="${escapeHtml(it.key)}">
        <div class="info">
          <div class="nm">${escapeHtml(it.emoji||"")} ${escapeHtml(it.name)}</div>
          ${opts?`<div class="opts">${escapeHtml(opts)}</div>`:""}
          ${note?`<div class="note">📝 ${escapeHtml(note)}</div>`:""}
          <div class="unit">${fmtMoney(it.unit, s.currency_symbol)}  (${fmtMoneySecondary(it.unit, s)})</div>
        </div>
        <div class="qty-ctrl">
          <button data-act="dec">−</button>
          <div class="q">${it.qty}</div>
          <button data-act="inc">+</button>
        </div>
        <div class="total">${fmtMoney(it.line, s.currency_symbol)}
          <div class="usd">${fmtMoneySecondary(it.line, s)}</div></div>
        <button class="btn icon" data-act="del">✕</button>
      </div>`;
    }).join("");
    wrap.querySelectorAll(".cart-line").forEach(line=>{
      const key = line.dataset.key;
      line.querySelectorAll("button").forEach(b=>{
        b.addEventListener("click", ()=>{
          const act = b.dataset.act;
          if (act === "inc") this.changeQty(key, +1);
          else if (act === "dec") this.changeQty(key, -1);
          else if (act === "del") this.removeItem(key);
        });
      });
    });
  },
  changeQty(key, delta){
    for (const it of this.current_order.items){
      if (it.key === key){
        it.qty = Math.max(1, it.qty + delta);
        it.line = it.unit * it.qty;
        break;
      }
    }
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  removeItem(key){
    this.current_order.items = this.current_order.items.filter(i=>i.key !== key);
    this.renderCart(); this.recalc(); this.updateCartFab();
  },

  recalc(){
    if (!this.current_order) return;
    const s = DB.settings;
    const subtotal = this.current_order.items.reduce((a,i)=>a + (Number(i.line)||0), 0);
    let disc = Number((document.getElementById("disc-in")||{}).value) || 0;
    disc = Math.max(0, disc);
    const base = Math.max(0, subtotal - disc);
    const tax = 0;
    const delivery = Number(DB.settings.delivery_fee) || 0;
    const grand = base + tax + delivery;
    Object.assign(this.current_order, { subtotal, discount:disc, tax, delivery, total:grand });
    const sub = document.getElementById("sum-sub");
    const del = document.getElementById("sum-del");
    const gr  = document.getElementById("sum-grand");
    if (sub) sub.textContent   = fmtMoneyDual(subtotal, s);
    if (del) del.textContent   = fmtMoneyDual(delivery, s);
    if (gr)  gr.textContent    = fmtMoneyDual(grand, s);
    this.updateCartFab();
  },

  renderTabs(){
    const bar = document.getElementById("pos-tabs");
    if (!bar) return;
    const orders = DB.openOrders();
    const curId = this.current_order && this.current_order.id;
    let html = `<button class="btn chip" data-id="new">+ New</button>`;
    for (const o of orders){
      const num = String(o.order_no||"").split("-").pop();
      html += `<button class="btn chip ${o.id === curId ? "active" : ""}" data-id="${o.id}">#${escapeHtml(num)}</button>`;
    }
    bar.innerHTML = html;
    bar.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        if (b.dataset.id === "new") this.newOrder();
        else {
          const o = orders.find(x=>x.id === Number(b.dataset.id));
          if (o) this.loadOrder(o);
        }
      });
    });
  },
  loadOrder(o){
    this.current_order = {
      id:o.id, no:o.order_no, type:o.order_type || "Delivery",
      items: o.items.map(i=>({
        key:String(i.id), product_id:i.product_id, name:i.name, emoji:"",
        qty:i.qty, unit:i.unit_price,
        options: String(i.options||"").split(",").map(t=>({label:t.trim()})).filter(x=>x.label),
        note: i.note||"", line:i.line_total,
      })),
      customer_id:o.customer_id, customer_name:o.customer_name || "",
      customer_phone:o.customer_phone || "",
      discount:Number(o.discount)||0, delivery:Number(o.delivery)||0,
    };
    document.getElementById("pos-order-lbl").textContent = "Order " + o.order_no;
    this.setCustomer(o.customer_id, o.customer_name || "");
    document.getElementById("disc-in").value = String(this.current_order.discount|0);
    this.renderCart(); this.recalc(); this.renderTabs(); this.updateCartFab();
    if (isMobile()) this.openCartSheet();
  },
  newOrder(){
    this.current_order = {
      id:null, no: DB.nextOrderNo(), type:"Delivery",
      items:[], customer_id:null, customer_name:"", customer_phone:"",
      discount:0, delivery:0, subtotal:0, tax:0, total:0,
    };
    document.getElementById("pos-order-lbl").textContent = "Order " + this.current_order.no + "  (new)";
    this.setCustomer(null, "");
    document.getElementById("disc-in").value = "0";
    this.renderCart(); this.recalc(); this.renderTabs(); this.updateCartFab();
  },
  clearOrder(){
    if (!this.current_order) return;
    if (this.current_order.items.length && !confirm("Clear this order?")) return;
    this.current_order.items = [];
    document.getElementById("disc-in").value = "0";
    this.renderCart(); this.recalc(); this.updateCartFab();
  },
  holdOrder(){
    if (!this.current_order || !this.current_order.items.length){
      toast("Nothing to hold", "warning"); return;
    }
    const { id, name, phone } = this.resolveCustomer();
    this.current_order.customer_id = id;
    this.current_order.customer_name = name;
    this.current_order.customer_phone = phone;
    DB.saveOrder(this.current_order, "open");
    DB.saveAll();
    toast(`Order ${this.current_order.no} held — visible on all devices`, "success");
    this.renderTabs();
    this.newOrder();
    if (isMobile()) this.closeCartSheet();
  },

  payOrder(){
    if (!this.current_order || !this.current_order.items.length){
      toast("Cart is empty", "warning"); return;
    }
    const total = this.current_order.total;
    const s = DB.settings;
    Modal.open(`<div class="m-head"><h1>Take Payment</h1></div>
      <div class="m-body">
        <div style="font-size:14px; font-weight:700; margin-bottom:12px;">
          Total: ${fmtMoneyDual(total, s)}</div>
        <div class="muted" style="font-size:12px; margin-bottom:6px;">Payment method: Cash</div>
        <h3>Amount tendered (cash, LBP)</h3>
        <input type="number" id="pay-cash" value="${Math.round(total)}" style="margin-top:6px;">
        <div id="pay-change" class="muted" style="margin-top:8px;">Change: —</div>
      </div>
      <div class="m-foot">
        <button class="btn" id="pay-cancel">Cancel</button>
        <button class="btn success" id="pay-ok">Confirm Payment</button>
      </div>`);
    const update = ()=>{
      const v = Number(document.getElementById("pay-cash").value) || 0;
      const ch = v - total;
      const el = document.getElementById("pay-change");
      if (ch >= 0) el.textContent = "Change: " + fmtMoneyDual(ch, s);
      else el.textContent = "Insufficient cash";
    };
    document.getElementById("pay-cash").addEventListener("input", update);
    document.getElementById("pay-cancel").addEventListener("click", ()=>Modal.close());
    document.getElementById("pay-ok").addEventListener("click", ()=>{
      const v = Number(document.getElementById("pay-cash").value) || 0;
      if (v < total){ toast("Cash tendered is less than total", "warning"); return; }
      Modal.close();
      this.finalizePayment();
    });
    update();
  },

  async finalizePayment(){
    const { id, name, phone } = this.resolveCustomer();
    this.current_order.customer_id = id;
    this.current_order.customer_name = name;
    this.current_order.customer_phone = phone;
    this.current_order.payment_method = "Cash";
    this.current_order.user_id = App.user ? App.user.id : null;

    DB.saveOrder(this.current_order, "paid");
    DB.deductStock(this.current_order);
    DB.saveAll();

    const snapshot = {
      id:this.current_order.id, no:this.current_order.no,
      type:this.current_order.type || "Delivery",
      customer_id:id, customer_name:name, customer_phone:phone,
      items:this.current_order.items.map(i=>({
        name:i.name, qty:i.qty, unit:i.unit, line:i.line,
        options:i.options||[], note:i.note||"",
      })),
      subtotal:this.current_order.subtotal, discount:this.current_order.discount,
      tax:this.current_order.tax, delivery:this.current_order.delivery,
      total:this.current_order.total, payment_method:"Cash",
    };

    /* Optional reporting push (unchanged remote-connection feature) */
    CloudSync.pushOrder(snapshot);

    const S = DB.settings;
    const auto = S.printer_auto === "1";
    if (auto){
      const res = await Printer.print(snapshot, S);
      if (!res || !res.ok){
        toast("Print failed — opening receipt for manual retry.", "warning", 4500);
        ReceiptDialog.show(snapshot);
      } else {
        toast(`Paid ${fmtMoney(snapshot.total)}`, "success");
      }
    } else {
      toast(`Paid ${fmtMoney(snapshot.total)}`, "success");
      ReceiptDialog.show(snapshot);
    }

    this.newOrder();
    if (isMobile()) this.closeCartSheet();
  },
};

const ReceiptDialog = {

    const S = DB.settings;
    const mode = (S.printer_mode || "browser").toLowerCase();
    Modal.open(`<div class="m-head"><h1>🧾  Receipt</h1></div>
      <div class="m-body">
        <textarea id="rcpt-text" readonly
          style="width:100%; height:min(60vh,400px); font-family:ui-monospace,monospace; font-size:12px;"
          >${escapeHtml(text)}</textarea>
        <div class="faint" style="font-size:11px; margin-top:8px;">
          Mode: <b>${escapeHtml(mode)}</b> · Cut: <b>${escapeHtml(S.printer_cut||"partial")}</b> ·
          Copies: <b>${escapeHtml(String(S.printer_copies||"2"))}</b> ·
          Drawer: <b>${S.printer_drawer==="1"?"on":"off"}</b>
        </div>
      </div>
      <div class="m-foot">
        <button class="btn" id="rcpt-close">Close</button>
        <button class="btn success" id="rcpt-print">🖨  Print now</button>

};

const ProductsPage = {
  search:"", initialized:false,
  init(){
    if (this.initialized) return;
    this.initialized = true;
    const el = document.getElementById("page-products");
    el.innerHTML = `
      <div class="page-head">
        <h1>Products</h1>
        <button class="btn" id="add-cat">+ Category</button>
        <button class="btn primary" id="add-product">+ New Product</button>
      </div>
      <input type="text" id="prod-search" placeholder="🔍  Search…" style="margin-bottom:12px;">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:55px;">Emoji</th><th>Name</th><th>Category</th>
            <th>Price</th><th>Cost</th><th>Stock</th><th>Options</th>
            <th style="width:140px;">Actions</th>
          </tr></thead>
          <tbody id="prod-tbody"></tbody>
        </table>
      </div>`;
    document.getElementById("prod-search").addEventListener("input", e=>{
      this.search = e.target.value; this.render();
    });
    document.getElementById("add-product").addEventListener("click", ()=>this.edit(null));
    document.getElementById("add-cat").addEventListener("click", ()=>{
      const name = prompt("Category name:");
      if (name && name.trim()){
        DB.saveCategory({ name: name.trim(), sort_order:99 });
        toast(`Category '${name}' added`, "success");
        POSPage.refreshCategories();
      }
    });
    this.render();
  },
  render(){
    /* productsList() returns pizza products first */
    const rows = DB.productsList({ search:this.search, only_active:false });
    const sym = DB.settings.currency_symbol;
    const tb = document.getElementById("prod-tbody");
    if (!tb) return;
    tb.innerHTML = rows.map(p=>{
      const cat = p.category_id ? DB.categories.find(c=>c.id === p.category_id) : null;
      const stock = p.track_stock ? String(p.stock|0) : "—";
      const hasCo = !!(p.custom_options||"").trim();
      const opts = hasCo ? "Custom" : (p.has_options ? "Yes" : "No");
      return `<tr data-id="${p.id}">
        <td>${escapeHtml(p.emoji||"")}</td>
        <td>${escapeHtml(p.name)}</td>
        <td>${escapeHtml(cat ? cat.name : "—")}</td>
        <td>${fmtMoney(p.price, sym)}</td>
        <td>${fmtMoney(p.cost, sym)}</td>
        <td>${stock}</td>
        <td>${opts}</td>
        <td>
          <button class="btn icon" data-act="edit">Edit</button>
          <button class="btn icon" data-act="del" style="color:var(--danger);">Delete</button>
        </td></tr>`;
    }).join("");
    tb.querySelectorAll("tr").forEach(tr=>{
      const p = DB.getProduct(Number(tr.dataset.id));
      tr.querySelectorAll("button").forEach(b=>{
        b.addEventListener("click", ()=>{
          if (b.dataset.act === "edit") this.edit(p);
          else if (confirm(`Delete product '${p.name}'?`)){
            DB.deleteProduct(p.id);
            DB.saveAll();
            this.render(); POSPage.renderProducts();
          }
        });
      });
    });
  },
  edit(p){
    const isNew = !p;
    p = p || { name:"", emoji:"🍕", category_id:null, price:0, cost:0, stock:0,
               track_stock:0, low_stock:5, has_options:0, active:1, custom_options:"" };
    const cats = DB.categoriesSorted();
    Modal.open(`<div class="m-head"><h2>${isNew?"New":"Edit"} Product</h2></div>
      <div class="m-body">
        <div class="form-row"><label>Name</label><input id="p-name" value="${escapeHtml(p.name)}"></div>
        <div class="form-row"><label>Emoji</label><input id="p-emoji" value="${escapeHtml(p.emoji||"🍕")}"></div>
        <div class="form-row"><label>Category</label>
          <select id="p-cat"><option value="">— none —</option>
            ${cats.map(c=>`<option value="${c.id}" ${p.category_id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
          </select></div>
        <div class="form-row"><label>Price</label><input id="p-price" type="number" value="${p.price|0}" step="1000"></div>
        <div class="form-row"><label>Cost</label><input id="p-cost" type="number" value="${p.cost|0}" step="1000"></div>
        <div class="form-row"><label>Stock</label><input id="p-stock" type="number" value="${p.stock|0}"></div>
        <div class="form-row"><label>Low stock</label><input id="p-low" type="number" value="${p.low_stock|0}"></div>
        <div class="form-row checkbox"><label><input type="checkbox" id="p-track" ${p.track_stock?"checked":""}> Track stock</label></div>
        <div class="form-row checkbox"><label><input type="checkbox" id="p-opts" ${p.has_options?"checked":""}> Has options</label></div>
        <div class="form-row checkbox"><label><input type="checkbox" id="p-active" ${p.active?"checked":""}> Active</label></div>
        <h3 style="margin-top:10px;">Custom options (JSON)</h3>
        <textarea id="p-custom" rows="6">${escapeHtml(p.custom_options||"")}</textarea>
      </div>
      <div class="m-foot">
        <button class="btn" id="p-cancel">Cancel</button>
        <button class="btn primary" id="p-save">Save</button>
      </div>`);
    document.getElementById("p-cancel").addEventListener("click", ()=>Modal.close());
    document.getElementById("p-save").addEventListener("click", ()=>{
      const name = document.getElementById("p-name").value.trim();
      if (!name){ toast("Name is required", "warning"); return; }
      const custom = document.getElementById("p-custom").value.trim();
      if (custom){
        try{
          const parsed = JSON.parse(custom);
          if (!Array.isArray(parsed)) throw new Error("must be array");
        }catch(e){ toast("Custom options JSON invalid: " + e.message, "error"); return; }
      }
      const data = {
        name, emoji: document.getElementById("p-emoji").value.trim()||"🍕",
        category_id: Number(document.getElementById("p-cat").value)||null,
        price: Number(document.getElementById("p-price").value)||0,
        cost: Number(document.getElementById("p-cost").value)||0,
        stock: Number(document.getElementById("p-stock").value)||0,
        low_stock: Number(document.getElementById("p-low").value)||5,
        track_stock: document.getElementById("p-track").checked ? 1 : 0,
        has_options: document.getElementById("p-opts").checked ? 1 : 0,
        active: document.getElementById("p-active").checked ? 1 : 0,
        custom_options: custom,
      };
      DB.saveProduct(data, p.id);
      DB.saveAll();
      Modal.close(); this.render(); POSPage.renderProducts();
      toast("Saved — synced to all devices", "success");
    });
  },
};

        document.getElementById("rep-to").value = this.to;
        this.render();
      });
    });
    document.getElementById("rep-print-cc").addEventListener("click", async ()=>{
      const text = buildCloseCashText(this.from, this.to, DB.settings);
      await Printer.printText(text, DB.settings);
    });
    document.getElementById("rep-sync-cc").addEventListener("click", async ()=>{
      if (DB.settings.firebase_enabled !== "1"){ toast("Enable Cloud Sync in Settings first", "warning"); return; }

      else toast("Firebase sync failed: " + res.info, "error", 5000);

    const s = this.from, e = this.to;
    const settings = DB.settings;
    const sym = settings.currency_symbol;
    const summ = DB.summary(s, e);
    const profit = summ.revenue - summ.expenses;
    const cards = document.getElementById("rep-cards");

      <div class="card metric-card"><div class="lbl">Net Profit</div><div class="val">${fmtMoney(profit, sym)}</div></div>`;
    const tTop = document.getElementById("rep-top");
    if (tTop) tTop.innerHTML = DB.topProducts(s,e).map(r=>
      `<tr><td>${escapeHtml(r.name)}</td><td>${r.qty|0}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");
    const tCat = document.getElementById("rep-cat");
    if (tCat) tCat.innerHTML = DB.salesByCategory(s,e).map(r=>
      `<tr><td>${escapeHtml(r.category)}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");
    const tPm = document.getElementById("rep-pm");
    if (tPm) tPm.innerHTML = DB.salesByMethod(s,e).map(r=>
      `<tr><td>${escapeHtml(r.method)}</td><td>${r.c}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");
    const tDays = document.getElementById("rep-days");
    if (tDays) tDays.innerHTML = DB.salesByDay(s,e).map(r=>
      `<tr><td>${escapeHtml(r.day)}</td><td>${r.orders}</td><td>${fmtMoney(r.revenue, sym)}</td></tr>`).join("");
    const cash = DB.cashSummary(s,e);
    const info = document.getElementById("rep-cc-info");
    if (info) info.innerHTML =
      `<b>Cash orders:</b> ${cash.cash_orders} • <b>Cash sales:</b> ${fmtMoney(cash.cash_sales, sym)} ` +
      `<span class="faint">(${fmtMoneySecondary(cash.cash_sales, settings)})</span> • ` +
      `<b>Expenses:</b> ${fmtMoney(cash.expenses, sym)} <span class="faint">(${fmtMoneySecondary(cash.expenses, settings)})</span><br>` +
      `<b>Expected in drawer:</b> ${fmtMoney(cash.expected, sym)} ` +
      `<span class="faint">(${fmtMoneySecondary(cash.expected, settings)})</span>`;
  },
};

        S.printer_mode = currentMode;
        DB.save("settings");
        Persist.putObject("settings", S);
        paintSeg();
        refreshDiag();
      });
    });

      const pill = document.getElementById("printer-pill");
      const txt  = document.getElementById("printer-pill-txt");
      if (!pill || !txt) return;
      pill.classList.remove("ok","bad","warn");
      if (currentMode === "usb"){
        if (!USBPrinter.isSupported()){ pill.classList.add("bad"); txt.textContent = "USB n/a"; }
        else if (USBPrinter.isConnected()){ pill.classList.add("ok"); txt.textContent = "USB ready"; }

      const secure = isSecureContext_();
      const usbSup = USBPrinter.isSupported();

      const fbOn   = S.firebase_enabled === "1";
      const lines = [
        `Mode: ${currentMode}`,
        `Secure context: ${secure ? '<span class="ok">yes</span>' : '<span class="bad">no</span> (needed for WebUSB & crypto & PWA install)'}`,
        `crypto.subtle: ${(crypto && crypto.subtle) ? '<span class="ok">available</span>' : '<span class="warn">fallback used</span>'}`,
        `WebUSB supported: ${usbSup ? '<span class="ok">yes</span>' : '<span class="bad">no</span>'}`,
        `USB connected: ${usbCon ? '<span class="ok">yes</span>' : '<span class="warn">no</span>'}`,
        `Agent URL: ${S.printer_agent_url ? escapeHtml(S.printer_agent_url) : '<span class="warn">not set</span>'}`,

        `Print jobs collection: ${escapeHtml(S.firebase_collection_print_jobs || "print_jobs")}`,

      ];
      el_.innerHTML = lines.join("\n");
    };

    const refreshSyncDiag = ()=>{
      const el_ = $("s-diag-sync");
      if (!el_) return;

/* ═══════════════════ FIREBASE REST (reporting / cloud print) ═══════════════════ */
function _firestoreValue(v){
  if (v === null || v === undefined) return { nullValue:null };
  if (typeof v === "boolean") return { booleanValue: v };
  if (typeof v === "number"){
    if (Number.isInteger(v)) return { integerValue: String(v) };
    return { doubleValue: v };
  }
  if (typeof v === "string") return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(_firestoreValue) } };
  if (typeof v === "object"){
    const fields = {};
    for (const k of Object.keys(v)) fields[k] = _firestoreValue(v[k]);
    return { mapValue: { fields } };
  }
  return { stringValue: String(v) };
}
function _firestoreDoc(obj){
  const fields = {};
  for (const k of Object.keys(obj)) fields[k] = _firestoreValue(obj[k]);
  return { fields };
}

const FirebaseSync = {
  _idToken: null,
  _authError: null,

  async _token(){
    /* Prefer the token already held by the shared-database session */
    const t = await CloudDB.token();
    if (t) return t;
    if (this._idToken) return this._idToken;
    return await this._signInAnonymous();
  },

  async _signInAnonymous(){
    const url = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`;
    try{
      const r = await fetch(url, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ returnSecureToken:true }),
      });
      const data = await r.json();
      if (data && data.idToken){
        this._idToken = data.idToken;
        this._authError = null;
        return this._idToken;
      }
      this._idToken = null;
      this._authError = data && data.error ? (data.error.message || "auth failed") : "no token";
    }catch(e){
      this._idToken = null;
      this._authError = String(e);
    }
    return null;
  },

  async pushDocument(collection, data){
    const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/${collection}?key=${FIREBASE_CONFIG.apiKey}`;
    const token = await this._token();
    const headers = { "Content-Type":"application/json" };
    if (token) headers["Authorization"] = `Bearer ${token}`;
    try{
      const r = await fetch(url, {
        method:"POST", headers, body: JSON.stringify(_firestoreDoc(data)),
      });
      if (r.ok){
        const j = await r.json().catch(()=> ({}));
        const name = j && j.name ? j.name.split("/").pop() : "";
        return { ok:true, info:"HTTP " + r.status, id:name };
      }
      const detail = await r.text();
      let hint = "";
      if (r.status === 403){
        hint = token
          ? " (rules denied write — check Firestore rules)"
          : " (anonymous auth disabled — enable it in Firebase Console)";
      }
      return { ok:false, info:`HTTP ${r.status}${hint}: ${detail.slice(0,220)}` };
    }catch(e){
      return { ok:false, info: String(e) };
    }
  },
};

const CloudSync = {
  _warned: false,
  enabled(){ return DB.settings.firebase_enabled === "1"; },
  _col(key, def){ return (DB.settings[key] || def || "").trim() || def; },

  async pushOrder(o){
    if (!this.enabled()) return { ok:false, info:"disabled" };
    const doc = {
      order_no: o.no, order_type: o.type, customer: o.customer_name||"",
      customer_id: o.customer_id||null, customer_phone: o.customer_phone||"",
      subtotal: +o.subtotal||0, discount: +o.discount||0,
      delivery: +o.delivery||0, total: +o.total||0,
      currency: (DB.settings.currency_symbol||"LBP ").trim(),
      payment: o.payment_method||"Cash",
      created_at: nowIso(),
      items: (o.items||[]).map(i=>({
        name:i.name||"", qty:+i.qty||1, unit:+i.unit||0, line:+i.line||0,
        options:(i.options||[]).map(x=>x.label||""), note:i.note||"",
      })),
    };
    const res = await FirebaseSync.pushDocument(this._col("firebase_collection_orders","orders"), doc);
    if (!res.ok && this.enabled() && !this._warned){
      this._warned = true;
      console.warn("Cloud sync failed:", res.info);
    }
    return res;
  },

  async pushCustomer(c){
    if (!this.enabled()) return { ok:false, info:"disabled" };
    return await FirebaseSync.pushDocument(
      this._col("firebase_collection_customers","customers"),
      { name:c.name||"", phone:c.phone||"", address:c.address||"", created_at: nowIso() });
  },

  async pushCloseCash(start, end){
    if (!this.enabled()) return { ok:false, info:"disabled" };
    const cash = DB.cashSummary(start, end);
    return await FirebaseSync.pushDocument(
      this._col("firebase_collection_cash","close_cash"),
      { from:start, to:end, cash_orders:cash.cash_orders, cash_sales:cash.cash_sales,
        expenses:cash.expenses, expected:cash.expected,
        currency:(DB.settings.currency_symbol||"LBP ").trim(), created_at: nowIso() });
  },

  async queuePrintJob(job){
    if (!this.enabled()) throw new Error("Firebase disabled");
    const col = this._col("firebase_collection_print_jobs", "print_jobs");
    const doc = {
      printer_name: job.printer_name || "",
      order_no: job.order_no || "",
      cut: job.cut || "partial",
      drawer: job.drawer === true,
      copies: job.copies || 1,
      data: job.data || [],
      status: "pending",
      source: "pizza_pos_web",
      created_at: nowIso(),
    };
    const res = await FirebaseSync.pushDocument(col, doc);
    if (!res.ok) throw new Error(res.info);
    return res;
  },
};

/* ═══════════════════ PWA INSTALLER ═══════════════════
   Everything needed so a remote phone (Android or iOS) can
   "Install / Add to Home Screen" and then run Pizza POS
   full-screen, with an offline-cached shell.                        */
const PWA = {
  deferredPrompt: null,
  _swRegistered: false,

  isIOS(){
    const ua = navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  },
  isAndroid(){ return /Android/i.test(navigator.userAgent || ""); },
  isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.matchMedia("(display-mode: fullscreen)").matches ||
           window.matchMedia("(display-mode: minimal-ui)").matches ||
           window.navigator.standalone === true;
  },

  /* ── generated app icons (emoji on brand background) ── */
  makeIcon(size, maskable){
    const c = document.createElement("canvas");
    c.width = size; c.height = size;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0f172a";
    if (!maskable && ctx.roundRect){
      const r = size * 0.18;
      ctx.beginPath(); ctx.roundRect(0, 0, size, size, r); ctx.fill();
    } else {
      ctx.fillRect(0, 0, size, size);
    }
    const pad = maskable ? size * 0.22 : 0;
    const glyph = size - pad * 2;
    ctx.font = `${Math.round(glyph * 0.86)}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    try { ctx.fillText("🍕", size/2, size/2 + glyph * 0.05); } catch(e){}
    return c.toDataURL("image/png");
  },

  /* ── build & attach the web app manifest ──
     IMPORTANT: every URL inside the manifest is ABSOLUTE, because
     the manifest itself is served from a blob: URL. Relative paths
     would resolve against the blob and break on remote devices.     */
  attachManifest(){
    let icon192 = "", icon512 = "", icon512m = "";
    try{
      icon192  = this.makeIcon(192, false);
      icon512  = this.makeIcon(512, false);
      icon512m = this.makeIcon(512, true);
    }catch(e){ console.warn("icon generation failed", e); }

    const dir  = new URL(".", location.href).href;              // folder of this page
    const self_ = location.origin + location.pathname + location.search;

    const manifest = {
      id: dir,
      name: "Pizza POS — Restaurant Management Suite",
      short_name: "PizzaPOS",
      description: "Pizza POS — Restaurant Management Suite. Sell, print and track from any phone.",
      lang: "en",
      dir: "ltr",
      start_url: self_,
      scope: dir,
      display: "standalone",
      display_override: ["standalone", "minimal-ui"],
      orientation: "any",
      background_color: "#f4f6f9",
      theme_color: "#0f172a",
      categories: ["business", "productivity", "food"],
      prefer_related_applications: false,
      icons: [
        { src: icon192,  sizes: "192x192", type: "image/png", purpose: "any" },
        { src: icon512,  sizes: "512x512", type: "image/png", purpose: "any" },
        { src: icon512m, sizes: "512x512", type: "image/png", purpose: "maskable" },
      ],
    };

    let href = "";
    try{
      href = URL.createObjectURL(new Blob(
        [JSON.stringify(manifest)],
        { type: "application/manifest+json" }
      ));
    }catch(e){}

    if (href){
      let link = document.querySelector('link[rel="manifest"]');
      if (!link){
        link = document.createElement("link");
        link.rel = "manifest";
        document.head.appendChild(link);
      }
      link.href = href;
    }

    /* iOS ignores the manifest for icons — it needs apple-touch-icon */
    try{
      let ati = document.querySelector('link[rel="apple-touch-icon"]');
      if (!ati){
        ati = document.createElement("link");
        ati.rel = "apple-touch-icon";
        document.head.appendChild(ati);
      }
      ati.setAttribute("sizes", "180x180");
      ati.href = icon192 || icon512;
    }catch(e){}
  },

  /* ── register an (optional) service worker ──
     If a companion `sw.js` is deployed next to this page it will be
     used for offline caching. If it isn't there we quietly skip it —
     nothing else depends on it. */
  async registerServiceWorker(){
    if (this._swRegistered) return;
    if (!("serviceWorker" in navigator)) return;
    if (!isSecureContext_()) return;
    try{
      const probe = await fetch("sw.js", { method:"HEAD" }).catch(()=> null);
      if (!probe || !probe.ok) return;
      await navigator.serviceWorker.register("sw.js", { scope: "./" });
      this._swRegistered = true;
      console.info("[PWA] service worker registered — offline mode available");
    }catch(e){
      console.info("[PWA] service worker skipped:", e && e.message);
    }
  },

  /* ── the install button in the top bar ── */
  bindInstallButton(){
    const btn = document.getElementById("install-btn");
    if (!btn || btn._bound) return;
    btn._bound = true;
    btn.addEventListener("click", ()=>this.requestInstall());
    this.refreshButton();
  },

  refreshButton(){
    const btn = document.getElementById("install-btn");
    if (!btn) return;
    if (this.isStandalone()){ btn.classList.remove("show"); btn.title = "Already installed"; return; }
    btn.classList.add("show");
    btn.title = this.deferredPrompt ? "Install Pizza POS" : "How to install Pizza POS";
  },

  async requestInstall(){
    if (this.isStandalone()){
      toast("Pizza POS is already installed on this device.", "success");
      return;
    }
    if (this.deferredPrompt){
      const prompt = this.deferredPrompt;
      this.deferredPrompt = null;
      try{
        prompt.prompt();
        const choice = await prompt.userChoice;
        if (choice && choice.outcome === "accepted"){
          toast("Installing Pizza POS…", "success");
        } else {
          toast("Install dismissed — you can try again any time.", "info");
        }
      }catch(e){}
      this.refreshButton();
      return;
    }
    this.showInstallHelp();
  },

  /* ── step-by-step help for phones that don't fire beforeinstallprompt ── */
  showInstallHelp(){
    const secure = isSecureContext_();
    let steps;
    if (this.isIOS()){
      steps = [
        "Open this page in <b>Safari</b> (Chrome / Firefox on iPhone cannot install web apps).",
        "Tap the <b>Share</b> icon <b>⎋</b> in the bottom toolbar.",
        "Scroll the sheet and tap <b>Add to Home Screen</b>.",
        "Name it <b>Pizza POS</b> and tap <b>Add</b>."
      ];
    } else if (this.isAndroid()){
      steps = [
        "Open the browser menu <b>⋮</b> (top-right of Chrome).",
        "Tap <b>Install app</b> — or <b>Add to Home screen</b> if you don't see it.",
        "Confirm with <b>Install</b>.",
        "Pizza POS opens full-screen from your home screen."
      ];
    } else {
      steps = [
        "Look for the <b>install</b> icon <b>⊕</b> in your browser's address bar.",
        "Or open the browser menu and choose <b>Install Pizza POS</b>.",
        "Confirm the prompt.",
        "The app then runs in its own window, with its own icon."
      ];
    }

    Modal.open(`<div class="m-head"><h1>📲  Install Pizza POS</h1></div>
      <div class="m-body">
        <div class="muted" style="font-size:12px; margin-bottom:10px;">
          Installing puts Pizza POS on your home screen and lets it open full-screen,
          without the browser bars — and it keeps working when the network drops.
        </div>
        <ol class="install-steps">${steps.map(s=>`<li>${s}</li>`).join("")}</ol>
        ${ secure ? "" : `
          <div class="install-warn">
            ⚠ <b>This page is not served over HTTPS.</b> Phones only allow app installation
            from a secure origin. Host the file on any HTTPS address (Netlify, Vercel,
            GitHub Pages, Firebase Hosting…) and open that link on the phone.
          </div>` }
      </div>
      <div class="m-foot">
        <button class="btn primary" id="pwa-help-close">Got it</button>
      </div>`);
    document.getElementById("pwa-help-close").addEventListener("click", ()=>Modal.close());
  },

  /* ── wire everything up ── */
  setup(){
    this.attachManifest();
    this.bindInstallButton();

    window.addEventListener("beforeinstallprompt", (e)=>{
      e.preventDefault();
      this.deferredPrompt = e;
      this.refreshButton();
    });

    window.addEventListener("appinstalled", ()=>{
      this.deferredPrompt = null;
      this.refreshButton();
      toast("Pizza POS installed 🍕", "success");
    });

    /* React to the user entering / leaving standalone mode */
    const mq = window.matchMedia("(display-mode: standalone)");
    const onChange = ()=>this.refreshButton();
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);

    this.registerServiceWorker();
  },
};

/* ═══════════════════ APP ═══════════════════ */
const App = {
  user: null,
  page: "pos",
  _pagesInited: false,
  _syncTimer: null,

  async init(){
    PWA.setup();

    const status = document.getElementById("login-cloud");
    await DB.load(msg => { if (status) status.textContent = msg ? "☁ " + msg : ""; });

    this.applyTheme(DB.settings.theme || "light");
    this.bindLogin();
    this.bindMisc();
    SyncStatus.render();

    if (status){
      if (CloudDB.ready){
        status.innerHTML = "☁ Shared database connected — data syncs across all devices.";
      } else if (DB.settings.firebase_enabled === "1"){
        status.innerHTML = "⚠ Shared database unavailable — running on this device's local copy.<br>" +
          "<span class='faint'>" + escapeHtml(CloudDB.error || "") + "</span>";
      } else {
        status.textContent = "Local-only mode (cloud database disabled in Settings).";
      }
    }
  },

  bindLogin(){
    const btn = document.getElementById("login-btn");
    const onEnter = e => { if (e.key === "Enter") btn.click(); };
    document.getElementById("login-user").addEventListener("keydown", onEnter);
    document.getElementById("login-pass").addEventListener("keydown", onEnter);
    btn.addEventListener("click", async ()=>{
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value;
      const err = document.getElementById("login-err");
      err.textContent = "";
      if (!u || !p){ err.textContent = "Enter username and password"; return; }
      try{
        const user = await DB.authenticate(u, p);
        if (!user){ err.textContent = "Invalid credentials"; return; }
        this.user = user;
        this.start();
      }catch(e){
        err.textContent = "Login error: " + e.message;
      }
    });
  },

  bindMisc(){
    const fab = document.getElementById("cart-fab");
    if (fab) fab.addEventListener("click", ()=>POSPage.openCartSheet());
    const refresh = ()=>{ POSPage.updateCartFab(); PWA.refreshButton(); };
    window.addEventListener("resize", refresh);
    window.addEventListener("orientationchange", ()=>setTimeout(refresh, 200));

    window.addEventListener("online", ()=>{
      SyncStatus.set(CloudDB.ready ? "synced" : "local",
        CloudDB.ready ? "Back online" : "Offline — local data only");
    });
    window.addEventListener("offline", ()=>{
      SyncStatus.set("local", "Offline — changes will sync when back online");
    });

    document.getElementById("theme-btn").addEventListener("click", ()=>{
      const cur = DB.settings.theme || "light";
      const next = cur === "light" ? "dark" : "light";
      DB.settings.theme = next;
      DB.save("settings");
      Persist.putObject("settings", DB.settings);
      this.applyTheme(next);
      const sel = document.getElementById("s-theme");
      if (sel) sel.value = next;
    });

    document.querySelectorAll(".navbtn").forEach(b=>{
      b.addEventListener("click", ()=>this.nav(b.dataset.page));
    });
  },

  start(){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").classList.add("on");
    const initials = (this.user.full_name || this.user.username)
      .split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join("") || "US";
    document.getElementById("user-avatar").textContent = initials;
    document.getElementById("user-who").textContent =
      `${this.user.full_name || this.user.username}  •  ${this.user.role}`;

    if (!this._pagesInited){
      try{ POSPage.init(); }catch(e){ console.error("POSPage.init", e); }
      try{ ProductsPage.init(); }catch(e){ console.error("ProductsPage.init", e); }
      try{ CustomersPage.init(); }catch(e){ console.error("CustomersPage.init", e); }
      try{ ExpensesPage.init(); }catch(e){ console.error("ExpensesPage.init", e); }
      try{ ReportsPage.init(); }catch(e){ console.error("ReportsPage.init", e); }
      try{ SettingsPage.init(); }catch(e){ console.error("SettingsPage.init", e); }
      this._pagesInited = true;
    }
    this.nav("pos");
    PWA.refreshButton();
  },

  nav(page){
    this.page = page;
    document.querySelectorAll(".navbtn").forEach(b=>{
      b.classList.toggle("active", b.dataset.page === page);
    });
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    const el = document.getElementById("page-" + page);
    if (el) el.classList.add("on");
    const titles = { pos:"POS", products:"Products", customers:"Customers",
                     expenses:"Expenses", reports:"Reports", settings:"Settings" };
    document.getElementById("page-title").textContent = titles[page] || page;

    try{
      if (page === "pos"){
        POSPage.renderTabs(); POSPage.renderProducts(); POSPage.recalc();
        if (!isMobile()) POSPage.closeCartSheet();
      } else if (page === "products") ProductsPage.render();
      else if (page === "customers")  CustomersPage.render();
      else if (page === "expenses")   ExpensesPage.render();
      else if (page === "reports")    ReportsPage.render();
      else if (page === "settings")   SettingsPage.renderUsers();
    }catch(e){ console.error("nav render error:", e); }

    POSPage.updateCartFab();
  },

  /* ── called whenever a remote change lands ── */
  scheduleSyncRefresh(){
    if (this._syncTimer) return;
    this._syncTimer = setTimeout(()=>{
      this._syncTimer = null;
      this.refreshAfterSync();
    }, 250);
  },

  refreshAfterSync(){
    if (!this._pagesInited) return;
    try{
      if (this.page === "pos"){
        POSPage.refreshCategories();
        POSPage.renderProducts();
        POSPage.renderTabs();
      } else if (this.page === "products")  ProductsPage.render();
      else if (this.page === "customers")   CustomersPage.render();
      else if (this.page === "expenses")    ExpensesPage.render();
      else if (this.page === "reports")     ReportsPage.render();
      else if (this.page === "settings")    SettingsPage.renderUsers();
    }catch(e){ console.warn("refreshAfterSync:", e); }
  },

  applyTheme(theme){
    document.body.classList.toggle("dark", theme === "dark");
    if (DB.settings) DB.settings.theme = theme;
    const mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute("content", theme === "dark" ? "#0a0f1c" : "#0f172a");
  },
};

window.addEventListener("error", e=>{
  console.error("Global error:", e.error || e.message);
});
window.addEventListener("unhandledrejection", e=>{
  console.error("Unhandled rejection:", e.reason);
});

window.addEventListener("DOMContentLoaded", ()=>{
  App.init().catch(err=>{
    console.error("Init failed:", err);
    const el = document.getElementById("login-err");
    if (el) el.textContent = "Startup error: " + (err.message || err);
    /* Never leave the operator locked out — fall back to local data. */
    try{
      if (!App._pagesInited){
        App.bindLogin(); App.bindMisc();
      }
    }catch(e){}
  });
});
</script>
</body>
</html>
